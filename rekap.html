<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rekap Global - CV EJA</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        body { background: #000; color: white; font-family: 'Inter', sans-serif; }
        .input-dark { background: #0a0a0a; border: 1px solid #222; color: white; border-radius: 1rem; padding: 12px; font-size: 12px; width: 100%; }
        .card-rekap { background: #0a0a0a; border: 1px solid #1a1a1a; border-radius: 1.5rem; padding: 1.25rem; }
    </style>
</head>
<body class="p-6">
    <div class="flex items-center gap-4 mb-8">
        <button onclick="location.href='dashboard.html'" class="text-gray-500"><i class="fas fa-arrow-left"></i></button>
        <h1 class="text-xl font-black italic tracking-tighter uppercase">Rekap Global</h1>
    </div>

    <div class="card-rekap mb-6">
        <div class="grid grid-cols-2 gap-3 mb-4">
            <div><label class="text-[8px] font-bold text-gray-500 uppercase">Mulai</label><input type="date" id="start" class="input-dark"></div>
            <div><label class="text-[8px] font-bold text-gray-500 uppercase">Sampai</label><input type="date" id="end" class="input-dark"></div>
        </div>
        <button onclick="load()" class="w-full bg-blue-700 text-white font-black py-3 rounded-xl uppercase text-[10px]">Tampilkan Laporan</button>
    </div>

    <div id="results" class="space-y-3"></div>

<script>
    // GANTI URL DI BAWAH INI DENGAN URL DEPLOY TERBARU BOSS
    const API = "https://script.google.com/macros/s/AKfycbweR2qCuqWKC7gCXaEUjFaLlT1XgaWGBKulYlJ92EuLfgtU_c0N4ZNoh2Beve3bePwg/exec";

    async function load() {
        const resDiv = document.getElementById('results');
        resDiv.innerHTML = '<p class="text-center animate-pulse text-[10px]">MENYAMBUNGKAN KE DATABASE...</p>';
        
        try {
            const url = `${API}?action=getRekapGlobal&start=${document.getElementById('start').value}&end=${document.getElementById('end').value}&kapal=SEMUA`;
            const r = await fetch(url);
            const d = await r.json();

            if(d.data.length === 0) {
                resDiv.innerHTML = '<p class="text-center text-gray-600 text-[10px]">TIDAK ADA DATA</p>';
                return;
            }

            resDiv.innerHTML = d.data.map(i => `
                <div class="card-rekap flex justify-between items-center ${i.tipe === 'IN' ? 'border-r-4 border-green-600' : 'border-r-4 border-red-600'}">
                    <div>
                        <p class="text-[8px] text-gray-500 font-bold uppercase">${i.tDisplay} | ${i.kapal}</p>
                        <p class="text-sm font-black italic uppercase">${i.item}</p>
                    </div>
                    <p class="font-black ${i.tipe === 'IN' ? 'text-green-500' : 'text-red-500'}">Rp ${i.total.toLocaleString()}</p>
                </div>
            `).join('');
        } catch(e) {
            resDiv.innerHTML = '<p class="text-center text-red-500 text-[10px]">KONEKSI GAGAL. CEK URL API BOSS.</p>';
        }
    }
</script>
</body>
</html>
