<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>REKAP GLOBAL - CV EJA</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        body { background: #000; color: white; font-family: sans-serif; }
        .card { background: #0a0a0a; border: 1px solid #222; border-radius: 1rem; padding: 1rem; }
    </style>
</head>
<body class="p-5">
    <div class="flex justify-between items-center mb-6">
        <h1 class="text-xl font-bold italic text-blue-500">REKAP GLOBAL EJA</h1>
        <button onclick="fetchData()" class="bg-blue-600 px-4 py-2 rounded-lg text-xs font-bold">REFRESH DATA</button>
    </div>

    <div class="grid grid-cols-2 gap-3 mb-6">
        <div class="card border-l-4 border-green-500">
            <p class="text-[10px] text-gray-400 uppercase">Pemasukan</p>
            <p id="t-in" class="text-lg font-bold text-green-500">Rp 0</p>
        </div>
        <div class="card border-l-4 border-red-500">
            <p class="text-[10px] text-gray-400 uppercase">Pengeluaran</p>
            <p id="t-out" class="text-lg font-bold text-red-500">Rp 0</p>
        </div>
    </div>

    <div id="loading" class="text-center py-10 hidden"><i class="fas fa-spinner fa-spin"></i> Loading...</div>
    <div id="list" class="space-y-3"></div>

<script>
    // MASUKKAN URL BARU DISINI BOSS!
    const API = "https://script.google.com/macros/s/AKfycby-WfRG8NX0DCs3rLG5MQGgtsvCETHpSC7dbnICqNY4FHKdB3dG2W7eRsR0VZ_-dvsm/exec";

    async function fetchData() {
        document.getElementById('loading').classList.remove('hidden');
        try {
            const r = await fetch(API + "?action=getRekapGlobal");
            const res = await r.json();
            
            document.getElementById('t-in').innerText = "Rp " + res.summary.total_in.toLocaleString();
            document.getElementById('t-out').innerText = "Rp " + res.summary.total_out.toLocaleString();
            
            document.getElementById('list').innerHTML = res.data.map(i => `
                <div class="card flex justify-between items-center border-r-4 ${i.tipe === 'IN' ? 'border-green-600' : 'border-red-600'}">
                    <div>
                        <p class="text-[10px] text-gray-500">${i.tDisplay} | ${i.kapal}</p>
                        <p class="text-sm font-bold uppercase">${i.item}</p>
                    </div>
                    <p class="font-bold ${i.tipe === 'IN' ? 'text-green-500' : 'text-red-500'}">
                        Rp ${i.total.toLocaleString()}
                    </p>
                </div>
            `).join('');
        } catch (e) { alert("Koneksi Gagal. Cek URL API Boss."); }
        document.getElementById('loading').classList.add('hidden');
    }
    window.onload = fetchData;
</script>
</body>
</html>
