<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rekap Global - CV EJA</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap');
        body { background: #000; color: #fff; font-family: 'Plus Jakarta Sans', sans-serif; }
        .card-exec { background: #0a0a0a; border: 1px solid #1a1a1a; border-radius: 1rem; }
        .input-exec { background: #111; border: 1px solid #222; color: #fff; border-radius: 0.75rem; padding: 12px; width: 100%; }
        
        /* DESAIN CETAK UNTUK OWNER */
        @media print {
            .no-print { display: none !important; }
            body { background: white !important; color: black !important; padding: 2cm; }
            .card-exec { border: none !important; background: transparent !important; color: black !important; padding: 0 !important; }
            .print-header { display: block !important; border-bottom: 2px solid #000; margin-bottom: 20px; padding-bottom: 10px; }
            .data-row { border-bottom: 1px solid #eee !important; color: black !important; padding: 10px 0 !important; }
            .text-green-500, .text-red-500, .text-blue-500 { color: black !important; }
            .summary-box { display: grid !important; grid-template-cols: 1fr 1fr 1fr; gap: 20px; margin-bottom: 30px; border: 1px solid #000; padding: 15px; }
        }
        .print-header { display: none; }
    </style>
</head>
<body class="p-5">

    <div class="flex justify-between items-center mb-6 no-print">
        <button onclick="location.href='dashboard.html'" class="w-10 h-10 card-exec flex items-center justify-center">
            <i class="fas fa-chevron-left text-gray-500"></i>
        </button>
        <h1 class="text-lg font-extrabold italic uppercase tracking-tighter">Executive Rekap</h1>
        <button onclick="window.print()" id="btn-print" class="hidden w-10 h-10 card-exec flex items-center justify-center text-blue-500">
            <i class="fas fa-print"></i>
        </button>
    </div>

    <div class="grid grid-cols-3 gap-2 mb-6 no-print">
        <div class="card-exec p-3 text-center border-b-2 border-blue-600">
            <p class="text-[8px] font-bold text-gray-500 uppercase">Hari Ini</p>
            <p id="out-today" class="text-[10px] font-extrabold mt-1">Rp 0</p>
        </div>
        <div class="card-exec p-3 text-center border-b-2 border-purple-600">
            <p class="text-[8px] font-bold text-gray-500 uppercase">Minggu Ini</p>
            <p id="out-week" class="text-[10px] font-extrabold mt-1">Rp 0</p>
        </div>
        <div class="card-exec p-3 text-center border-b-2 border-orange-600">
            <p class="text-[8px] font-bold text-gray-500 uppercase">Bulan Ini</p>
            <p id="out-month" class="text-[10px] font-extrabold mt-1">Rp 0</p>
        </div>
    </div>

    <div class="card-exec p-5 mb-6 no-print">
        <div class="grid grid-cols-2 gap-3 mb-4">
            <input type="date" id="start-date" class="input-exec text-xs">
            <input type="date" id="end-date" class="input-exec text-xs">
        </div>
        <select id="filter-tipe" class="input-exec mb-4 font-bold text-blue-500 text-xs">
            <option value="SEMUA">SEMUA TRANSAKSI</option>
            <option value="IN">PEMASUKAN SAJA</option>
            <option value="OUT">PENGELUARAN SAJA</option>
        </select>
        <button id="btn-tampilkan" class="w-full bg-blue-600 py-4 rounded-xl font-black uppercase text-[11px] tracking-widest shadow-lg shadow-blue-900/30">
            Tampilkan Laporan
        </button>
    </div>

    <div class="print-header text-center">
        <h1 class="text-2xl font-bold">LAPORAN REKAPITULASI GLOBAL</h1>
        <p class="text-sm uppercase font-bold">CV. EFENDY JAYA ABADI</p>
        <p id="print-range" class="text-xs mt-2"></p>
    </div>

    <div id="summary" class="hidden grid grid-cols-2 gap-3 mb-6 summary-box">
        <div class="card-exec p-4 border-l-4 border-green-600">
            <p class="text-[9px] font-bold text-gray-500 uppercase">Total Pemasukan</p>
            <p id="total-in" class="text-lg font-extrabold text-green-500">Rp 0</p>
        </div>
        <div class="card-exec p-4 border-l-4 border-red-600">
            <p class="text-[9px] font-bold text-gray-500 uppercase">Total Pengeluaran</p>
            <p id="total-out" class="text-lg font-extrabold text-red-500">Rp 0</p>
        </div>
    </div>

    <div id="list" class="space-y-3">
        <p id="msg" class="text-center py-10 text-gray-600 text-[10px] font-bold uppercase tracking-[0.3em]">Menunggu filter...</p>
    </div>

<script>
    const API_URL = "https://script.google.com/macros/s/AKfycby-WfRG8NX0DCs3rLG5MQGgtsvCETHpSC7dbnICqNY4FHKdB3dG2W7eRsR0VZ_-dvsm/exec"; // GANTI DENGAN URL API BOSS

    // Load Stats Otomatis
    async function loadStats() {
        try {
            const res = await fetch(`${API_URL}?action=getRekapGlobal&start=01/01/2020&end=31/12/2030&kapal=SEMUA`);
            const json = await res.json();
            const now = new Date().getTime();
            const oneDay = 24 * 60 * 60 * 1000;
            const oneWeek = oneDay * 7;
            const oneMonth = oneDay * 30;

            let d=0, w=0, m=0;
            json.data.filter(i => i.tipe === "OUT").forEach(i => {
                const gap = now - i.tSort;
                if(gap <= oneDay) d += i.total;
                if(gap <= oneWeek) w += i.total;
                if(gap <= oneMonth) m += i.total;
            });
            document.getElementById('out-today').innerText = `Rp ${d.toLocaleString('id-ID')}`;
            document.getElementById('out-week').innerText = `Rp ${w.toLocaleString('id-ID')}`;
            document.getElementById('out-month').innerText = `Rp ${m.toLocaleString('id-ID')}`;
        } catch(e) { console.log("Stats error"); }
    }
    window.onload = loadStats;

    // Perbaikan Tombol Tampilkan Laporan
    document.getElementById('btn-tampilkan').addEventListener('click', async () => {
        const sRaw = document.getElementById('start-date').value;
        const eRaw = document.getElementById('end-date').value;
        const tipe = document.getElementById('filter-tipe').value;
        const list = document.getElementById('list');
        const sum = document.getElementById('summary');
        const btnPrint = document.getElementById('btn-print');

        if(!sRaw || !eRaw) return alert("Pilih tanggal dulu, Boss!");

        list.innerHTML = '<div class="text-center py-10"><i class="fas fa-spinner fa-spin text-blue-500"></i></div>';
        
        try {
            const sIndo = sRaw.split("-").reverse().join("/");
            const eIndo = eRaw.split("-").reverse().join("/");
            document.getElementById('print-range').innerText = `Periode: ${sIndo} s/d ${eIndo}`;

            const r = await fetch(`${API_URL}?action=getRekapGlobal&start=${sIndo}&end=${eIndo}&kapal=SEMUA`);
            const res = await r.json();

            let filtered = res.data;
            if(tipe !== "SEMUA") filtered = res.data.filter(x => x.tipe === tipe);

            if(filtered.length === 0) { list.innerHTML = "DATA KOSONG"; return; }

            sum.classList.remove('hidden');
            btnPrint.classList.remove('hidden');
            
            let tin = 0, tout = 0;
            filtered.forEach(i => i.tipe === "IN" ? tin += i.total : tout += i.total);
            document.getElementById('total-in').innerText = `Rp ${tin.toLocaleString('id-ID')}`;
            document.getElementById('total-out').innerText = `Rp ${tout.toLocaleString('id-ID')}`;

            list.innerHTML = filtered.map(i => `
                <div class="card-exec p-4 flex justify-between items-center data-row border-r-4 ${i.tipe === 'IN' ? 'border-green-600' : 'border-red-600'}">
                    <div>
                        <p class="text-[8px] text-gray-500 font-bold uppercase">${i.tDisplay} | ${i.kapal}</p>
                        <p class="text-[11px] font-black uppercase italic">${i.item}</p>
                    </div>
                    <p class="text-[11px] font-black ${i.tipe === 'IN' ? 'text-green-500' : 'text-red-500'}">
                        ${i.total.toLocaleString('id-ID')}
                    </p>
                </div>
            `).join('');

        } catch (e) { list.innerHTML = "GAGAL MEMUAT DATA"; }
    });
</script>
</body>
</html>
