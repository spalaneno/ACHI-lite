<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OWNER CONTROL - ACHI SYSTEM</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap');
        body { background: #000; color: #fff; font-family: 'Plus Jakarta Sans', sans-serif; }
        .card-exec { background: #0a0a0a; border: 1px solid #1a1a1a; border-radius: 1rem; }
        .tab-active { border-bottom: 3px solid #3b82f6; color: #3b82f6; font-weight: 800; }
        .p-photo { width: 40px; height: 40px; border-radius: 50%; border: 2px solid #3b82f6; background: #222; overflow: hidden; }
        .p-letter { width: 40px; height: 40px; border-radius: 50%; background: #3b82f6; display: flex; align-items: center; justify-content: center; font-weight: 900; font-size: 18px; color: #fff; border: 2px solid #1e3a8a; }
        @media print { .no-print { display: none !important; } body { background: white !important; color: black !important; } }
    </style>
</head>
<body class="p-5">

    <div class="flex justify-between items-center mb-6 no-print">
        <div class="flex items-center gap-4">
            <button onclick="location.href='dashboard.html'" class="w-10 h-10 card-exec flex items-center justify-center">
                <i class="fas fa-chevron-left text-gray-500"></i>
            </button>
            <div>
                <h1 class="text-lg font-black italic uppercase tracking-tighter leading-none">ACHI SYSTEM</h1>
                <p class="text-[8px] text-blue-500 font-bold tracking-widest uppercase">Executive Panel</p>
            </div>
        </div>

        <div class="flex items-center gap-2">
            <div class="text-right mr-2 hidden sm:block">
                <p class="text-[9px] font-black uppercase leading-none">BOSS ONLINE</p>
            </div>
            <div class="p-letter shadow-lg shadow-blue-900/40">A</div>
            <div class="p-photo">
                <img src="https://via.placeholder.com/40" class="w-full h-full object-cover" alt="User">
            </div>
            <button onclick="logout()" class="w-10 h-10 card-exec flex items-center justify-center ml-2 border-red-900/30 hover:bg-red-900/20">
                <i class="fas fa-sign-out-alt text-red-600"></i>
            </button>
        </div>
    </div>

    <div class="flex space-x-6 mb-6 border-b border-gray-900 pb-2 no-print text-[10px] uppercase font-bold tracking-widest">
        <button onclick="switchTab('rekap')" id="tab-rekap" class="pb-2 text-gray-500">Laporan Keuangan</button>
        <button onclick="switchTab('persetujuan')" id="tab-persetujuan" class="tab-active pb-2">Persetujuan</button>
    </div>

    <div id="section-persetujuan" class="block">
        <div id="persetujuan-list" class="space-y-4 pb-20">
            <p class="text-center py-20 text-gray-700 font-bold text-[10px] uppercase">Sinkronisasi...</p>
        </div>
    </div>

    <div id="section-rekap" class="hidden no-print">
        <div class="card-exec p-5 mb-4 text-center">
             <p class="text-[10px] text-gray-500 font-bold uppercase">Arsip Data Financial</p>
        </div>
    </div>

<script>
    const API_URL = "https://script.google.com/macros/s/AKfycbxi_XUwSAzNwwfx3VgL89-NsxRR3xdROoG0CUQ9Z1zYAVGRWWye2fJIOu0l2tHOY15Q/exec";

    function switchTab(t) {
        document.getElementById('section-rekap').style.display = (t === 'rekap') ? 'block' : 'none';
        document.getElementById('section-persetujuan').style.display = (t === 'persetujuan') ? 'block' : 'none';
        document.getElementById('tab-rekap').className = (t === 'rekap') ? 'tab-active pb-2' : 'pb-2 text-gray-500';
        document.getElementById('tab-persetujuan').className = (t === 'persetujuan') ? 'tab-active pb-2' : 'pb-2 text-gray-500';
        if(t === 'persetujuan') loadPersetujuan();
    }

    async function loadPersetujuan() {
        const container = document.getElementById('persetujuan-list');
        try {
            const r = await fetch(`${API_URL}?action=getRekapGlobal`);
            const res = await r.json();
            const pending = res.data.filter(i => i.status === "PENDING");

            if(pending.length === 0) {
                container.innerHTML = `<p class="text-center py-20 text-gray-600 font-bold text-[10px] uppercase">✅ Tidak ada antrian</p>`;
                return;
            }

            container.innerHTML = pending.map(i => `
                <div class="card-exec p-4 flex justify-between items-center border-l-4 border-blue-600">
                    <div>
                        <p class="text-[8px] text-gray-500 font-bold uppercase">${i.tDisplay} | ${i.kapal}</p>
                        <h2 class="text-sm font-black uppercase italic">${i.barang}</h2>
                        <p class="text-blue-400 font-bold text-sm">Rp ${parseFloat(i.harga).toLocaleString('id-ID')}</p>
                    </div>
                    <button onclick="setujuiOtomatis('${i.kapal}', '${i.barang}', this)" class="bg-blue-600 px-6 py-3 rounded-xl font-black text-[10px] uppercase shadow-lg shadow-blue-900/20">SETUJUI</button>
                </div>
            `).join('');
        } catch(e) { container.innerHTML = "Gagal memuat database."; }
    }

    async function setujuiOtomatis(kapal, barang, btn) {
        btn.innerText = "PROSES..."; btn.disabled = true;
        try {
            // FIX TERAKHIR: Menggunakan mode 'no-cors' tidak akan mengembalikan text, 
            // jadi kita gunakan POST biasa dengan header text/plain.
            const response = await fetch(API_URL, {
                method: 'POST',
                mode: 'cors',
                headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                body: JSON.stringify({ kapal: kapal, barang: barang })
            });
            const result = await response.text();
            if (result.includes("SUCCESS")) {
                alert("BERHASIL DISETUJUI!");
                loadPersetujuan();
            } else { 
                alert("Gagal update. Coba lagi."); 
                btn.innerText = "SETUJUI"; btn.disabled = false; 
            }
        } catch (e) { 
            alert("Error Koneksi! Pastikan Deployment Apps Script sudah 'Anyone'."); 
            btn.innerText = "SETUJUI"; btn.disabled = false; 
        }
    }

    function logout() { if(confirm("Keluar dari Executive Panel?")) location.href = 'index.html'; }

    loadPersetujuan();
</script>
</body>
</html>
