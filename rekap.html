<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MENU PERSETUJUAN BOSS</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        body { background: #000; color: #fff; font-family: sans-serif; }
        .kartu-data { background: #0a0a0a; border: 1px solid #1a1a1a; border-radius: 12px; padding: 15px; margin-bottom: 10px; border-left: 4px solid #3b82f6; }
        .tombol-setuju { background: #2563eb; color: #fff; padding: 8px 15px; border-radius: 6px; font-weight: bold; font-size: 12px; }
        .teks-merah { color: #ef4444; font-weight: bold; animation: kedip 1s infinite; }
        @keyframes kedip { 50% { opacity: 0.5; } }
    </style>
</head>
<body class="p-5">

    <div class="mb-6">
        <h1 class="text-xl font-black italic uppercase">MENU PERSETUJUAN BOSS</h1>
        <p class="text-blue-500 text-[10px] font-bold">DAFTAR TUNGGU KONFIRMASI</p>
    </div>

    <div id="daftar-persetujuan">
        <p class="text-gray-600 text-sm italic">Sedang mengambil data PENDING dari Excel...</p>
    </div>

<script>
    // Link API Boss
    const API_URL = "https://script.google.com/macros/s/AKfycby-WfRG8NX0DCs3rLG5MQGgtsvCETHpSC7dbnICqNY4FHKdB3dG2W7eRsR0VZ_-dvsm/exec";
    const NO_WA_BOSS = "6282216666617"; 

    async function ambilData() {
        try {
            const respon = await fetch(`${API_URL}?action=getRekapGlobal&start=01/01/2026&end=31/12/2026&kapal=SEMUA`);
            const hasil = await respon.json();
            const area = document.getElementById('daftar-persetujuan');

            // CARI DATA YANG STATUSNYA 'PENDING' (KOLOM M)
            const dataPending = hasil.data.filter(i => i.status === "PENDING");

            if(dataPending.length === 0) {
                area.innerHTML = "<p class='text-center py-20 text-gray-700 uppercase font-bold text-xs'>✅ Tidak ada permintaan pending</p>";
                return;
            }

            area.innerHTML = dataPending.map(i => {
                // Logika Notifikasi 10 Menit
                const jamInput = new Date(i.tSort).getTime();
                const jamSekarang = new Date().getTime();
                const selisih = (jamSekarang - jamInput) / (1000 * 60);

                // Kirim WA Otomatis jika sudah > 10 menit dan belum pernah dikirim
                if (selisih > 10 && !localStorage.getItem('wa_' + i.tSort)) {
                    kirimWA(i);
                }

                return `
                    <div class="kartu-data ${selisih > 10 ? 'border-red-600' : ''}">
                        <div class="flex justify-between items-center">
                            <div>
                                ${selisih > 10 ? '<p class="teks-merah text-[9px] mb-1">⚠️ LEBIH DARI 10 MENIT</p>' : ''}
                                <p class="text-gray-500 text-[9px] uppercase font-bold">${i.kapal}</p>
                                <h2 class="text-sm font-black uppercase">${i.item}</h2>
                                <p class="text-blue-500 font-bold text-sm">Rp ${i.total.toLocaleString('id-ID')}</p>
                            </div>
                            <button onclick="setujui('${i.kapal}', '${i.item}', '${i.total}')" class="tombol-setuju">SETUJUI</button>
                        </div>
                    </div>
                `;
            }).join('');
        } catch (e) {
            document.getElementById('daftar-persetujuan').innerHTML = "Koneksi Bermasalah";
        }
    }

    function setujui(kapal, barang, harga) {
        const teks = `*PERSETUJUAN BOSS*%0A%0ASaya SETUJU untuk pembelian:%0A🚢 Kapal: ${kapal}%0A📦 Barang: ${barang}%0A💰 Nilai: Rp ${parseInt(harga).toLocaleString('id-ID')}%0A%0ASilakan diproses.`;
        window.open(`https://wa.me/${NO_WA_BOSS}?text=${teks}`, '_blank');
    }

    function kirimWA(item) {
        localStorage.setItem('wa_' + item.tSort, 'sent');
        const teksNotif = `⚠️ *REMINDER BOSS*%0A%0APermintaan *${item.item}* (${item.kapal}) sudah PENDING lebih dari 10 menit!%0A%0AMohon segera cek dashboard.`;
        window.open(`https://wa.me/${NO_WA_BOSS}?text=${teksNotif}`, '_blank');
    }

    ambilData();
    setInterval(ambilData, 60000); // Update setiap 1 menit
</script>
</body>
</html>
