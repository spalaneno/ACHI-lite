<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rekap Global - CV EJA</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        body { background: #000; color: white; font-family: 'Inter', sans-serif; }
        .input-dark { background: #0a0a0a; border: 1px solid #222; color: white; border-radius: 1rem; padding: 12px; font-size: 12px; width: 100%; }
        .card-rekap { background: #0a0a0a; border: 1px solid #1a1a1a; border-radius: 1.5rem; padding: 1.25rem; }
        
        /* CSS Khusus Print */
        @media print {
            .no-print { display: none !important; }
            body { background: white !important; color: black !important; }
            .card-rekap { border: 1px solid #ddd !important; margin-bottom: 10px !important; break-inside: avoid; }
            .text-green-500, .text-red-500 { color: black !important; font-weight: bold; }
        }
    </style>
</head>
<body class="p-6">
    <div class="flex items-center justify-between mb-8 no-print">
        <div class="flex items-center gap-4">
            <button onclick="location.href='dashboard.html'" class="text-gray-500"><i class="fas fa-arrow-left"></i></button>
            <h1 class="text-xl font-black italic tracking-tighter uppercase">Rekap Global</h1>
        </div>
        <div id="action-buttons" class="hidden flex gap-2">
            <button onclick="downloadCSV()" class="p-2 bg-gray-900 rounded-lg text-blue-500 border border-blue-900/30 text-xs">
                <i class="fas fa-file-excel"></i>
            </button>
            <button onclick="window.print()" class="p-2 bg-gray-900 rounded-lg text-white border border-gray-700 text-xs">
                <i class="fas fa-print"></i> PDF
            </button>
        </div>
    </div>

    <div class="card-rekap mb-6 no-print">
        <div class="grid grid-cols-2 gap-3 mb-4">
            <div><label class="text-[8px] font-bold text-gray-500 uppercase">Mulai</label><input type="date" id="start" class="input-dark"></div>
            <div><label class="text-[8px] font-bold text-gray-500 uppercase">Sampai</label><input type="date" id="end" class="input-dark"></div>
        </div>
        <button onclick="load()" class="w-full bg-blue-700 text-white font-black py-3 rounded-xl uppercase text-[10px]">Tampilkan Laporan</button>
    </div>

    <div id="print-area">
        <div id="header-print" class="hidden mb-6">
            <h2 class="text-center font-bold uppercase underline">LAPORAN REKAPITULASI GLOBAL - CV EJA</h2>
            <p id="periode-print" class="text-center text-xs"></p>
        </div>
        
        <div id="results" class="space-y-3">
            <p class="text-center text-gray-600 text-[10px] no-print">Tentukan tanggal untuk melihat data.</p>
        </div>
    </div>

<script>
    const API = "https://script.google.com/macros/s/AKfycbzk03FnZDF_z2F8MNzUDF42WM6pzxsHZMufwRNNg-ejDMb9ri86iEKeSUqQGXU81T0-/exec";
    let currentData = [];

    async function load() {
        const resDiv = document.getElementById('results');
        const btnArea = document.getElementById('action-buttons');
        resDiv.innerHTML = '<p class="text-center animate-pulse text-[10px]">MENYAMBUNGKAN KE DATABASE...</p>';
        
        try {
            const start = document.getElementById('start').value;
            const end = document.getElementById('end').value;
            const url = `${API}?action=getRekapGlobal&start=${start}&end=${end}&kapal=SEMUA`;
            
            const r = await fetch(url);
            const d = await r.json();
            currentData = d.data;

            if(currentData.length === 0) {
                resDiv.innerHTML = '<p class="text-center text-gray-600 text-[10px]">TIDAK ADA DATA</p>';
                btnArea.classList.add('hidden');
                return;
            }

            btnArea.classList.remove('hidden');
            document.getElementById('periode-print').innerText = `Periode: ${start} s/d ${end}`;

            resDiv.innerHTML = currentData.map(i => `
                <div class="card-rekap flex justify-between items-center ${i.tipe === 'IN' ? 'border-r-4 border-green-600' : 'border-r-4 border-red-600'}">
                    <div>
                        <p class="text-[8px] text-gray-500 font-bold uppercase">${i.tDisplay} | ${i.kapal}</p>
                        <p class="text-sm font-black italic uppercase">${i.item}</p>
                    </div>
                    <p class="font-black ${i.tipe === 'IN' ? 'text-green-500' : 'text-red-500'}">Rp ${i.total.toLocaleString()}</p>
                </div>
            `).join('');
        } catch(e) {
            resDiv.innerHTML = '<p class="text-center text-red-500 text-[10px]">KONEKSI GAGAL.</p>';
        }
    }

    function downloadCSV() {
        let csv = "Tanggal,Kapal,Item,Tipe,Total\n";
        currentData.forEach(row => {
            csv += `${row.tDisplay},${row.kapal},${row.item},${row.tipe},${row.total}\n`;
        });

        const blob = new Blob([csv], { type: 'text/csv' });
        const url = window.URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.setAttribute('hidden', '');
        a.setAttribute('href', url);
        a.setAttribute('download', `Rekap_EJA_${new Date().toLocaleDateString()}.csv`);
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
    }
</script>
</body>
</html>
