<div class="p-6 max-w-7xl mx-auto">
    <div class="flex justify-between items-end mb-6">
        <div>
            <h2 class="text-2xl font-black text-white">LAPORAN KEUANGAN</h2>
            <p class="text-zinc-400 text-sm">Aplikasi Crewing & Handling Integrasi</p>
        </div>
        <button onclick="window.print()" class="bg-emerald-600 hover:bg-emerald-500 text-white px-4 py-2 rounded-lg font-bold flex items-center gap-2 transition-all">
            <i class="fas fa-print"></i> CETAK LAPORAN
        </button>
    </div>

    <div class="glass-card p-6 mb-8 grid grid-cols-1 md:grid-cols-5 gap-4">
        <div>
            <label class="text-[10px] text-zinc-500 font-bold uppercase">Armada</label>
            <select id="fKapal" class="w-full bg-zinc-900 text-white p-2 rounded border border-zinc-700">
                <option value="Semua">Semua Kapal</option>
                <option value="KM. NABAWI 09">KM. NABAWI 09</option>
                <option value="KM. SRIKANDI 01">KM. SRIKANDI 01</option>
                <option value="KM. LASTIKA STAR">KM. LASTIKA STAR</option>
            </select>
        </div>
        <div>
            <label class="text-[10px] text-zinc-500 font-bold uppercase">Trip</label>
            <input type="number" id="fTrip" placeholder="No. Trip" class="w-full bg-zinc-900 text-white p-2 rounded border border-zinc-700">
        </div>
        <div>
            <label class="text-[10px] text-zinc-500 font-bold uppercase">Dari Tanggal</label>
            <input type="date" id="fStart" class="w-full bg-zinc-900 text-white p-2 rounded border border-zinc-700">
        </div>
        <div>
            <label class="text-[10px] text-zinc-500 font-bold uppercase">Sampai Tanggal</label>
            <input type="date" id="fEnd" class="w-full bg-zinc-900 text-white p-2 rounded border border-zinc-700">
        </div>
        <div>
            <label class="text-[10px] text-zinc-500 font-bold uppercase">Pencarian Cepat</label>
            <input type="text" id="fSearch" placeholder="Cari barang, harga, dll..." class="w-full bg-zinc-900 text-white p-2 rounded border border-zinc-700">
        </div>
    </div>

    <div class="overflow-x-auto shadow-2xl rounded-xl border border-zinc-800 bg-zinc-950">
        <table class="w-full text-left border-collapse" id="tableRekap">
            <thead class="bg-zinc-900 text-zinc-400 uppercase text-[10px] font-black">
                <tr>
                    <th class="p-4 border-b border-zinc-800">Tgl</th>
                    <th class="p-4 border-b border-zinc-800">Kapal</th>
                    <th class="p-4 border-b border-zinc-800">Kategori</th>
                    <th class="p-4 border-b border-zinc-800">Rincian Barang</th>
                    <th class="p-4 border-b border-zinc-800">Qty</th>
                    <th class="p-4 border-b border-zinc-800 text-right">Harga</th>
                    <th class="p-4 border-b border-zinc-800 text-right">Total</th>
                </tr>
            </thead>
            <tbody id="rekapBody" class="text-xs text-white">
                </tbody>
            <tfoot id="rekapFoot" class="bg-zinc-900 font-black">
                </tfoot>
        </table>
    </div>
</div>
