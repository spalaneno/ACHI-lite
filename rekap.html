<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SISTEM KONTROL - ACHI SYSTEM</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap');
        body { background: #000; color: #fff; font-family: 'Plus Jakarta Sans', sans-serif; }
        .card-exec { background: #0a0a0a; border: 1px solid #1a1a1a; border-radius: 1rem; }
        .tab-active { border-bottom: 3px solid #2563eb; color: #2563eb; font-weight: 800; }
        .p-letter { width: 40px; height: 40px; border-radius: 50%; background: #2563eb; display: flex; align-items: center; justify-content: center; font-weight: 900; color: #fff; border: 2px solid #1e40af; }
        .input-dark { background: #111; border: 1px solid #222; padding: 12px; border-radius: 12px; font-size: 12px; color: white; outline: none; width: 100%; }
        .owner-only { display: none; } /* Default disembunyikan */
        @media print { .no-print { display: none !important; } }
    </style>
</head>
<body class="p-4">

    <div class="flex justify-between items-center mb-6 no-print">
        <div class="flex items-center gap-3">
            <button onclick="window.location.href='dashboard.html'" class="w-10 h-10 card-exec flex items-center justify-center border-gray-800"><i class="fas fa-chevron-left text-gray-500"></i></button>
            <div class="text-left">
                <h1 id="panel-title" class="text-lg font-black italic tracking-tighter leading-none uppercase italic">Panel User</h1>
                <p id="user-role" class="text-[8px] text-blue-500 font-bold uppercase tracking-widest italic italic">Achi System Access</p>
            </div>
        </div>
        <div class="flex items-center gap-2">
            <div id="user-initial" class="p-letter">-</div>
            <button onclick="logout()" class="w-10 h-10 card-exec flex items-center justify-center border-red-900/30 ml-1"><i class="fas fa-sign-out-alt text-red-600"></i></button>
        </div>
    </div>

    <div class="flex space-x-6 mb-6 border-b border-gray-900 pb-2 no-print text-[10px] uppercase font-bold tracking-widest">
        <button onclick="switchTab('rekapan')" id="btn-rekapan" class="tab-active pb-2">Rekapan Data</button>
        <button onclick="switchTab('persetujuan')" id="btn-persetujuan" class="owner-only pb-2">Persetujuan Pembelian</button>
    </div>

    <div id="section-rekapan" class="block">
        <div class="card-exec p-5 mb-5 no-print">
            <div class="space-y-4">
                <div>
                    <label class="text-[9px] font-bold text-gray-500 uppercase italic">Filter Nama Kapal</label>
                    <select id="filter-kapal" class="input-dark mt-1"><option value="SEMUA">-- SEMUA KAPAL --</option></select>
                </div>
                <div class="grid grid-cols-2 gap-3">
                    <input type="date" id="start-date" class="input-dark">
                    <input type="date" id="end-date" class="input-dark">
                </div>
                <button onclick="filterRekapan()" class="w-full bg-blue-600 py-4 rounded-xl font-black uppercase text-[11px]">Tampilkan Data</button>
            </div>
        </div>
        <div id="rekapan-list" class="space-y-2 pb-20"></div>
    </div>

    <div id="section-persetujuan" class="hidden">
        <div id="persetujuan-list" class="space-y-3 pt-2"></div>
    </div>

<script>
    const API_URL = "https://script.google.com/macros/s/AKfycbwrwf2rj_v4i8UrFMz-l5L-e-47r15I323txenXmxsDeHnzggBFwLBPoNVBMbsRNw5t/exec"; 
    let masterData = [];
    
    // 1. CEK SIAPA YANG LOGIN
    const currentUsername = localStorage.getItem("username") || "User";
    const isOwner = (currentUsername.toLowerCase() === 'hengky' || currentUsername.toLowerCase() === 'achy');

    async function init() {
        // Atur Tampilan berdasarkan Role
        document.getElementById('user-initial').innerText = currentUsername.charAt(0).toUpperCase();
        if(isOwner) {
            document.getElementById('panel-title').innerText = "Owner Dashboard";
            document.getElementById('user-role').innerText = "Executive Control";
            document.querySelectorAll('.owner-only').forEach(el => el.style.display = 'block');
        }

        try {
            const r = await fetch(`${API_URL}?action=getRekapGlobal&t=${new Date().getTime()}`);
            const res = await r.json();
            masterData = res.data;
            
            const selectKapal = document.getElementById('filter-kapal');
            const uniqueKapal = [...new Set(masterData.map(item => item.kapal))].filter(k => k).sort();
            uniqueKapal.forEach(k => { selectKapal.innerHTML += `<option value="${k}">${k}</option>`; });
            
            document.getElementById('rekapan-list').innerHTML = '<p class="text-center py-10 text-gray-700 text-[10px] uppercase italic">Pilih filter untuk melihat arsip</p>';
        } catch(e) { console.error("Koneksi Error"); }
    }

    function switchTab(t) {
        if(t === 'persetujuan' && !isOwner) return alert("Akses Ditolak!");
        document.getElementById('section-rekapan').classList.toggle('hidden', t !== 'rekapan');
        document.getElementById('section-persetujuan').classList.toggle('hidden', t !== 'persetujuan');
        document.getElementById('btn-rekapan').className = (t === 'rekapan') ? 'tab-active pb-2' : 'pb-2 text-gray-500';
        document.getElementById('btn-persetujuan').className = (t === 'persetujuan') ? 'tab-active pb-2' : 'pb-2 text-gray-500';
        if(t === 'persetujuan') renderPersetujuan();
    }

    function filterRekapan() {
        const kapal = document.getElementById('filter-kapal').value;
        const s = document.getElementById('start-date').value;
        const e = document.getElementById('end-date').value;
        if(!s || !e) return alert("Pilih Tanggal!");
        const ds = new Date(s + "T00:00:00").getTime();
        const de = new Date(e + "T23:59:59").getTime();

        let filtered = masterData.filter(i => {
            const matchDate = i.tSort >= ds && i.tSort <= de;
            const matchKapal = (kapal === "SEMUA") || (i.kapal === kapal);
            return matchDate && matchKapal;
        });

        const list = document.getElementById('rekapan-list');
        list.innerHTML = filtered.map(i => `
            <div class="card-exec p-4 flex justify-between items-center border-l-2 ${i.status === 'APPROVED' ? 'border-green-600' : 'border-gray-800'}">
                <div>
                    <p class="text-[7px] text-gray-600 font-bold uppercase">${i.tDisplay} | ${i.kapal}</p>
                    <p class="text-[10px] font-bold uppercase">${i.barang}</p>
                    <p class="text-[7px] font-black uppercase ${i.status === 'APPROVED' ? 'text-green-500' : 'text-yellow-500'} italic">${i.status}</p>
                </div>
                <p class="text-[10px] font-black">Rp ${parseFloat(i.harga).toLocaleString('id-ID')}</p>
            </div>`).join('');
    }

    function renderPersetujuan() {
        const list = document.getElementById('persetujuan-list');
        const pending = masterData.filter(i => i.status === "PENDING");
        list.innerHTML = pending.map(i => `
            <div class="card-exec p-4 flex justify-between items-center border-l-4 border-blue-600">
                <div><p class="text-[7px] text-gray-600 font-bold uppercase">${i.tDisplay} | ${i.kapal}</p><h2 class="text-xs font-black uppercase italic">${i.barang}</h2><p class="text-blue-500 font-bold text-xs">Rp ${parseFloat(i.harga).toLocaleString('id-ID')}</p></div>
                <button onclick="setujui('${i.kapal}', '${i.barang}', this)" class="bg-blue-600 px-6 py-3 rounded-xl font-black text-[9px] uppercase">SETUJUI</button>
            </div>`).join('');
    }

    async function setujui(kapal, barang, btn) {
        if(!isOwner) return alert("Hanya Owner yang bisa menyetujui!");
        btn.innerText = "WAIT"; btn.disabled = true;
        try {
            await fetch(API_URL, { method: 'POST', body: JSON.stringify({ kapal, barang }) });
            alert("SUCCESS!"); init();
        } catch (e) { alert("FAIL!"); btn.innerText = "SETUJUI"; btn.disabled = false; }
    }

    function logout() { localStorage.clear(); window.location.href = 'index.html'; }
    window.onload = init;
</script>
</body>
</html>
