<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rekap Global - CV EJA</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        body { background: #000; color: #fff; font-family: sans-serif; }
        .card-exec { background: #0a0a0a; border: 1px solid #1a1a1a; border-radius: 1.5rem; }
        .input-exec { background: #111; border: 1px solid #222; color: #fff; border-radius: 0.75rem; padding: 12px; width: 100%; font-size: 14px; }
    </style>
</head>
<body class="p-5">

    <div class="flex justify-between items-center mb-8">
        <button onclick="location.href='dashboard.html'"><i class="fas fa-arrow-left text-gray-500"></i></button>
        <h1 class="text-lg font-black italic tracking-tighter uppercase">Laporan Global</h1>
        <div class="w-5"></div>
    </div>

    <div class="card-exec p-6 mb-8">
        <div class="grid grid-cols-2 gap-4 mb-4">
            <div>
                <label class="text-[9px] font-bold text-gray-500 uppercase ml-1">Mulai</label>
                <input type="date" id="start-input" class="input-exec mt-1">
            </div>
            <div>
                <label class="text-[9px] font-bold text-gray-500 uppercase ml-1">Sampai</label>
                <input type="date" id="end-input" class="input-exec mt-1">
            </div>
        </div>
        <button onclick="prosesLaporan()" class="w-full bg-blue-600 py-4 rounded-xl font-black uppercase text-xs tracking-widest shadow-lg shadow-blue-900/20">
            Tampilkan Data (Format Indo)
        </button>
    </div>

    <div id="summary" class="hidden grid grid-cols-2 gap-4 mb-8 text-center">
        <div class="card-exec p-4 border-b-2 border-green-600">
            <p class="text-[9px] text-gray-500 uppercase">Pemasukan</p>
            <p id="total-in" class="text-md font-bold text-green-500 mt-1"></p>
        </div>
        <div class="card-exec p-4 border-b-2 border-red-600">
            <p class="text-[9px] text-gray-500 uppercase">Pengeluaran</p>
            <p id="total-out" class="text-md font-bold text-red-500 mt-1"></p>
        </div>
    </div>

    <div id="list" class="space-y-4">
        <p id="msg" class="text-center text-gray-600 text-xs py-10 uppercase font-bold tracking-widest">Pilih tanggal untuk memuat data</p>
    </div>

<script>
    // MASUKKAN URL API BOSS DI SINI
    const API_URL = "https://script.google.com/macros/s/AKfycby-WfRG8NX0DCs3rLG5MQGgtsvCETHpSC7dbnICqNY4FHKdB3dG2W7eRsR0VZ_-dvsm/exec";

    // Fungsi Pengubah Format: 2026-01-17 -> 17/01/2026
    function formatKeIndo(tgl) {
        if(!tgl) return "";
        const [y, m, d] = tgl.split("-");
        return `${d}/${m}/${y}`;
    }

    async function prosesLaporan() {
        const startRaw = document.getElementById('start-input').value;
        const endRaw = document.getElementById('end-input').value;
        const msg = document.getElementById('msg');
        const list = document.getElementById('list');
        const sum = document.getElementById('summary');

        if(!startRaw || !endRaw) return alert("Pilih tanggal dulu, Boss!");

        // Ubah format sebelum dikirim ke Google Script
        const startIndo = formatKeIndo(startRaw);
        const endIndo = formatKeIndo(endRaw);

        msg.innerHTML = `<i class="fas fa-spinner fa-spin text-blue-500"></i> <span class="ml-2 uppercase tracking-widest">Menyesuaikan Format...</span>`;
        list.innerHTML = "";
        sum.classList.add('hidden');

        try {
            // Kita kirimkan parameter startIndo dan endIndo (Format DD/MM/YYYY)
            const query = `?action=getRekapGlobal&start=${startIndo}&end=${endIndo}&kapal=SEMUA`;
            const response = await fetch(API_URL + query);
            const res = await response.json();

            if(res.data.length === 0) {
                msg.innerHTML = "DATA TIDAK DITEMUKAN (CEK FORMAT DI SPREADSHEET)";
                return;
            }

            msg.innerHTML = "";
            sum.classList.remove('hidden');
            document.getElementById('total-in').innerText = `Rp ${res.summary.total_in.toLocaleString('id-ID')}`;
            document.getElementById('total-out').innerText = `Rp ${res.summary.total_out.toLocaleString('id-ID')}`;

            list.innerHTML = res.data.map(item => `
                <div class="card-exec p-5 flex justify-between items-center">
                    <div>
                        <p class="text-[9px] text-gray-500 font-bold uppercase">${item.tDisplay} • ${item.kapal}</p>
                        <p class="text-xs font-black uppercase mt-1 italic">${item.item}</p>
                    </div>
                    <p class="text-sm font-black ${item.tipe === 'IN' ? 'text-green-500' : 'text-red-500'}">
                        ${item.tipe === 'IN' ? '+' : '-'} ${item.total.toLocaleString('id-ID')}
                    </p>
                </div>
            `).join('');

        } catch (e) {
            msg.innerHTML = "GAGAL TERHUBUNG KE DATABASE";
        }
    }
</script>
</body>
</html>
