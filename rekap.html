<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PERSERUJUAN OWNER - ACHI SYSTEM</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background: #000; color: #fff; font-family: sans-serif; }
        .card { background: #0a0a0a; border: 1px solid #1a1a1a; border-radius: 12px; padding: 15px; margin-bottom: 12px; border-left: 4px solid #ef4444; }
        .blink { animation: alert 1s infinite; }
        @keyframes alert { 50% { border-color: transparent; } }
    </style>
</head>
<body class="p-5">

    <header class="mb-8">
        <h1 class="text-xl font-black italic">MENU PERSETUJUAN</h1>
        <p class="text-blue-500 text-[10px] font-bold tracking-widest uppercase">Hanya Menampilkan Status PENDING</p>
    </header>

    <div id="list-persetujuan">
        <p class="text-center py-20 text-gray-700">Menghubungkan ke Spreadsheet...</p>
    </div>

<script>
    // MASUKKAN LINK URL DEPLOY BARU BOSS DI SINI:
    const API_URL = "https://script.google.com/macros/s/AKfycbxi_XUwSAzNwwfx3VgL89-NsxRR3xdROoG0CUQ9Z1zYAVGRWWye2fJIOu0l2tHOY15Q/exec"; 
    const NO_WA_BOSS = "6282216666617";

    async function loadData() {
        try {
            const r = await fetch(API_URL + "?action=getRekapGlobal");
            const res = await r.json();
            const container = document.getElementById('list-persetujuan');

            // FILTER: HANYA YANG STATUSNYA 'PENDING'
            const pending = res.data.filter(i => i.status === "PENDING");

            if(pending.length === 0) {
                container.innerHTML = `<div class="text-center py-20 text-gray-500 font-bold uppercase text-xs">✅ Semua Beres. Tidak ada yang Pending.</div>`;
                return;
            }

            const skrg = new Date().getTime();

            container.innerHTML = pending.map(i => {
                const selisihMenit = (skrg - i.tSort) / 60000;
                
                // OTOMATIS BUKA WA JIKA SUDAH 10 MENIT
                if(selisihMenit > 10 && !localStorage.getItem('notif_'+i.tSort)) {
                    const pesan = `⚠️ *REMINDER BOSS*%0APermintaan *${i.barang}* (${i.kapal}) sudah PENDING 10 menit!`;
                    window.open(`https://wa.me/${NO_WA_BOSS}?text=${pesan}`, '_blank');
                    localStorage.setItem('notif_'+i.tSort, 'sent');
                }

                return `
                    <div class="card ${selisihMenit > 10 ? 'blink' : ''}">
                        <div class="flex justify-between items-center">
                            <div>
                                <p class="text-[9px] text-gray-500 font-bold">${i.tDisplay} | ${i.kapal}</p>
                                <h2 class="text-sm font-black uppercase text-white">${i.barang}</h2>
                                <p class="text-blue-500 font-bold text-sm">Rp ${parseFloat(i.harga).toLocaleString('id-ID')}</p>
                            </div>
                            <button onclick="approveWA('${i.kapal}','${i.barang}','${i.harga}')" class="bg-blue-600 px-4 py-2 rounded-lg text-[10px] font-black">SETUJUI</button>
                        </div>
                    </div>
                `;
            }).join('');

        } catch(e) { container.innerHTML = "Gagal memuat data. Periksa URL API."; }
    }

    function approveWA(kapal, barang, harga) {
        const msg = `*OWNER APPROVAL*%0ASaya SETUJU:%0A🚢 Kapal: ${kapal}%0A📦 Barang: ${barang}%0A💰 Nilai: Rp ${parseInt(harga).toLocaleString('id-ID')}`;
        window.open(`https://wa.me/${NO_WA_BOSS}?text=${msg}`, '_blank');
    }

    loadData();
    setInterval(loadData, 30000); // Refresh tiap 30 detik
</script>
</body>
</html>
