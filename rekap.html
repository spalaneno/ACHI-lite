<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PERSERUJUAN - ACHI SYSTEM</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        body { background: #000; color: #fff; font-family: sans-serif; }
        .card-p { background: #0a0a0a; border: 1px solid #1a1a1a; border-radius: 1rem; padding: 15px; border-left: 4px solid #3b82f6; }
        .urgent { animation: pulse-red 1s infinite; border-left-color: #ef4444; }
        @keyframes pulse-red { 50% { background: #2d0a0a; } }
        /* Style khusus saat print */
        @media print {
            body { background: white !important; color: black !important; }
            .no-print { display: none !important; }
            .card-p { border: 1px solid #ccc !important; page-break-inside: avoid; margin-bottom: 20px; }
            .text-blue-500 { color: black !important; }
        }
    </style>
</head>
<body class="p-5">

    <div class="flex justify-between items-center mb-8 no-print">
        <h1 class="text-xl font-black italic uppercase">MENU PERSETUJUAN</h1>
        <div class="flex gap-2">
            <button onclick="window.print()" class="bg-gray-800 p-3 rounded-xl text-xs font-bold uppercase"><i class="fas fa-print"></i></button>
            <button onclick="location.href='dashboard.html'" class="bg-gray-800 p-3 rounded-xl text-xs font-bold uppercase"><i class="fas fa-times"></i></button>
        </div>
    </div>

    <div id="area-persetujuan" class="space-y-4">
        <p class="text-center py-20 text-gray-700 italic text-xs">Menghubungkan Database...</p>
    </div>

<script>
    const API_URL = "https://script.google.com/macros/s/AKfycbxi_XUwSAzNwwfx3VgL89-NsxRR3xdROoG0CUQ9Z1zYAVGRWWye2fJIOu0l2tHOY15Q/exec";
    const NO_OD = "6281356740848";    
    const NO_BOSS = "6289630025252";  

    async function loadData() {
        try {
            const r = await fetch(API_URL + "?action=getRekapGlobal");
            const res = await r.json();
            const container = document.getElementById('area-persetujuan');

            const dataPending = res.data.filter(i => i.status === "PENDING");

            if(dataPending.length === 0) {
                container.innerHTML = `<div class="text-center py-20 text-gray-600 font-bold text-[10px] uppercase italic">✅ Semua permintaan sudah disetujui.</div>`;
                return;
            }

            const skrg = new Date().getTime();

            container.innerHTML = dataPending.map(i => {
                const selisih = (skrg - i.tSort) / 60000;
                const isUrgent = selisih > 10;

                if(isUrgent && !localStorage.getItem('notif_'+i.tSort)) {
                    kirimAlertBoss(i.kapal, i.barang || i.item, i.total || i.harga);
                    localStorage.setItem('notif_'+i.tSort, 'sent');
                }

                return `
                    <div class="card-p ${isUrgent ? 'urgent' : ''}">
                        <div class="flex justify-between items-start">
                            <div class="flex-1">
                                <p class="text-[8px] text-gray-500 font-bold uppercase">${i.tDisplay} | ${i.kapal}</p>
                                <h2 class="text-sm font-black uppercase text-white">${i.barang || i.item}</h2>
                                <p class="text-blue-500 font-bold text-sm">Rp ${parseFloat(i.total || i.harga).toLocaleString('id-ID')}</p>
                            </div>
                            <div class="flex flex-col gap-2 no-print">
                                <button onclick="approve('${i.kapal}', '${i.barang || i.item}', '${i.total || i.harga}')" 
                                        class="bg-blue-600 px-4 py-2 rounded-lg text-[9px] font-black uppercase">SETUJUI</button>
                                <button onclick="window.print()" 
                                        class="bg-gray-800 text-gray-400 px-4 py-2 rounded-lg text-[9px] font-black uppercase"><i class="fas fa-file-pdf"></i> PDF</button>
                            </div>
                        </div>
                    </div>
                `;
            }).join('');

        } catch(e) { container.innerHTML = "Gagal mengambil data."; }
    }

    function approve(kapal, barang, harga) {
        const msg = `*PENGESAHAN OWNER*%0A%0ASaya menyetujui pembelian:%0A🚢 *Kapal:* ${kapal}%0A📦 *Barang:* ${barang}%0A💰 *Nilai:* Rp ${parseInt(harga).toLocaleString('id-ID')}%0A%0A*Kepada OD (David):* Silakan segera diproses pembayarannya.`;
        window.open(`https://wa.me/${NO_OD}?text=${msg}`, '_blank');
    }

    function kirimAlertBoss(kapal, barang, harga) {
        const msg = `⚠️ *PENGINGAT BOSS*%0A%0AAda permintaan *${barang}* (${kapal}) senilai *Rp ${parseInt(harga).toLocaleString('id-ID')}* yang sudah PENDING 10 menit!`;
        window.open(`https://wa.me/${NO_BOSS}?text=${msg}`, '_blank');
    }

    loadData();
    setInterval(loadData, 60000);
</script>
</body>
</html>
