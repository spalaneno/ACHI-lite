<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rekap - CV Efendy Jaya Abadi</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        body { background: #030303; color: white; font-family: 'Inter', sans-serif; }
        .nav-top { background: linear-gradient(to bottom, #1a0000, #030303); border-bottom: 1px solid #222; }
        .glass-card { background: #0a0a0a; border: 1px solid #1a1a1a; border-radius: 1.5rem; }
    </style>
</head>
<body class="pb-20">

    <div class="nav-top p-6 flex justify-between items-center sticky top-0 z-20">
        <button onclick="location.href='dashboard.html'" class="flex items-center gap-2 text-gray-400 hover:text-white transition">
            <i class="fas fa-chevron-left"></i>
            <span class="text-[10px] font-black uppercase tracking-widest">Dashboard</span>
        </button>
        <img src="logo.png" class="h-8">
        <button onclick="logout()" class="text-red-600">
            <i class="fas fa-power-off"></i>
        </button>
    </div>

    <div class="p-6">
        <h2 class="text-xl font-black italic uppercase tracking-tighter mb-6">Rekap Finansial</h2>
        
        <div class="grid grid-cols-2 gap-3 mb-6">
            <select id="kpl" onchange="loadRekap()" class="bg-[#111] border border-[#333] p-3 rounded-xl text-[10px] text-white">
                <option value="SEMUA">SEMUA KAPAL</option>
                <option value="KM. NABAWI 09">KM. NABAWI 09</option>
                <option value="KM. LASTIKA STAR">KM. LASTIKA STAR</option>
                <option value="KM. SRIKANDI 01">KM. SRIKANDI 01</option>
            </select>
            <select id="prd" onchange="loadRekap()" class="bg-[#111] border border-[#333] p-3 rounded-xl text-[10px] text-white">
                <option value="BULAN">BULAN INI</option>
                <option value="TRIP">PER TRIP</option>
            </select>
        </div>

        <div class="glass-card p-6 mb-8 border-l-4 border-red-700 shadow-xl">
            <div class="grid grid-cols-2 gap-4 border-b border-gray-900 pb-4 mb-4">
                <div><p class="text-[7px] text-gray-500 uppercase font-black mb-1">Total Masuk</p><p id="sum-in" class="text-green-500 font-bold text-sm">Rp 0</p></div>
                <div><p class="text-[7px] text-gray-500 uppercase font-black mb-1">Total Keluar</p><p id="sum-out" class="text-red-500 font-bold text-sm">Rp 0</p></div>
            </div>
            <div class="text-center">
                <p class="text-[7px] text-gray-400 uppercase font-black mb-1">Laba Bersih Armada</p>
                <h1 id="sum-net" class="text-2xl font-black italic tracking-tighter">Rp 0</h1>
            </div>
        </div>

        <div id="list-data" class="space-y-3">
            <p class="text-center text-[10px] text-gray-600 animate-pulse italic">Menarik data dari server...</p>
        </div>
    </div>

    <script>
        const API = "https://script.google.com/macros/s/AKfycbzGj3Da5QLTDacu_yvrv6UmAx5DUph1ccFnQHnc-AH1a1S4z7_3-5vkkvtLTeBcV9dN/exec"; // BOSS: MASUKKAN URL EXEC DISINI

        async function loadRekap() {
            const kapal = document.getElementById('kpl').value;
            const periode = document.getElementById('prd').value;
            try {
                const r = await fetch(`${API}?action=getRekapGabungan&kapal=${kapal}&periode=${periode}`);
                const res = await r.json();
                
                document.getElementById('sum-in').innerText = `Rp ${res.summary.total_in.toLocaleString('id-ID')}`;
                document.getElementById('sum-out').innerText = `Rp ${res.summary.total_out.toLocaleString('id-ID')}`;
                document.getElementById('sum-net').innerText = `Rp ${res.summary.net.toLocaleString('id-ID')}`;
                
                document.getElementById('list-data').innerHTML = res.data.map(i => `
                    <div class="glass-card p-4 flex justify-between items-center">
                        <div>
                            <p class="text-[10px] font-black uppercase tracking-tighter">${i.item}</p>
                            <p class="text-[7px] text-gray-500">${i.tanggal} | ${i.kapal}</p>
                        </div>
                        <p class="text-[10px] font-black ${i.tipe==='IN'?'text-green-500':'text-red-500'} italic">
                            ${i.tipe==='IN'?'+':'-'} Rp ${i.total.toLocaleString('id-ID')}
                        </p>
                    </div>
                `).join('');
            } catch(e) { console.log("Error Load"); }
        }

        loadRekap();
        function logout() { localStorage.clear(); window.location.href="index.html"; }
    </script>
</body>
</html>
