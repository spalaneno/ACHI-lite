<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>REKAP GLOBAL - CV EJA</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap');
        body { background-color: #000; color: #fff; font-family: 'Inter', sans-serif; }
        .card-dark { background: #0a0a0a; border: 1px solid #1a1a1a; border-radius: 1rem; }
        .input-custom { background: #111; border: 1px solid #222; color: #fff; padding: 12px; border-radius: 0.75rem; width: 100%; font-size: 13px; }
        @media print { .no-print { display: none !important; } body { background: white; color: black; } .card-dark { border: 1px solid #eee; } }
    </style>
</head>
<body class="p-4 md:p-8">

    <div class="flex justify-between items-center mb-6 no-print">
        <button onclick="location.href='dashboard.html'" class="text-gray-400 hover:text-white transition">
            <i class="fas fa-arrow-left text-xl"></i>
        </button>
        <div id="export-tools" class="hidden flex gap-2">
            <button onclick="downloadCSV()" class="bg-gray-900 border border-blue-900/50 text-blue-500 px-3 py-2 rounded-lg text-xs font-bold uppercase">
                <i class="fas fa-file-excel mr-1"></i> Excel
            </button>
            <button onclick="window.print()" class="bg-gray-900 border border-gray-700 text-white px-3 py-2 rounded-lg text-xs font-bold uppercase">
                <i class="fas fa-file-pdf mr-1"></i> PDF / Print
            </button>
        </div>
    </div>

    <h1 class="text-2xl font-black italic uppercase tracking-tighter mb-6 no-print">Rekap Global</h1>

    <div class="card-dark p-5 mb-8 no-print">
        <div class="grid grid-cols-2 gap-4 mb-4">
            <div>
                <label class="text-[10px] font-bold text-gray-500 uppercase mb-1 block">Mulai Tanggal</label>
                <input type="date" id="start-date" class="input-custom">
            </div>
            <div>
                <label class="text-[10px] font-bold text-gray-500 uppercase mb-1 block">Sampai Tanggal</label>
                <input type="date" id="end-date" class="input-custom">
            </div>
        </div>
        <button onclick="fetchData()" class="w-full bg-blue-600 hover:bg-blue-500 text-white font-black py-4 rounded-xl uppercase tracking-widest transition-all">
            Tampilkan Laporan
        </button>
    </div>

    <div id="report-container">
        <div id="print-header" class="hidden print:block text-center mb-8">
            <h2 class="text-xl font-black uppercase underline">Laporan Keuangan CV Efendy Jaya Abadi</h2>
            <p id="print-period" class="text-sm mt-1 text-gray-400"></p>
        </div>

        <div id="summary-cards" class="hidden grid grid-cols-2 gap-4 mb-8">
            <div class="card-dark p-4 border-l-4 border-green-600">
                <p class="text-[10px] font-bold text-gray-500 uppercase">Pemasukan (Owner)</p>
                <p id="total-in" class="text-lg font-black text-green-500 mt-1">Rp 0</p>
            </div>
            <div class="card-dark p-4 border-l-4 border-red-600">
                <p class="text-[10px] font-bold text-gray-500 uppercase">Pengeluaran (Logistik)</p>
                <p id="total-out" class="text-lg font-black text-red-500 mt-1">Rp 0</p>
            </div>
        </div>

        <div id="status-msg" class="text-center py-10 text-gray-600 font-bold uppercase text-xs tracking-widest">
            Silakan tentukan periode laporan
        </div>

        <div id="data-list" class="space-y-3"></div>
    </div>

    <script>
        // MASUKKAN URL HASIL DEPLOY guys!
        const API_URL = "https://script.google.com/macros/s/AKfycbx9fCxEOUo1Jb_gVDQVSQ6ankqrzqlLMPd1SMaS6eiyzhGTdHL01oqxrxhpTVYE1ZI/exec";

        let reportData = [];

        async function fetchData() {
            const start = document.getElementById('start-date').value;
            const end = document.getElementById('end-date').value;
            const msg = document.getElementById('status-msg');
            const list = document.getElementById('data-list');
            const summary = document.getElementById('summary-cards');
            const tools = document.getElementById('export-tools');

            if(!start || !end) return alert("Pilih tanggal dulu, bos!");

            msg.innerHTML = '<i class="fas fa-spinner fa-spin text-blue-500 mr-2"></i> MENGHUBUNGKAN KE DATABASE...';
            list.innerHTML = "";
            summary.classList.add('hidden');
            tools.classList.add('hidden');

            try {
                const response = await fetch(`${API_URL}?action=getRekapGlobal&start=${start}&end=${end}&kapal=SEMUA`);
                const result = await response.json();
                reportData = result.data;

                if(reportData.length === 0) {
                    msg.innerHTML = "TIDAK ADA TRANSAKSI PADA PERIODE INI";
                    return;
                }

                msg.innerHTML = "";
                summary.classList.remove('hidden');
                tools.classList.remove('hidden');
                document.getElementById('print-period').innerText = `Periode: ${start} s/d ${end}`;
                document.getElementById('total-in').innerText = `Rp ${result.summary.total_in.toLocaleString('id-ID')}`;
                document.getElementById('total-out').innerText = `Rp ${result.summary.total_out.toLocaleString('id-ID')}`;

                list.innerHTML = reportData.map(item => `
                    <div class="card-dark p-4 flex justify-between items-center border-r-4 ${item.tipe === 'IN' ? 'border-green-600' : 'border-red-600'}">
                        <div>
                            <p class="text-[9px] font-bold text-gray-500 uppercase">${item.tDisplay} • ${item.kapal}</p>
                            <p class="text-sm font-black italic uppercase">${item.item}</p>
                        </div>
                        <p class="text-sm font-black ${item.tipe === 'IN' ? 'text-green-500' : 'text-red-500'}">
                            ${item.tipe === 'IN' ? '+' : '-'} Rp ${item.total.toLocaleString('id-ID')}
                        </p>
                    </div>
                `).join('');

            } catch (error) {
                msg.innerHTML = '<span class="text-red-500 font-black"><i class="fas fa-exclamation-triangle"></i> KONEKSI GAGAL! CEK IZIN AKSES GOOGLE SCRIPT</span>';
                console.error(error);
            }
        }

        function downloadCSV() {
            let csv = "Tanggal,Kapal,Keterangan,Tipe,Nilai\n";
            reportData.forEach(r => {
                csv += `${r.tDisplay},${r.kapal},${r.item},${r.tipe},${r.total}\n`;
            });
            const blob = new Blob([csv], { type: 'text/csv' });
            const url = window.URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `Laporan_EJA_${new Date().getTime()}.csv`;
            a.click();
        }
    </script>
</body>
</html>
