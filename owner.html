<script>
window.initRoleData = function(res) {
    if(!res.success) return;
    
    // Pastikan ID elemen ada sebelum diisi agar tidak NULL
    const elUser = document.getElementById('displayUser');
    if(elUser) elUser.innerText = res.user.username;

    if(document.getElementById('valDaily')) document.getElementById('valDaily').innerText = formatIDR(res.stats.daily);
    if(document.getElementById('valWeekly')) document.getElementById('valWeekly').innerText = formatIDR(res.stats.weekly);
    if(document.getElementById('valMonthly')) document.getElementById('valMonthly').innerText = formatIDR(res.stats.monthly);

    // MENGISI DROPDOWN ARMADA DARI SPREADSHEET (DINAMIS)
    const selKapal = document.getElementById('fKapal');
    if(selKapal && res.armadaList) {
        selKapal.innerHTML = '<option value="Semua">Semua Armada</option>';
        res.armadaList.forEach(k => {
            selKapal.innerHTML += `<option value="${k}">${k}</option>`;
        });
    }

    window.rawHistory = res.history || [];
    if(typeof renderRekap === "function") renderRekap();
};
</script>
