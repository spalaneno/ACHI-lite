<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ACHI - OWNER</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        .owner-gradient { background: linear-gradient(135deg, #1e1e1e, #b31d1d); }
    </style>
</head>
<body class="bg-gray-50 pb-24">
    <header class="owner-gradient p-10 text-white rounded-b-[4rem] shadow-2xl mb-8">
        <div class="flex justify-between items-center">
            <div>
                <p class="text-[10px] font-black text-yellow-400 tracking-[0.3em] uppercase mb-1">Executive Access</p>
                <h2 id="user-n" class="text-3xl font-black uppercase leading-none"></h2>
            </div>
            <button onclick="logout()" class="w-14 h-14 bg-white/10 rounded-3xl flex items-center justify-center backdrop-blur-md border border-white/20"><i class="fas fa-power-off"></i></button>
        </div>
    </header>

    <main class="px-6">
        <div class="flex justify-between items-center mb-6 px-2">
            <h3 class="font-black text-gray-800 uppercase italic">Antrian Persetujuan</h3>
            <button onclick="refreshData()" class="w-10 h-10 bg-white rounded-2xl shadow text-red-600"><i id="sync-icon" class="fas fa-sync-alt"></i></button>
        </div>

        <div id="data-list" class="space-y-6"></div>
    </main>

<script>
    const API = "https://script.google.com/macros/s/AKfycbxknjxmr96CRRXtgHZbj8j8lprJGBPzUZhv1o6KqxKq1wyd4Y95ZdtuIMZ9FQ4T2XFS/exec";
    const USER = JSON.parse(localStorage.getItem('achi_session'));

    if(!USER || USER.level !== 1) window.location.href = "index.html";
    document.getElementById('user-n').innerText = USER.nama;

    async function refreshData() {
        const l = document.getElementById('data-list'), ic = document.getElementById('sync-icon');
        ic.classList.add('fa-spin');
        try {
            const r = await fetch(`${API}?action=getData&level=${USER.level}`);
            const d = await r.json();
            // Hanya tampilkan yang sudah diperiksa Admin (Level 2)
            const waiting = d.transaksi.filter(i => i[8] === 'TELAH DIPERIKSA');
            
            l.innerHTML = waiting.length === 0 ? '<div class="text-center py-20 opacity-30 font-black">SEMUA PENGAJUAN SUDAH SELESAI</div>' : 
            waiting.map(i => `
                <div class="bg-white p-6 rounded-[2.5rem] shadow-xl border border-gray-100">
                    <div class="flex justify-between mb-4">
                        <span class="text-[8px] font-black bg-blue-100 text-blue-600 px-3 py-1 rounded-full uppercase italic">${i[8]}</span>
                        <span class="text-[9px] text-gray-300 font-bold">${i[1]}</span>
                    </div>
                    <p class="text-[10px] text-gray-400 font-black uppercase mb-1">${i[9]}</p>
                    <h4 class="text-lg font-black text-gray-800 uppercase">${i[4]}</h4>
                    <p class="text-2xl font-black text-red-600 my-2">${i[6]} <span class="text-xs uppercase">${i[5]}</span></p>
                    <div class="flex gap-2 mt-6">
                        <button onclick="update('${i[0]}','DISETUJUI OWNER')" class="flex-1 bg-gray-900 text-white p-4 rounded-2xl font-black text-[10px] uppercase shadow-lg">SETUJUI</button>
                        <button onclick="update('${i[0]}','DITOLAK')" class="flex-1 bg-gray-100 text-gray-400 p-4 rounded-2xl font-black text-[10px] uppercase">TOLAK</button>
                    </div>
                </div>
            `).join('');
        } catch(e) { l.innerHTML = "Gagal Memuat"; }
        ic.classList.remove('fa-spin');
    }

    async function update(id, s) {
        if(!confirm("Lanjutkan Otorisasi?")) return;
        await fetch(API, { method: 'POST', body: JSON.stringify({ action: 'changeStatus', id: id, s: s }) });
        refreshData();
    }

    function logout() { localStorage.clear(); window.location.href = "index.html"; }
    refreshData();
</script>
</body>
</html>
