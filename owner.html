<div class="animate-up">
    <header class="p-8 flex justify-between items-center">
        <div>
            <p class="text-[10px] font-extrabold text-red-600 uppercase tracking-[0.4em] mb-1">Executive Access</p>
            <h2 id="displayUser" class="text-2xl font-black"></h2>
        </div>
        <img id="displayPhoto" class="w-14 h-14 rounded-2xl border-2 border-red-600 object-cover">
    </header>
    <div class="px-8 space-y-6">
        <div class="glass-card p-8 border-l-4 border-red-600 shadow-2xl bg-zinc-900/40">
            <p class="text-zinc-500 text-[10px] font-bold uppercase mb-2 italic">Profit Trip</p>
            <h3 id="valPemasukan" class="text-4xl font-black text-white tracking-tighter">Rp 0</h3>
            <div class="mt-4 pt-4 border-t border-white/5 flex justify-between">
                <span class="text-[9px] font-bold text-zinc-500 uppercase">Pengeluaran</span>
                <span id="valPengeluaran" class="text-[9px] font-bold text-red-500 uppercase">Rp 0</span>
            </div>
        </div>
        <div class="grid grid-cols-3 gap-4">
            <div class="nav-box"><i class="fas fa-chart-line text-red-500"></i><span>Analisa</span></div>
            <div class="nav-box"><i class="fas fa-vault text-red-500"></i><span>Brankas</span></div>
            <div class="nav-box"><i class="fas fa-ship text-red-500"></i><span>Armada</span></div>
            <div class="nav-box"><i class="fas fa-users-gear text-red-500"></i><span>Crew</span></div>
            <div class="nav-box"><i class="fas fa-file-contract text-red-500"></i><span>Audit</span></div>
            <div onclick="window.appLogout()" class="nav-box"><i class="fas fa-power-off text-zinc-700 font-bold"></i><span class="text-red-600">Logout</span></div>
        </div>
    </div>
</div>
<script>
    function initRoleData(res) {
        document.getElementById('valPemasukan').innerText = formatIDR(res.stats.pemasukan);
        document.getElementById('valPengeluaran').innerText = formatIDR(res.stats.pengeluaran);
        if(res.user.username.toUpperCase() === 'HENGKY') document.getElementById('displayUser').innerText = "Pak CEO";
    }
</script>
