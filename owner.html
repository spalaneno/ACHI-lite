<div class="animate-up">
    <header class="p-8 flex justify-between items-center">
        <div>
            <p id="sapaan" class="text-[10px] font-extrabold text-red-600 uppercase tracking-[0.4em] mb-1">Executive Dashboard</p>
            <h2 id="displayUser" class="text-2xl font-black italic">BOSS ACHY</h2>
        </div>
        <img id="displayPhoto" src="https://via.placeholder.com/150" class="w-14 h-14 rounded-2xl border-2 border-red-600 object-cover">
    </header>

    <div class="px-8 space-y-6">
        <div class="glass-card p-8 border-l-4 border-red-600 shadow-2xl bg-zinc-900/40">
            <p class="text-zinc-500 text-[10px] font-bold uppercase mb-2">Total Pemasukan</p>
            <h3 id="valPemasukan" class="text-4xl font-black text-white tracking-tighter">Rp 0</h3>
            <div class="mt-4 pt-4 border-t border-white/5 flex justify-between">
                <span class="text-[9px] font-bold text-zinc-500 uppercase">Operational Cost</span>
                <span id="valPengeluaran" class="text-[9px] font-bold text-red-500 uppercase">Rp 0</span>
            </div>
        </div>

        <div class="grid grid-cols-3 gap-4">
            <div onclick="alert('Fitur Rekap Segera Siap!')" class="nav-box border border-red-600/20 bg-red-600/5">
                <i class="fas fa-chart-line text-red-600"></i>
                <span class="text-white">Rekap</span>
            </div>
            <div class="nav-box"><i class="fas fa-ship text-zinc-600"></i><span>Armada</span></div>
            <div onclick="window.forceLogout()" class="nav-box border border-red-900/30">
                <i class="fas fa-power-off text-red-600"></i>
                <span class="text-red-500 font-bold">Keluar</span>
            </div>
        </div>
    </div>
</div>

<script>
    // Fungsi ini dipanggil otomatis oleh index.html
    window.initRoleData = function(res) {
        if(!res) return;
        
        // Update Saldo
        if(document.getElementById('valPemasukan')) 
            document.getElementById('valPemasukan').innerText = formatIDR(res.stats.pemasukan || 0);
        if(document.getElementById('valPengeluaran')) 
            document.getElementById('valPengeluaran').innerText = formatIDR(res.stats.pengeluaran || 0);
        
        // Update Identitas
        const name = (res.user.username || "").toUpperCase();
        if(name === 'HENGKY') {
            document.getElementById('sapaan').innerText = "Selamat Datang CEO";
            document.getElementById('displayUser').innerText = "PAK CEO";
        }
        
        if(res.user.foto) document.getElementById('displayPhoto').src = res.user.foto;
    };
</script>
