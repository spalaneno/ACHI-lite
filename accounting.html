<div class="animate-up">

            <h2 id="displayUser" class="text-2xl font-black"></h2>
        </div>
        <i class="fas fa-calculator text-2xl text-blue-500 opacity-30"></i>
    </header>

    <div class="px-8 space-y-6">
        <div class="glass-card p-6 border-l-4 border-blue-600 bg-blue-600/5">
            <p class="text-[9px] font-bold text-zinc-500 uppercase mb-1 tracking-widest">Saldo Pemasukan Kas</p>

        <div class="grid grid-cols-3 gap-4">

            <div class="nav-box"><i class="fas fa-book text-blue-500"></i><span>Jurnal</span></div>
            <div class="nav-box"><i class="fas fa-wallet text-blue-500"></i><span>Gaji Crew</span></div>
            <div class="nav-box"><i class="fas fa-file-export text-blue-500"></i><span>Export</span></div>
            <div class="nav-box"><i class="fas fa-magnifying-glass-chart text-blue-500"></i><span>Laporan</span></div>
            <div onclick="window.forceLogout()" class="nav-box border border-red-900/30">
                <i class="fas fa-power-off text-red-600"></i>
                <span class="text-red-500 font-bold">Keluar</span>
            </div>
        </div>
    </div>
</div>

<script>
    window.initRoleData = function(res) {
        if(document.getElementById('valKas')) document.getElementById('valKas').innerText = formatIDR(res.stats.pemasukan);
    };
</script>
