<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ACHI - MANAJEMEN KRU</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        body { background-color: #0f0f0f; color: #e0e0e0; font-family: 'Inter', sans-serif; }
        .achi-card { background: linear-gradient(145deg, #1a1a1a, #121212); border: 1px solid #333; }
        .btn-red { background: linear-gradient(to right, #b31d1d, #7a1212); }
        .input-dark { background: #262626; border: 1px solid #444; color: white; padding: 10px; border-radius: 10px; outline: none; }
    </style>
</head>
<body class="p-4 pb-24">

    <div class="flex justify-between items-center mb-6">
        <button onclick="location.href='dashboard.html'" class="text-gray-400"><i class="fas fa-arrow-left text-xl"></i></button>
        <h2 class="text-xl font-black italic uppercase text-white">Data Hutang Kru</h2>
        <button onclick="loadKruData()" class="text-red-500"><i class="fas fa-sync-alt"></i></button>
    </div>

    <div class="grid grid-cols-2 gap-4 mb-6">
        <div class="achi-card p-4 rounded-3xl text-center">
            <p class="text-[8px] text-gray-500 uppercase font-black">Total Piutang ABK</p>
            <p id="total-piutang" class="text-lg font-black text-white">Rp 0</p>
        </div>
        <div class="achi-card p-4 rounded-3xl text-center border-l-4 border-red-600">
            <p class="text-[8px] text-gray-500 uppercase font-black">Kru Berhutang</p>
            <p id="count-hutang" class="text-lg font-black text-white">0 Orang</p>
        </div>
    </div>

    <div class="relative mb-6">
        <i class="fas fa-search absolute left-4 top-4 text-gray-500"></i>
        <input type="text" id="searchKru" onkeyup="searchFunction()" placeholder="Cari Nama Kru..." class="w-full pl-12 pr-4 py-4 bg-[#1a1a1a] rounded-2xl border border-gray-800 outline-none focus:border-red-600 transition-all font-bold text-sm">
    </div>

    <div id="kru-container" class="space-y-4">
        <div class="text-center py-20 opacity-20 font-black">MEMUAT DATA...</div>
    </div>

    <div id="modal-bayar" class="fixed inset-0 bg-black/90 backdrop-blur-sm hidden flex items-center justify-center p-6 z-50">
        <div class="achi-card w-full max-w-sm p-8 rounded-[2.5rem] border-t-4 border-red-600">
            <h3 class="text-lg font-black text-white mb-2 uppercase">Bayar Hutang</h3>
            <p id="m-nama" class="text-xs text-red-500 font-bold mb-6 italic"></p>
            
            <div class="space-y-4">
                <div>
                    <label class="text-[10px] text-gray-500 font-black uppercase">Jumlah Bayar (Rp)</label>
                    <input type="number" id="m-jumlah" class="w-full input-dark mt-1 text-lg font-black" placeholder="0">
                </div>
                <button onclick="prosesBayar()" class="w-full btn-red text-white p-4 rounded-2xl font-black uppercase shadow-lg">Konfirmasi Bayar</button>
                <button onclick="closeModal()" class="w-full text-gray-500 font-bold uppercase text-xs">Batalkan</button>
            </div>
        </div>
    </div>

<script>
    const API = "https://script.google.com/macros/s/AKfycbxzwGBlNLfpWDdjmHTjtrH1PTPMmgaNVjPNpqPlbyXYr7MDTsuZrNoTh4OCs77J8p4/exec";
    let DATA_KRU = [];

    async function loadKruData() {
        try {
            const r = await fetch(`${API}?action=getKruHutang`);
            const d = await r.json();
            DATA_KRU = d.data;
            renderKru(DATA_KRU);
        } catch(e) { console.error("Gagal muat data"); }
    }

    function renderKru(data) {
        const container = document.getElementById('kru-container');
        let total = 0;
        let count = 0;

        container.innerHTML = data.map(k => {
            if(k.hutang > 0) {
                total += parseInt(k.hutang);
                count++;
            }
            return `
            <div class="achi-card p-6 rounded-[2rem] flex justify-between items-center animate__animated animate__fadeIn">
                <div>
                    <h4 class="font-black text-white uppercase tracking-tighter">${k.nama}</h4>
                    <p class="text-[10px] text-gray-500 font-bold uppercase">${k.jabatan} | ${k.kapal}</p>
                    <div class="mt-2 text-[10px] font-black ${k.hutang > 0 ? 'text-red-500' : 'text-green-500'}">
                        HUTANG: Rp ${parseInt(k.hutang).toLocaleString()}
                    </div>
                </div>
                <button onclick="openModal('${k.nama}', ${k.hutang})" class="w-10 h-10 bg-white/5 rounded-xl flex items-center justify-center border border-white/10 active:scale-90">
                    <i class="fas fa-hand-holding-usd text-red-500"></i>
                </button>
            </div>
            `;
        }).join('');

        document.getElementById('total-piutang').innerText = "Rp " + total.toLocaleString();
        document.getElementById('count-hutang').innerText = count + " Orang";
    }

    let selectedKru = "";
    function openModal(nama, hutang) {
        selectedKru = nama;
        document.getElementById('m-nama').innerText = nama + " (Sisa: Rp " + hutang.toLocaleString() + ")";
        document.getElementById('modal-bayar').classList.remove('hidden');
    }

    function closeModal() { document.getElementById('modal-bayar').classList.add('hidden'); }

    async function prosesBayar() {
        const jml = document.getElementById('m-jumlah').value;
        if(!jml || jml <= 0) return alert("Masukkan jumlah yang valid");
        
        if(confirm(`Konfirmasi pembayaran hutang ${selectedKru} sebesar Rp ${parseInt(jml).toLocaleString()}?`)) {
            // Logika POST ke Google Script untuk kurangi saldo hutang di Sheet Users & Hutang_Kru
            alert("Pembayaran Berhasil Dicatat!");
            closeModal();
            loadKruData();
        }
    }

    loadKruData();
</script>
</body>
</html>
