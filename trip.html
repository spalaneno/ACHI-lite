<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bongkar Trip - CV EJA</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        body { background: #030303; color: white; font-family: 'Inter', sans-serif; }
        .input-dark { background: #111; border: 1px solid #333; color: white; border-radius: 1rem; padding: 12px; width: 100%; font-size: 13px; }
        .btn-primary { background: linear-gradient(135deg, #1e40af, #1e3a8a); color: white; font-weight: 900; width: 100%; padding: 15px; border-radius: 1rem; text-transform: uppercase; }
    </style>
</head>
<body class="pb-10">

    <div class="p-5 flex justify-between items-center bg-[#0a0000] border-b border-gray-900 sticky top-0 z-20">
        <button onclick="location.href='dashboard.html'" class="text-gray-400 flex items-center gap-2">
            <i class="fas fa-arrow-left"></i> <span class="text-[9px] font-black uppercase">Dashboard</span>
        </button>
        <p class="text-[10px] font-black uppercase italic tracking-widest">Input Bongkar Trip</p>
        <button onclick="logout()" class="text-red-600"><i class="fas fa-power-off"></i></button>
    </div>

    <div class="p-6">
        <form id="form-trip" class="space-y-4">
            <div>
                <label class="text-[9px] font-black text-gray-500 uppercase ml-1">Tanggal Bongkar</label>
                <input type="date" id="tgl" class="input-dark mt-1" required>
            </div>
            <div>
                <label class="text-[9px] font-black text-gray-500 uppercase ml-1">Armada Kapal</label>
                <select id="kpl" class="input-dark mt-1" required>
                    <option value="KM. NABAWI 09">KM. NABAWI 09</option>
                    <option value="KM. LASTIKA STAR">KM. LASTIKA STAR</option>
                    <option value="KM. SRIKANDI 01">KM. SRIKANDI 01</option>
                </select>
            </div>
            <div>
                <label class="text-[9px] font-black text-gray-500 uppercase ml-1">Jenis Ikan</label>
                <input type="text" id="ikan" class="input-dark mt-1" placeholder="Cakalang / Deho / dll" required>
            </div>
            <div class="grid grid-cols-2 gap-4">
                <div>
                    <label class="text-[9px] font-black text-gray-500 uppercase ml-1">Berat (Kg)</label>
                    <input type="number" id="berat" oninput="hitung()" class="input-dark mt-1" placeholder="0" required>
                </div>
                <div>
                    <label class="text-[9px] font-black text-gray-500 uppercase ml-1">Harga / Kg</label>
                    <input type="number" id="harga" oninput="hitung()" class="input-dark mt-1" placeholder="0" required>
                </div>
            </div>
            <div class="p-4 bg-blue-900/10 border border-blue-900/30 rounded-2xl">
                <p class="text-[8px] font-black text-blue-500 uppercase">Estimasi Hasil Bruto</p>
                <h2 id="display-gross" class="text-2xl font-black italic text-white tracking-tighter">Rp 0</h2>
            </div>
            <button type="submit" id="btn-submit" class="btn-primary shadow-lg shadow-blue-900/20">Simpan Data Trip</button>
        </form>
    </div>

    <script>
        const USER = JSON.parse(localStorage.getItem('achi_session'));
        const API = "https://script.google.com/macros/s/AKfycbzk03FnZDF_z2F8MNzUDF42WM6pzxsHZMufwRNNg-ejDMb9ri86iEKeSUqQGXU81T0-/exec"; // URL LANGSUNG TEMPEL DI SINI

        if(!USER) window.location.href = "index.html";
        document.getElementById('tgl').valueAsDate = new Date();

        function hitung() {
            const b = document.getElementById('berat').value || 0;
            const h = document.getElementById('harga').value || 0;
            document.getElementById('display-gross').innerText = `Rp ${(b * h).toLocaleString('id-ID')}`;
        }

        document.getElementById('form-trip').onsubmit = async (e) => {
            e.preventDefault();
            const btn = document.getElementById('btn-submit');
            btn.disabled = true; btn.innerHTML = "Menyimpan...";

            const params = new URLSearchParams({
                action: 'saveTrip',
                tgl: document.getElementById('tgl').value,
                kapal: document.getElementById('kpl').value,
                ikan: document.getElementById('ikan').value,
                berat: document.getElementById('berat').value,
                harga: document.getElementById('harga').value,
                gross: document.getElementById('berat').value * document.getElementById('harga').value,
                user: USER.nama
            });

            try {
                const r = await fetch(`${API}?${params.toString()}`);
                const res = await r.json();
                if(res.status === "success") {
                    alert(`Data Trip Berhasil Disimpan, ${USER.panggilan}!`);
                    document.getElementById('form-trip').reset();
                    hitung();
                }
            } catch(e) { alert("Gagal Simpan."); }
            finally { btn.disabled = false; btn.innerHTML = "Simpan Data Trip"; }
        };

        function logout() { localStorage.clear(); window.location.href="index.html"; }
    </script>
</body>
</html>
