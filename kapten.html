<div class="animate-up">
    <header class="p-8 flex justify-between items-center">
        <div>
            <p class="text-[10px] font-extrabold text-emerald-500 uppercase tracking-[0.4em] mb-1">Vessel Master</p>
            <h2 id="displayUser" class="text-2xl font-black italic text-white"></h2>
        </div>
        <p id="valKapal" class="text-[10px] font-bold text-zinc-500 uppercase tracking-widest bg-zinc-800 px-3 py-1 rounded-full"></p>
    </header>

    <div id="kapten-menu" class="px-8 space-y-6">
        <div class="glass-card p-6 border-b-2 border-emerald-500 bg-emerald-500/5 text-center">
            <p class="text-[9px] font-bold text-zinc-500 uppercase mb-2 tracking-widest">Saldo Estimasi</p>
            <h3 id="valUpah" class="text-3xl font-black text-white">Rp 0</h3>
        </div>

        <div class="grid grid-cols-3 gap-4">
            <div onclick="toggleAnfra()" class="nav-box border-emerald-500/20">
                <i class="fas fa-file-pen text-emerald-500"></i>
                <span>Anfrakan</span>
            </div>
            <div class="nav-box"><i class="fas fa-users text-zinc-500"></i><span>Crew</span></div>
            <div class="nav-box"><i class="fas fa-history text-zinc-500"></i><span>History</span></div>
            <div onclick="window.forceLogout()" class="nav-box border border-red-900/30">
                <i class="fas fa-power-off text-red-600"></i>
                <span class="text-red-500 font-bold">Keluar</span>
            </div>
        </div>
    </div>

    <div id="anfra-form" class="hidden px-8 animate-up">
        <button onclick="toggleAnfra()" class="mb-6 text-zinc-500 text-[10px] font-bold uppercase tracking-widest">
            <i class="fas fa-arrow-left mr-2"></i> Kembali
        </button>
        
        <div class="glass-card p-8 space-y-5">
            <h2 class="text-lg font-black text-emerald-500 uppercase italic tracking-tighter">Form Permintaan</h2>
            
            <div>
                <label class="text-[9px] font-bold text-zinc-500 uppercase block mb-2">Kategori</label>
                <select id="kat" class="input-premium bg-zinc-900 border-zinc-800">
                    <option>Suku Cadang</option>
                    <option>Logistik</option>
                    <option>BBM / Pelumas</option>
                </select>
            </div>

            <div>
                <label class="text-[9px] font-bold text-zinc-500 uppercase block mb-2">Rincian</label>
                <textarea id="item" placeholder="Ketik daftar barang di sini..." class="input-premium h-32 resize-none"></textarea>
            </div>

            <button onclick="kirimSekarang()" id="btnKirim" class="btn-red bg-emerald-600 border-none shadow-xl">
                KIRIM KE OWNER
            </button>
        </div>
    </div>
</div>

<script>
    // Memastikan data tersimpan saat login
    window.initRoleData = function(res) {
        document.getElementById('valUpah').innerText = formatIDR(res.user.saldo || 0);
        document.getElementById('valKapal').innerText = res.user.kapal || "ACHI FLEET";
        window.sessionKapten = res.user;
    };

    function toggleAnfra() {
        document.getElementById('kapten-menu').classList.toggle('hidden');
        document.getElementById('anfra-form').classList.toggle('hidden');
    }

    async function kirimSekarang() {
        const item = document.getElementById('item').value.trim();
        const kat = document.getElementById('kat').value;
        const btn = document.getElementById('btnKirim');

        if(!item) return alert("Siapkan daftar barang dulu, Boss Kapten.");

        document.getElementById('loader').classList.remove('hidden');
        btn.disabled = true;
        btn.innerText = "PROSES...";

        try {
            // Kita gunakan fetch dengan mode default agar bisa membaca response sukses
            const resp = await fetch(API_URL, {
                method: 'POST',
                body: JSON.stringify({
                    action: 'submitAnfra',
                    user: window.sessionKapten.username,
                    kapal: window.sessionKapten.kapal,
                    kategori: kat,
                    item: item
                })
            });
            
            // Apps Script butuh penanganan khusus agar JSON terbaca
            const result = await resp.json();
            
            if(result.success) {
                alert("BERHASIL! Anfrakan sudah terdata di sistem.");
                document.getElementById('item').value = "";
                toggleAnfra();
            } else {
                alert("Gagal: " + result.message);
            }
        } catch(e) {
            // Backup jika response JSON gagal tapi data tetap masuk
            alert("Sinyal kurang stabil, tapi data sudah dikirim ke pusat.");
            location.reload();
        } finally {
            document.getElementById('loader').classList.add('hidden');
            btn.disabled = false;
            btn.innerText = "KIRIM KE OWNER";
        }
    }
</script>
