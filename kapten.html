<div class="animate-up">
    <header class="p-8 flex justify-between items-center">
        <div>
            <p class="text-[10px] font-extrabold text-emerald-500 uppercase tracking-[0.4em] mb-1">Vessel Master</p>
            <h2 id="displayUser" class="text-2xl font-black italic text-white uppercase"></h2>
        </div>
        <p id="valKapal" class="text-[10px] font-bold text-zinc-500 uppercase tracking-widest bg-zinc-800 px-3 py-1 rounded-full"></p>
    </header>

    <div id="kapten-menu" class="px-8 space-y-6">
        <div class="glass-card p-6 border-b-2 border-emerald-500 bg-emerald-500/5 text-center shadow-lg">
            <p class="text-[9px] font-bold text-zinc-500 uppercase mb-2 tracking-widest text-zinc-400">Estimasi Saldo Upah</p>
            <h3 id="valUpah" class="text-3xl font-black text-white tracking-tighter italic">Rp 0</h3>
        </div>

        <div class="grid grid-cols-3 gap-4">
            <div onclick="toggleAnfra()" class="nav-box border border-emerald-500/30 bg-emerald-500/5 hover:bg-emerald-500/10 transition-all">
                <i class="fas fa-file-pen text-emerald-500"></i>
                <span class="text-emerald-500 font-bold">Anfrakan</span>
            </div>
            <div class="nav-box"><i class="fas fa-users text-zinc-500"></i><span>Crew</span></div>
            <div class="nav-box"><i class="fas fa-history text-zinc-500"></i><span>History</span></div>
            <div onclick="window.forceLogout()" class="nav-box border border-red-900/30 hover:bg-red-900/10 transition-all">
                <i class="fas fa-power-off text-red-600"></i>
                <span class="text-red-500 font-bold">Keluar</span>
            </div>
        </div>
    </div>

    <div id="anfra-form" class="hidden px-8 animate-up">
        <div class="flex items-center gap-4 mb-6">
            <button onclick="toggleAnfra()" class="w-10 h-10 glass-card flex items-center justify-center text-zinc-400 active:scale-90 transition-transform">
                <i class="fas fa-arrow-left"></i>
            </button>
            <h2 class="text-lg font-black text-emerald-500 uppercase italic tracking-tight">Form Permintaan</h2>
        </div>
        
        <div class="glass-card p-8 space-y-5 shadow-2xl relative">
            <div class="space-y-2">
                <label class="text-[9px] font-bold text-zinc-500 uppercase tracking-widest block ml-1">Kategori Barang</label>
                <select id="kat" class="input-premium bg-zinc-900 border-zinc-800 focus:border-emerald-500 transition-colors">
                    <option value="Suku Cadang">Suku Cadang / Mesin</option>
                    <option value="Logistik">Logistik / Konsumsi</option>
                    <option value="BBM / Pelumas">BBM / Pelumas</option>
                </select>
            </div>

            <div class="space-y-2">
                <label class="text-[9px] font-bold text-zinc-500 uppercase tracking-widest block ml-1">Rincian & Kuantitas</label>
                <textarea id="item" placeholder="Contoh: Oli 2 Galon, Cat Hitam 1 Pail..." class="input-premium h-44 resize-none pt-4 focus:border-emerald-500 transition-colors"></textarea>
            </div>

            <button onclick="kirimSecure()" id="btnKirim" class="btn-red bg-emerald-600 border-none shadow-xl shadow-emerald-900/30 font-black tracking-widest text-sm">
                KIRIM PERMINTAAN
            </button>
        </div>
    </div>
</div>

<script>
    window.initRoleData = function(res) {
        if(document.getElementById('valUpah')) document.getElementById('valUpah').innerText = formatIDR(res.user.saldo || 0);
        if(document.getElementById('valKapal')) document.getElementById('valKapal').innerText = res.user.kapal || "ACHI FLEET";
        if(document.getElementById('displayUser')) document.getElementById('displayUser').innerText = res.user.username;
        window.currentKapten = res.user;
    };

    function toggleAnfra() {
        document.getElementById('kapten-menu').classList.toggle('hidden');
        document.getElementById('anfra-form').classList.toggle('hidden');
    }

    async function kirimSecure() {
        const itemVal = document.getElementById('item').value.trim();
        const katVal = document.getElementById('kat').value;
        const btn = document.getElementById('btnKirim');

        if(!itemVal) {
            alert("Rincian barang harus diisi, Boss.");
            return;
        }

        document.getElementById('loader').classList.remove('hidden');
        btn.disabled = true;
        btn.innerText = "VERIFIKASI...";

        try {
            // Pengiriman JSON murni dengan penanganan respon yang aman
            const resp = await fetch(API_URL, {
                method: 'POST',
                headers: { 'Content-Type': 'text/plain;charset=utf-8' }, // Menghindari pre-flight CORS yang rumit di Apps Script
                body: JSON.stringify({
                    action: 'submitAnfra',
                    user: window.currentKapten.username,
                    kapal: window.currentKapten.kapal,
                    kategori: katVal,
                    item: itemVal
                })
            });

            const result = await resp.json();

            if(result.success) {
                alert("BERHASIL, Boss! Anfrakan tersimpan dengan ID: " + result.id);
                document.getElementById('item').value = "";
                toggleAnfra();
            } else {
                throw new Error(result.message);
            }
        } catch(e) {
            alert("Sistem Keamanan: Gagal mengirim data. (" + e.message + ")");
        } finally {
            document.getElementById('loader').classList.add('hidden');
            btn.disabled = false;
            btn.innerText = "KIRIM PERMINTAAN";
        }
    }
</script>
