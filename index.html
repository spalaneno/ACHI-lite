<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ACHI - Integration</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;800&display=swap" rel="stylesheet">
    <style>
        :root { --achi-red: #ff3131; --bg-black: #050505; }
        body { background-color: var(--bg-black); color: #fff; font-family: 'Plus Jakarta Sans', sans-serif; overflow: hidden; }
        .glass-card { background: rgba(255, 255, 255, 0.03); backdrop-filter: blur(15px); border: 1px solid rgba(255, 255, 255, 0.08); border-radius: 28px; }
        .input-premium { background: rgba(255,255,255,0.02); border: 1px solid rgba(255,255,255,0.1); border-radius: 16px; color: white; outline: none; padding: 1.2rem; width: 100%; font-size: 14px; }
        .btn-red { background: linear-gradient(135deg, #ff3131, #8b0000); border-radius: 16px; padding: 1.2rem; font-weight: 800; text-transform: uppercase; width: 100%; cursor: pointer; color: white; border: none; }
        .welcome-overlay { position: fixed; inset: 0; background: black; z-index: 1000; display: flex; flex-direction: column; items-center; justify-content: center; }
        .hidden { display: none !important; }
        .animate-zoom { animation: zoomIn 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
        @keyframes zoomIn { from { opacity: 0; transform: scale(0.8); } to { opacity: 1; transform: scale(1); } }
    </style>
</head>
<body>
    <div id="loader" class="fixed inset-0 flex items-center justify-center bg-black z-[999] hidden">
        <div class="w-12 h-12 border-4 border-t-red-600 border-white/10 rounded-full animate-spin"></div>
    </div>

    <div id="welcome-screen" class="welcome-overlay hidden">
        <div class="text-center animate-zoom">
            <h2 class="text-zinc-500 text-[10px] tracking-[0.5em] uppercase font-bold mb-2">Authenticated</h2>
            <h1 class="text-4xl font-black italic text-white" id="welcome-name">...</h1>
            <p class="text-red-600 font-bold mt-2 tracking-widest text-[12px]" id="welcome-role">ACCESS GRANTED</p>
        </div>
    </div>

    <div id="app-container">
        <section id="login-page" class="min-h-screen flex items-center justify-center p-8">
            <div class="w-full max-w-sm text-center">
                <h1 class="text-5xl font-black italic text-red-600 mb-8">ACHI</h1>
                <div class="glass-card p-10">
                    <div class="space-y-4">
                        <input type="text" id="username" placeholder="Username" class="input-premium">
                        <input type="password" id="password" placeholder="Password" class="input-premium">
                        <button onclick="handleLogin()" class="btn-red mt-4">Login</button>
                    </div>
                </div>
            </div>
        </section>
        <div id="dashboard-content" class="hidden min-h-screen"></div>
    </div>

    <script>
        const API_URL = "https://script.google.com/macros/s/AKfycbyxmug54LpTjlK0MAAKS89Ry7I6ZWpB_g0YUA7_nf_EmsFqXB6fuY1LQPizSSmtCg-D/exec";

        async function handleLogin() {
            const u = document.getElementById('username').value.trim();
            const p = document.getElementById('password').value.trim();
            if(!u || !p) return;
            document.getElementById('loader').classList.remove('hidden');
            try {
                const res = await fetch(API_URL, { method: 'POST', body: JSON.stringify({action:'login', username:u, password:p}) });
                const out = await res.json();
                if(out.success) {
                    localStorage.setItem('achi_session', JSON.stringify(out));
                    showWelcome(out);
                } else {
                    alert(out.message);
                    document.getElementById('loader').classList.add('hidden');
                }
            } catch(e) { alert("Gagal koneksi!"); document.getElementById('loader').classList.add('hidden'); }
        }

        function showWelcome(out) {
            const user = out.user.username.toUpperCase();
            let sapaan = "Halo, " + out.user.username;
            if (user === 'HENGKY') sapaan = "Selamat Datang Pak CEO";
            else if (user === 'ACHI') sapaan = "Selamat Datang Ibu CEO";
            
            document.getElementById('welcome-name').innerText = sapaan;
            document.getElementById('welcome-role').innerText = (out.user.role).toUpperCase() + " ACCESS GRANTED";
            document.getElementById('login-page').classList.add('hidden');
            document.getElementById('welcome-screen').classList.remove('hidden');
            document.getElementById('loader').classList.add('hidden');

            setTimeout(() => { renderRolePage(out); }, 1200);
        }

        async function renderRolePage(res) {
            let role = (res.user.role || "").toLowerCase();
            let name = (res.user.username || "").toUpperCase();
            
            // Nama File Bersih (Tanpa Angka 1)
            let file = 'crew.html'; 
            if (name === 'HENGKY' || role === 'owner') file = 'owner.html';
            else if (role === 'kapten') file = 'kapten.html';
            else if (role === 'kkm') file = 'KKM.html';
            else if (role === 'purchasing') file = 'purchasing.html';
            else if (role === 'accounting' || role === 'od') file = 'accounting.html';

            try {
                const resp = await fetch(file + '?v=' + Date.now());
                if(!resp.ok) throw new Error("File " + file + " tidak ditemukan!");
                const html = await resp.text();
                const dash = document.getElementById('dashboard-content');
                dash.innerHTML = html;
                
                const scripts = dash.getElementsByTagName('script');
                for (let s of scripts) {
                    const newScript = document.createElement("script");
                    newScript.text = s.text;
                    document.body.appendChild(newScript).parentNode.removeChild(newScript);
                }
                
                setTimeout(() => {
                    if(window.initRoleData) window.initRoleData(res);
                    document.getElementById('welcome-screen').classList.add('hidden');
                    document.getElementById('login-page').classList.add('hidden');
                    dash.classList.remove('hidden');
                    document.getElementById('loader').classList.add('hidden');
                }, 150);
            } catch(e) { 
                alert("Error: " + e.message);
                localStorage.clear();
                location.reload();
            }
        }

        function formatIDR(v) { return "Rp " + new Intl.NumberFormat('id-ID').format(v || 0); }
    </script>
</body>
</html>
