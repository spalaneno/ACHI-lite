<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ACHI - Aplikasi Crewing & Handling Integrasi</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        :root { --main-red: #b31d1d; --deep-navy: #0a192f; }
        body { background: #fdfdfd; font-family: 'Inter', sans-serif; overflow-x: hidden; }
        .red-gradient { background: linear-gradient(135deg, var(--main-red) 0%, #7a1212 100%); }
        .navy-gradient { background: linear-gradient(135deg, var(--deep-navy) 0%, #112240 100%); }
        .glass-panel { background: rgba(255, 255, 255, 0.95); backdrop-filter: blur(10px); border-radius: 2.5rem; border: 1px solid #eee; }
        .menu-btn { display: flex; flex-direction: column; align-items: center; cursor: pointer; transition: 0.2s; }
        .menu-btn:active { transform: scale(0.9); }
        .icon-box { width: 65px; height: 65px; border-radius: 22px; display: flex; align-items: center; justify-content: center; font-size: 26px; box-shadow: 0 10px 20px rgba(179,29,29,0.12); }
        .view-section { display: none; animation: fadeIn 0.4s ease; }
        .view-section.active { display: block; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        #toast { visibility: hidden; position: fixed; bottom: 40px; left: 50%; transform: translateX(-50%); background: var(--deep-navy); color: white; padding: 12px 30px; border-radius: 50px; font-size: 13px; z-index: 9999; }
        #toast.show { visibility: visible; }
        .logo-container { width: 90px; height: 90px; background: white; border-radius: 30px; padding: 15px; box-shadow: 0 15px 35px rgba(0,0,0,0.2); }
    </style>
</head>
<body>

<div id="toast">Notifikasi</div>

<div id="login-page" class="fixed inset-0 z-[1000] red-gradient flex flex-col items-center justify-center p-10 text-center">
    <div class="logo-container mb-6 flex items-center justify-center">
        <img src="logo.png" alt="Logo" class="w-full h-full object-contain" onerror="this.innerHTML='<i class=\'fas fa-ship text-4xl text-red-700\'></i>'">
    </div>
    <h1 class="text-white font-black text-3xl tracking-tighter italic uppercase">MOBILE</h1>
    <p class="text-white/70 text-[10px] font-bold tracking-[0.3em] uppercase mb-12">APLIKASI CREWING & HANDLING INTEGRASI</p>
    
    <div class="w-full max-w-xs space-y-4">
        <input id="u" type="text" placeholder="USER ID" class="w-full p-4 rounded-2xl bg-white border-none text-gray-800 font-bold text-center outline-none shadow-xl uppercase">
        <input id="p" type="password" placeholder="KODE AKSES" class="w-full p-4 rounded-2xl bg-white border-none text-gray-800 font-bold text-center outline-none shadow-xl">
        <button onclick="doLogin()" id="btn-login" class="w-full navy-gradient text-white p-4 rounded-2xl font-black uppercase shadow-2xl active:scale-95 transition-all">Authorize Access</button>
    </div>
</div>

<div id="app" class="hidden min-h-screen">
    <header class="red-gradient pt-14 pb-24 px-8 flex justify-between items-start text-white rounded-b-[3.5rem] shadow-2xl relative">
        <div>
            <p class="text-[10px] font-bold opacity-70 tracking-widest uppercase">Maritime Terminal</p>
            <h2 id="user-n" class="text-2xl font-black tracking-tight uppercase leading-none mt-1">-</h2>
            <div id="user-r" class="mt-3 inline-block px-3 py-1 bg-black/20 rounded-full text-[9px] font-black uppercase border border-white/10 text-yellow-400"></div>
        </div>
        <div class="flex flex-col items-end gap-3">
            <button onclick="doLogout()" class="w-11 h-11 bg-white/20 rounded-2xl flex items-center justify-center backdrop-blur-md border border-white/10"><i class="fas fa-power-off"></i></button>
            <img src="logo.png" class="w-10 h-10 object-contain brightness-0 invert opacity-50" alt="">
        </div>
    </header>

    <main class="px-6 -mt-14 relative z-10">
        <section id="view-home" class="view-section active">
            <div class="glass-panel p-8 shadow-2xl">
                <div id="menu-grid" class="grid grid-cols-3 gap-y-10 gap-x-6"></div>
            </div>
            <div id="del-alert" class="hidden mt-6 p-5 bg-navy-gradient rounded-[2.5rem] text-white flex items-center gap-4 shadow-xl">
                <i class="fas fa-key text-xl text-yellow-400"></i>
                <p class="text-[10px] font-black uppercase tracking-tight">Otoritas Delegasi Aktif</p>
            </div>
        </section>

        <section id="view-form" class="view-section">
            <div class="bg-white rounded-[3rem] p-8 shadow-2xl border border-gray-100">
                <div class="flex justify-between items-center mb-8">
                    <h3 id="form-title" class="font-black text-[#b31d1d] text-xl tracking-tighter uppercase italic">Input Task</h3>
                    <button onclick="openView('home')" class="text-gray-300 text-3xl"><i class="fas fa-times-circle"></i></button>
                </div>
                <div class="space-y-4">
                    <select id="f-cat" class="w-full p-4 bg-gray-100 rounded-2xl font-bold border-2 border-transparent focus:border-red-500 outline-none"></select>
                    <input id="f-ket" type="text" placeholder="Nama Barang / Sparepart" class="w-full p-4 bg-gray-100 rounded-2xl font-bold outline-none border-2 border-transparent focus:border-red-500">
                    <input id="f-qty" type="text" placeholder="Jumlah & Satuan" class="w-full p-4 bg-gray-100 rounded-2xl font-bold outline-none border-2 border-transparent focus:border-red-500">
                    <textarea id="f-aln" placeholder="Alasan Keperluan" rows="3" class="w-full p-4 bg-gray-100 rounded-2xl font-bold outline-none border-2 border-transparent focus:border-red-500"></textarea>
                    <button id="btn-save" onclick="submitData()" class="w-full red-gradient text-white p-5 rounded-2xl font-black uppercase shadow-xl active:scale-95 transition-all">Submit Request</button>
                </div>
            </div>
        </section>

        <section id="view-list" class="view-section pb-24">
            <div class="flex justify-between items-center mb-6 px-2">
                <button onclick="openView('home')" class="text-[#0a192f] font-black text-xs uppercase"><i class="fas fa-chevron-left mr-2"></i> Dashboard</button>
                <button onclick="refreshData()" class="w-10 h-10 bg-white rounded-xl shadow-lg flex items-center justify-center text-red-600"><i id="sync-icon" class="fas fa-sync"></i></button>
            </div>
            <div id="data-list" class="space-y-4"></div>
        </section>
    </main>
</div>

<script>

    let IS_DEL = false;

    function toast(m) {
        const t = document.getElementById('toast');
        t.innerText = m; t.className = "show";
        setTimeout(() => t.className = "", 3000);
    }
