<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ACHI SYSTEM - LOGIN</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css"/>
    <style>
        .red-gradient { background: linear-gradient(-45deg, #b31d1d, #7a1212); }
    </style>
</head>
<body class="red-gradient min-h-screen flex items-center justify-center p-6">
    <div class="w-full max-w-sm bg-white rounded-[2.5rem] p-10 shadow-2xl text-center animate__animated animate__fadeIn">
        <img src="logo.png" class="w-24 h-24 mx-auto mb-6 object-contain">
        <h1 class="text-2xl font-black text-gray-800 uppercase italic mb-8">ACHI Mobile</h1>
        <div class="space-y-4">
            <input id="u" type="text" placeholder="USER ID" class="w-full p-4 bg-gray-100 rounded-2xl font-bold text-center outline-none uppercase">
            <input id="p" type="password" placeholder="KODE AKSES" class="w-full p-4 bg-gray-100 rounded-2xl font-bold text-center outline-none">
            <button id="btn-login" onclick="doLogin()" class="w-full bg-[#b31d1d] text-white p-4 rounded-2xl font-black uppercase shadow-lg active:scale-95 transition-all">MASUK</button>
        </div>
    </div>

<script>
    const API = "https://script.google.com/macros/s/AKfycbxknjxmr96CRRXtgHZbj8j8lprJGBPzUZhv1o6KqxKq1wyd4Y95ZdtuIMZ9FQ4T2XFS/exec";

    async function doLogin() {
        const u = document.getElementById('u').value, p = document.getElementById('p').value;
        if(!u || !p) return alert("Isi User & Password");
        const btn = document.getElementById('btn-login');
        btn.innerText = "MENGHUBUNGKAN..."; btn.disabled = true;

        try {
            const r = await fetch(`${API}?action=login&u=${u}&p=${p}`);
            const d = await r.json();
            if(d.status === 'success') {
                localStorage.setItem('achi_session', JSON.stringify(d));
                // REDIRECT BERDASARKAN LEVEL
                if(d.level === 1) window.location.href = "owner.html";
                else if(d.level === 2) window.location.href = "admin.html";
                else if(d.level === 3) window.location.href = "purchasing.html";
                else window.location.href = "kapal.html";
            } else { alert("Akses Ditolak!"); btn.innerText = "MASUK"; btn.disabled = false; }
        } catch(e) { alert("Gagal koneksi ke server"); btn.innerText = "MASUK"; btn.disabled = false; }
    }
</script>
</body>
</html>
