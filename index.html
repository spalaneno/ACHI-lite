<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ACHI SYSTEM - LOGIN</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap');
        body {
            background: #000;
            color: #fff;
            font-family: 'Plus Jakarta Sans', sans-serif;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }
        .login-card {
            background: #0a0a0a;
            border: 1px solid #1a1a1a;
            border-radius: 2rem;
            width: 100%;
            max-width: 400px;
            padding: 2.5rem;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        }
        .input-group {
            background: #111;
            border: 1px solid #222;
            border-radius: 1rem;
            padding: 1rem;
            margin-bottom: 1rem;
            transition: 0.3s;
        }
        .input-group:focus-within {
            border-color: #2563eb;
            background: #151515;
        }
        input {
            background: transparent;
            border: none;
            color: white;
            width: 100%;
            outline: none;
            font-size: 0.9rem;
        }
        .btn-login {
            background: #2563eb;
            color: white;
            width: 100%;
            padding: 1.2rem;
            border-radius: 1rem;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 1px;
            transition: 0.3s;
            margin-top: 1rem;
        }
        .btn-login:hover {
            background: #1d4ed8;
            transform: translateY(-2px);
        }
    </style>
</head>
<body>

    <div class="login-card">
        <div class="text-center mb-10">
            <div class="w-16 h-16 bg-blue-600 rounded-2xl mx-auto mb-4 flex items-center justify-center shadow-lg shadow-blue-900/20">
                <i class="fas fa-ship text-2xl"></i>
            </div>
            <h1 class="text-2xl font-black italic tracking-tighter uppercase leading-none">Achi System</h1>
            <p class="text-[9px] text-blue-500 font-bold uppercase tracking-widest mt-1">Fleet Management Executive</p>
        </div>

        <form id="loginForm">
            <div class="input-group">
                <label class="text-[8px] font-bold text-gray-500 uppercase block mb-1">Username</label>
                <input type="text" id="username" placeholder="Masukkan Nama Anda" required autocomplete="off">
            </div>
            
            <div class="input-group">
                <label class="text-[8px] font-bold text-gray-500 uppercase block mb-1">Passkey</label>
                <input type="password" id="password" placeholder="••••••••" required>
            </div>

            <button type="submit" class="btn-login">Masuk ke Dashboard</button>
        </form>

        <p id="errorMsg" class="text-center text-red-500 text-[10px] mt-4 font-bold uppercase hidden">Akses Ditolak! Cek Kembali.</p>
    </div>

    <script>
        document.getElementById('loginForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const user = document.getElementById('username').value.trim().toLowerCase();
            const pass = document.getElementById('password').value;

            // Logika Login Sederhana (Sesuaikan jika ada password khusus)
            if (user === "hengky" || user === "achy" || user === "admin") {
                localStorage.setItem("username", user);
                window.location.href = "dashboard.html";
            } else {
                const error = document.getElementById('errorMsg');
                error.classList.remove('hidden');
                setTimeout(() => error.classList.add('hidden'), 3000);
            }
        });
    </script>
</body>
</html>
