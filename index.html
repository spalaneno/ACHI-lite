<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ACHI SYSTEM PREMIUM</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        :root { --bca-blue: #003366; --bca-light: #005bb7; }
        body { background: #f8fafc; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        .bca-bg { background: linear-gradient(180deg, var(--bca-blue) 0%, var(--bca-light) 100%); }
        .glass-card { background: rgba(255, 255, 255, 0.95); backdrop-filter: blur(10px); border-radius: 2rem; border: 1px solid rgba(255,255,255,0.3); }
        .menu-icon { width: 60px; height: 60px; border-radius: 18px; display: flex; align-items: center; justify-content: center; font-size: 24px; transition: 0.2s; box-shadow: 0 8px 15px rgba(0,0,0,0.05); }
        .menu-icon:active { transform: scale(0.9); }
        .view-section { display: none; animation: slideUp 0.3s ease-out; }
        .view-section.active { display: block; }
        @keyframes slideUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
        #toast { visibility: hidden; position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%); background: #333; color: white; padding: 12px 25px; border-radius: 50px; font-size: 12px; z-index: 9999; }
        #toast.show { visibility: visible; }
        .sync-spin { animation: spin 1s linear infinite; }
        @keyframes spin { 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>

<div id="toast">Notifikasi</div>

<div id="login-page" class="fixed inset-0 z-[1000] bca-bg flex flex-col items-center justify-center p-10">
    <div class="bg-white p-6 rounded-[2.5rem] shadow-2xl mb-8">
        <i class="fas fa-ship text-5xl text-blue-900"></i>
    </div>
    <h1 class="text-white font-black text-3xl tracking-tighter mb-1 italic">ACHI MOBILE</h1>
    <p class="text-blue-200 text-[10px] font-bold tracking-[0.4em] mb-12 uppercase">PT Efendy Jaya Abadi</p>
    
    <div class="w-full max-w-xs space-y-4">
        <input id="u" type="text" placeholder="USER ID" class="w-full p-4 rounded-2xl font-bold text-center outline-none border-none shadow-xl uppercase">
        <input id="p" type="password" placeholder="KODE AKSES" class="w-full p-4 rounded-2xl font-bold text-center outline-none border-none shadow-xl">
        <button onclick="doLogin()" id="btn-login" class="w-full bg-blue-500 text-white p-4 rounded-2xl font-black uppercase shadow-2xl active:scale-95 transition-all">Masuk</button>
    </div>
</div>

<div id="app" class="hidden min-h-screen">
    <header class="bca-bg pt-12 pb-24 px-8 flex justify-between items-start text-white rounded-b-[3rem] shadow-lg">
        <div>
            <p class="text-[10px] font-bold opacity-60 tracking-widest uppercase text-blue-200">Terminal Monitoring</p>
            <h2 id="user-n" class="text-2xl font-black tracking-tight uppercase leading-none mt-1">-</h2>
            <div id="user-r" class="mt-3 inline-block px-3 py-1 bg-black/20 rounded-full text-[9px] font-black uppercase border border-white/10 tracking-wider text-yellow-400"></div>
        </div>
        <button onclick="doLogout()" class="w-12 h-12 bg-white/10 rounded-2xl flex items-center justify-center border border-white/10"><i class="fas fa-power-off text-xl"></i></button>
    </header>

    <main class="px-6 -mt-14">
        <section id="view-home" class="view-section active">
            <div class="glass-card p-8 shadow-2xl">
                <div id="menu-grid" class="grid grid-cols-3 gap-8"></div>
            </div>
            <div id="del-notif" class="hidden mt-6 p-5 bg-orange-500 rounded-[2rem] text-white flex items-center gap-4 shadow-lg shadow-orange-200">
                <i class="fas fa-shield-halved text-2xl"></i>
                <div>
                    <p class="text-[10px] font-black uppercase">Delegasi Otoritas Aktif</p>
                    <p class="text-[8px] opacity-80 font-bold uppercase tracking-tight">Accounting dapat menyetujui pengajuan.</p>
                </div>
            </div>
        </section>

        <section id="view-form" class="view-section">
            <div class="bg-white rounded-[2.5rem] p-8 shadow-2xl border border-gray-100">
                <div class="flex justify-between items-center mb-8">
                    <h3 id="form-type" class="font-black text-blue-900 text-xl tracking-tighter uppercase italic">INPUT</h3>
                    <button onclick="openView('home')" class="text-gray-300 text-3xl"><i class="fas fa-times-circle"></i></button>
                </div>
                <div class="space-y-4">
                    <select id="f-cat" class="w-full p-4 bg-gray-50 rounded-2xl font-bold border-2 border-transparent focus:border-blue-500 outline-none text-sm"></select>
                    <input id="f-ket" type="text" placeholder="Nama Barang / Sparepart" class="w-full p-4 bg-gray-50 rounded-2xl font-bold outline-none border-2 border-transparent focus:border-blue-500 text-sm">
                    <input id="f-qty" type="text" placeholder="Jumlah (Contoh: 2 Unit)" class="w-full p-4 bg-gray-50 rounded-2xl font-bold outline-none border-2 border-transparent focus:border-blue-500 text-sm">
                    <textarea id="f-aln" placeholder="Alasan Keperluan" rows="3" class="w-full p-4 bg-gray-50 rounded-2xl font-bold outline-none border-2 border-transparent focus:border-blue-500 text-sm"></textarea>
                    <button id="btn-save" onclick="submitData()" class="w-full bg-blue-900 text-white p-5 rounded-2xl font-black uppercase shadow-xl active:scale-95 transition-all mt-4">Kirim & Tambah</button>
                    <button onclick="openView('home')" class="w-full text-gray-400 font-bold text-[10px] uppercase tracking-widest text-center mt-2">Kembali Selesai</button>
                </div>
            </div>
        </section>

        <section id="view-list" class="view-section pb-20">
            <div class="flex justify-between items-center mb-6 px-2">
                <button onclick="openView('home')" class="text-blue-900 font-black text-xs uppercase tracking-tighter"><i class="fas fa-arrow-left mr-2"></i> Dashboard</button>
                <button onclick="refreshData()" class="w-10 h-10 bg-white rounded-xl shadow-md flex items-center justify-center text-blue-500"><i id="sync-icon" class="fas fa-sync"></i></button>
            </div>
            <div id="data-list" class="space-y-4"></div>
        </section>
    </main>
</div>

<script>
    // MASUKKAN URL WEB APP BAPAK DI SINI
    const API = "https://script.google.com/macros/s/AKfycbxknjxmr96CRRXtgHZbj8j8lprJGBPzUZhv1o6KqxKq1wyd4Y95ZdtuIMZ9FQ4T2XFS/exec"; 
    
    let USER = JSON.parse(localStorage.getItem('achi_session_v3')) || null;
    let IS_DEL = false;
    let CUR_TYPE = "";

    window.onload = () => { if(USER) start(); };

    function toast(m) {
        const t = document.getElementById('toast');
        t.innerText = m; t.className = "show";
        setTimeout(() => t.className = "", 3000);
    }

    async function doLogin() {
        const u = document.getElementById('u').value;
        const p = document.getElementById('p').value;
        if(!u || !p) return toast("ID & KODE HARUS DIISI");
        
        const btn = document.getElementById('btn-login');
        btn.innerText = "AUTHENTICATING..."; btn.disabled = true;

        try {
            const r = await fetch(`${API}?action=login&u=${u}&p=${p}`);
            const d = await r.json();
            if(d.status === 'success') {
                USER = d;
                localStorage.setItem('achi_session_v3', JSON.stringify(d));
                start();
            } else {
                toast("AKSES DITOLAK");
                btn.innerText = "MASUK"; btn.disabled = false;
            }
        } catch(e) { toast("KONEKSI GAGAL"); btn.disabled = false; btn.innerText = "MASUK"; }
    }

    function start() {
        document.getElementById('login-page').style.display = 'none';
        document.getElementById('app').classList.remove('hidden');
        document.getElementById('user-n').innerText = USER.nama;
        document.getElementById('user-r').innerText = USER.jabatan + " • " + USER.kapal;
        drawMenu();
    }

    function drawMenu() {
        const g = document.getElementById('menu-grid');
        let m = [];
        
        // Logika Menu Individu Sesuai Level
        if(USER.level === 1) { // OWNER
            m.push({id:'pp', l:'m-PP', i:'fa-cart-shopping', c:'bg-blue-50 text-blue-600'});
            m.push({id:'anf', l:'m-Anfrak', i:'fa-ship', c:'bg-indigo-50 text-indigo-600'});
            m.push({id:'lis', l:'m-Info', i:'fa-chart-pie', c:'bg-emerald-50 text-emerald-600'});
            m.push({id:'del', l:'Delegasi', i:'fa-key', c:'bg-orange-50 text-orange-600'});
            m.push({id:'usr', l:'Users', i:'fa-user-gear', c:'bg-gray-50 text-gray-600'});
        } else if(USER.level === 2 || USER.level === 3) { // ACC & ADMIN
            m.push({id:'pp', l:'m-PP', i:'fa-cart-shopping', c:'bg-blue-50 text-blue-600'});
            m.push({id:'anf', l:'m-Anfrak', i:'fa-ship', c:'bg-indigo-50 text-indigo-600'});
            m.push({id:'lis', l:'m-Info', i:'fa-chart-pie', c:'bg-emerald-50 text-emerald-600'});
        } else if(USER.level === 4) { // KAPTEN
            m.push({id:'anf', l:'Anfrakan', i:'fa-anchor', c:'bg-blue-50 text-blue-600'});
            m.push({id:'lis', l:'Status Kapal', i:'fa-list-check', c:'bg-emerald-50 text-emerald-600'});
        } else if(USER.level === 5) { // KKM
            m.push({id:'anf', l:'Anfrak Mesin', i:'fa-engine', i:'fa-gears', c:'bg-red-50 text-red-600'});
            m.push({id:'lis', l:'Pribadi', i:'fa-user-tag', c:'bg-emerald-50 text-emerald-600'});
        }

        g.innerHTML = m.map(x => `
            <div onclick="handle('${x.id}')" class="flex flex-col items-center cursor-pointer">
                <div class="menu-icon ${x.c}"><i class="fas ${x.i}"></i></div>
                <span class="text-[9px] font-black text-blue-950 mt-3 uppercase text-center leading-tight">${x.l}</span>
            </div>
        `).join('');
    }

    function handle(id) {
        if(id === 'lis') openView('list');
        else if(id === 'pp') openForm('Permintaan Pembelian');
        else if(id === 'anf') openForm('Anfrakan');
        else if(id === 'del') {
            IS_DEL = !IS_DEL;
            document.getElementById('del-notif').classList.toggle('hidden', !IS_DEL);
            toast("DELEGASI: " + (IS_DEL ? "AKTIF" : "OFF"));
        } else { toast("MENU TERKUNCI"); }
    }

    function openView(v) {
        document.querySelectorAll('.view-section').forEach(s => s.classList.remove('active'));
        document.getElementById('view-'+v).classList.add('active');
        if(v === 'list') refreshData();
    }

    function openForm(t) {
        CUR_TYPE = t;
        document.getElementById('form-type').innerText = t;
        const s = document.getElementById('f-cat');
        s.innerHTML = t === 'Anfrakan' 
            ? '<option>Anfrakan Deck/Kapal</option><option>Anfrakan Kamar Mesin</option>'
            : '<option>PP Sparepart</option><option>PP Kantor/Umum</option>';
        openView('form');
    }

    async function submitData() {
        const k = document.getElementById('f-ket').value;
        const q = document.getElementById('f-qty').value;
        if(!k || !q) return toast("NAMA & JUMLAH WAJIB DIISI");

        const btn = document.getElementById('btn-save');
        btn.innerText = "SEDANG MENGIRIM..."; btn.disabled = true;

        const p = {
            action: 'input',
            tgl: new Date().toLocaleDateString('id-ID'),
            jam: new Date().toLocaleTimeString('id-ID'),
            kategori: document.getElementById('f-cat').value,
            keterangan: k,
            alasan: document.getElementById('f-aln').value,
            pemohon: USER.nama,
            kapal: USER.kapal
        };

        try {
            await fetch(API, { method: 'POST', body: JSON.stringify(p) });
            toast("BERHASIL TERKIRIM!");
            // Reset input tapi tidak logout
            document.getElementById('f-ket').value = "";
            document.getElementById('f-qty').value = "";
            document.getElementById('f-aln').value = "";
            btn.innerText = "Kirim & Tambah"; btn.disabled = false;
        } catch(e) { toast("GAGAL MENGIRIM"); btn.disabled = false; }
    }

    async function refreshData() {
        const l = document.getElementById('data-list');
        const ic = document.getElementById('sync-icon');
        ic.classList.add('sync-spin');
        l.innerHTML = `<div class="p-20 text-center text-gray-400 font-bold uppercase tracking-widest text-xs">Menyaring Data...</div>`;
        
        try {
            // Gunakan parameter lengkap untuk filter privat
            const query = `?action=getData&level=${USER.level}&kapal=${USER.kapal}&nama=${USER.nama}&v=${Date.now()}`;
            const r = await fetch(API + query);
            const d = await r.json();
            
            if (d.transaksi.length === 0) {
                l.innerHTML = `<div class="p-10 text-center text-gray-400 text-[10px] font-bold uppercase tracking-widest">Belum Ada Data</div>`;
            } else {
                l.innerHTML = d.transaksi.reverse().map(i => renderCard(i)).join('');
            }
        } catch(e) { l.innerHTML = "Gagal memuat data."; }
        ic.classList.remove('sync-spin');
    }

    function renderCard(i) {
        let st = i[8]; // Status
        let btn = "";
        
        // Alur Verifikasi Sesuai Level & Delegasi
        if([2,3].includes(USER.level) && st === 'MENUNGGU ADMIN') {
            btn = `<button onclick="update('${i[0]}', 'TELAH DIPERIKSA')" class="w-full bg-blue-50 border border-blue-100 text-blue-700 py-4 rounded-2xl font-black text-[9px] mt-4 uppercase">Verifikasi Admin</button>`;
        } else if((USER.level === 1 || (USER.level === 2 && IS_DEL)) && st === 'TELAH DIPERIKSA') {
            btn = `<button onclick="update('${i[0]}', 'DISETUJUI OWNER')" class="w-full bg-blue-900 text-white py-4 rounded-2xl font-black text-[9px] mt-4 uppercase shadow-lg shadow-blue-200">Setujui Owner</button>`;
        }

        const color = st.includes('DISETUJUI') ? 'bg-emerald-100 text-emerald-700' : (st.includes('TELAH') ? 'bg-blue-100 text-blue-700' : 'bg-gray-100 text-gray-500');

        return `
        <div class="bg-white p-6 rounded-[2.5rem] shadow-sm border border-gray-100">
            <div class="flex justify-between items-center mb-4">
                <span class="${color} px-3 py-1 rounded-full text-[8px] font-black uppercase">${st}</span>
                <span class="text-[9px] text-gray-300 font-bold">${i[1]}</span>
            </div>
            <h4 class="text-sm font-black text-blue-950 uppercase leading-tight tracking-tighter">${i[4]}</h4>
            <div class="mt-3 flex flex-wrap gap-2">
                <span class="text-[9px] font-bold text-gray-400 bg-gray-50 px-2 py-1 rounded-lg uppercase tracking-tighter">${i[7]}</span>
                <span class="text-[9px] font-bold text-gray-400 bg-gray-50 px-2 py-1 rounded-lg uppercase tracking-tighter">${i[9]}</span>
            </div>
            <p class="mt-4 text-[10px] text-gray-500 font-medium italic border-l-2 border-gray-200 pl-3">"${i[5]}"</p>
            ${btn}
        </div>`;
    }

    async function update(id, s) {
        toast("UPDATING...");
        await fetch(API, { method: 'POST', body: JSON.stringify({ action: 'changeStatus', id: id, s: s }) });
        refreshData();
    }

    function doLogout() { if(confirm("Yakin ingin keluar aplikasi?")) { localStorage.clear(); location.reload(); } }
</script>
</body>
</html>
