<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ACHI - Premium Integration</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --achi-red: #ff3131;
            --achi-dark-red: #8b0000;
            --bg-black: #080808;
            --card-bg: rgba(25, 25, 25, 0.7);
        }
        body { 
            background-color: var(--bg-black); 
            color: #f8f9fa; 
            font-family: 'Plus Jakarta Sans', sans-serif;
            letter-spacing: -0.01em;
        }
        .glass-panel {
            background: var(--card-bg);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 28px;
        }
        .premium-btn {
            background: linear-gradient(135deg, var(--achi-red) 0%, var(--achi-dark-red) 100%);
            box-shadow: 0 10px 20px rgba(255, 49, 49, 0.2);
            border-radius: 16px;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .premium-btn:active { transform: scale(0.96); opacity: 0.9; }
        
        .input-premium {
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 18px;
            color: white;
            transition: 0.3s;
        }
        .input-premium:focus {
            border-color: var(--achi-red);
            background: rgba(255, 255, 255, 0.08);
            outline: none;
        }
        .owner-card {
            background: linear-gradient(160deg, #1a1a1a 0%, #000 100%);
            border-left: 5px solid var(--achi-red);
        }
        .nav-icon-box {
            width: 56px; height: 56px;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.05);
            display: flex; align-items: center; justify-content: center;
            border-radius: 20px;
            transition: 0.3s;
        }
        .nav-item:active .nav-icon-box { background: var(--achi-red); color: white; }

        /* Animation */
        .fade-in { animation: fadeIn 0.8s ease-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body class="antialiased">

    <div id="loader" class="hidden fixed inset-0 flex items-center justify-center bg-black z-[100]">
        <div class="flex flex-col items-center">
            <div class="w-16 h-16 border-4 border-t-red-600 border-r-transparent border-b-red-900 border-l-transparent rounded-full animate-spin"></div>
            <p class="mt-6 text-[10px] tracking-[0.5em] text-gray-500 font-bold uppercase">ACHI Premium</p>
        </div>
    </div>

    <section id="login-page" class="min-h-screen flex items-center justify-center p-6 bg-[radial-gradient(circle_at_top_right,_var(--tw-gradient-stops))] from-zinc-900 via-black to-black">
        <div class="w-full max-w-sm text-center">
            <img src="logo.png" alt="Logo" class="w-32 mx-auto mb-10 drop-shadow-[0_0_15px_rgba(255,49,49,0.3)]">
            <div class="glass-panel p-10 shadow-2xl">
                <h1 class="text-3xl font-extrabold tracking-tighter italic text-white mb-2">INTEGRASI</h1>
                <p class="text-[10px] text-zinc-500 tracking-[0.6em] uppercase mb-10">Crewing & Handling</p>
                
                <div class="space-y-4">
                    <input type="text" id="username" placeholder="ID Pengguna" class="w-full p-4 input-premium text-sm">
                    <input type="password" id="password" placeholder="Kata Sandi" class="w-full p-4 input-premium text-sm">
                    <button onclick="handleLogin()" class="w-full p-4 premium-btn text-white font-bold text-sm tracking-widest uppercase mt-4">Akses Masuk</button>
                </div>
                <p id="loginError" class="text-red-500 text-[10px] mt-6 hidden font-semibold uppercase tracking-wider"></p>
            </div>
        </div>
    </section>

    <section id="main-dashboard" class="hidden min-h-screen pb-28">
        <header class="p-8 flex justify-between items-center bg-gradient-to-b from-black to-transparent">
            <div>
                <p id="welcomeGreeting" class="text-[11px] font-bold text-zinc-500 uppercase tracking-widest mb-1"></p>
                <h2 id="userDisplayName" class="text-xl font-extrabold text-white tracking-tight"></h2>
            </div>
            <div class="relative">
                <img id="userPhoto" src="https://via.placeholder.com/100" class="w-14 h-14 rounded-2xl object-cover border-2 border-zinc-800 p-1 shadow-2xl">
                <div class="absolute -bottom-1 -right-1 w-4 h-4 bg-green-500 border-2 border-black rounded-full"></div>
            </div>
        </header>

        <div class="px-8 space-y-8 fade-in">
            <div id="crew-finance" class="grid grid-cols-1 gap-4">
                <div class="glass-panel p-6 bg-gradient-to-br from-zinc-900 to-black border-l-4 border-red-600">
                    <div class="flex justify-between items-start mb-4">
                        <span class="text-[10px] font-bold text-zinc-500 uppercase tracking-widest">Saldo Penghasilan</span>
                        <i class="fas fa-wallet text-zinc-800 text-xl"></i>
                    </div>
                    <h3 id="displaySaldo" class="text-3xl font-extrabold tracking-tighter">Rp 0</h3>
                </div>
                <div class="glass-panel p-6 bg-zinc-900/30">
                    <div class="flex justify-between items-start mb-2">
                        <span class="text-[10px] font-bold text-zinc-500 uppercase tracking-widest">Tanggungan / Hutang</span>
                        <i class="fas fa-hand-holding-dollar text-red-900/40 text-xl"></i>
                    </div>
                    <h3 id="displayHutang" class="text-xl font-bold text-red-500 tracking-tight">Rp 0</h3>
                </div>
            </div>

            <div id="owner-stats" class="hidden space-y-4">
                <h3 class="text-[10px] font-extrabold text-zinc-500 uppercase tracking-[0.3em]">Ringkasan Operasional</h3>
                <div class="owner-card p-8 rounded-[32px] shadow-2xl">
                    <p class="text-zinc-500 text-xs font-semibold mb-2 italic">Total Pengeluaran Real-time</p>
                    <h3 id="statHarian" class="text-4xl font-black tracking-tighter text-white">Rp 0</h3>
                    <div class="mt-6 pt-6 border-t border-zinc-800 flex justify-between items-center text-[10px] font-bold text-zinc-400">
                        <span><i class="fas fa-arrow-up text-red-500 mr-2"></i>MINGGUAN</span>
                        <span id="statMingguan">Rp 0</span>
                    </div>
                </div>
            </div>

            <div class="pt-4">
                <h3 class="text-[10px] font-extrabold text-zinc-500 uppercase tracking-[0.3em] mb-6 px-1">Menu Utama</h3>
                <div class="grid grid-cols-4 gap-6">
                    <div class="nav-item flex flex-col items-center space-y-3 cursor-pointer">
                        <div class="nav-icon-box text-red-500"><i class="fas fa-ship text-lg"></i></div>
                        <span class="text-[9px] font-bold text-zinc-400 uppercase tracking-tighter">Armada</span>
                    </div>
                    <div class="nav-item flex flex-col items-center space-y-3 cursor-pointer">
                        <div class="nav-icon-box text-red-500"><i class="fas fa-file-invoice-dollar text-lg"></i></div>
                        <span class="text-[9px] font-bold text-zinc-400 uppercase tracking-tighter">Anfrakan</span>
                    </div>
                    <div class="nav-item flex flex-col items-center space-y-3 cursor-pointer">
                        <div class="nav-icon-box text-red-500"><i class="fas fa-clock-rotate-left text-lg"></i></div>
                        <span class="text-[9px] font-bold text-zinc-400 uppercase tracking-tighter">Riwayat</span>
                    </div>
                    <div onclick="location.reload()" class="nav-item flex flex-col items-center space-y-3 cursor-pointer">
                        <div class="nav-icon-box text-zinc-600"><i class="fas fa-power-off text-lg"></i></div>
                        <span class="text-[9px] font-bold text-zinc-500 uppercase tracking-tighter">Keluar</span>
                    </div>
                </div>
            </div>
        </div>

        <nav class="fixed bottom-8 left-8 right-8 h-20 glass-panel shadow-[0_20px_50px_rgba(0,0,0,0.5)] flex justify-around items-center px-4 z-50">
            <i class="fas fa-home text-red-500 text-xl"></i>
            <i class="fas fa-chart-pie text-zinc-600 text-xl"></i>
            <div class="w-14 h-14 premium-btn flex items-center justify-center -mt-12 border-[6px] border-[#080808] text-white shadow-xl">
                <i class="fas fa-plus text-xl"></i>
            </div>
            <i class="fas fa-users text-zinc-600 text-xl"></i>
            <i class="fas fa-gear text-zinc-600 text-xl"></i>
        </nav>
    </section>

    <script>
        const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbypG1Pg3kTaQIc2HObIix3lt6O7nf0PiICenityDVzfIn6-Xp_jfS_Na-ydqZ-q_iCl/exec";

        const formatIDR = (val) => "Rp " + new Intl.NumberFormat('id-ID').format(val);

        async function handleLogin() {
            const user = document.getElementById('username').value.trim();
            const pass = document.getElementById('password').value.trim();
            const loader = document.getElementById('loader');
            const errorMsg = document.getElementById('loginError');
            
            if(!user || !pass) return;
            loader.classList.remove('hidden');
            errorMsg.classList.add('hidden');

            try {
                const response = await fetch(`${WEB_APP_URL}?action=login`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                    body: JSON.stringify({ username: user, password: pass })
                });
                const result = await response.json();

                if(result.success) {
                    document.getElementById('login-page').classList.add('hidden');
                    document.getElementById('main-dashboard').classList.remove('hidden');
                    
                    let g = "Selamat Datang";
                    let d = result.user.username;
                    let u = result.user.username.toUpperCase();

                    // LOGIKA FIX UNTUK ACHI & HENGKY
                    if(u === "ACHI" || u === "CHRISTY NOVALITA PRATIWI") {
                        g = "Selamat Datang Ibu CEO";
                        d = "Boss Achy";
                    } else if(u === "HENGKY") {
                        g = "Selamat Datang Bapak CEO";
                        d = "Pak CEO";
                    }

                    document.getElementById('welcomeGreeting').innerText = g;
                    document.getElementById('userDisplayName').innerText = d;
                    document.getElementById('displaySaldo').innerText = formatIDR(result.user.saldo);
                    document.getElementById('displayHutang').innerText = formatIDR(result.user.hutang);
                    if(result.user.foto) document.getElementById('userPhoto').src = result.user.foto;

                    if(result.user.role === 'Owner') {
                        document.getElementById('owner-stats').classList.remove('hidden');
                        document.getElementById('crew-finance').classList.add('hidden');
                        document.getElementById('statHarian').innerText = formatIDR(result.stats.harian);
                        document.getElementById('statMingguan').innerText = formatIDR(result.stats.mingguan);
                    }
                } else {
                    errorMsg.innerText = result.message;
                    errorMsg.classList.remove('hidden');
                }
            } catch (e) {
                errorMsg.innerText = "GANGGUAN SERVER";
                errorMsg.classList.remove('hidden');
            } finally {
                loader.classList.add('hidden');
            }
        }
    </script>
</body>
</html>
