<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ACHI - Aplikasi Crewing & Handling Integrasi</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        .achi-red { background-color: #e21e26; }
        .text-achi-red { color: #e21e26; }
        body { background-color: #f3f4f6; font-family: 'Segoe UI', sans-serif; }
        .tab-active { border-bottom: 3px solid #e21e26; color: #e21e26; font-weight: bold; }
    </style>
</head>
<body class="max-w-md mx-auto min-h-screen pb-24">

    <div id="login-page" class="p-10 pt-16 text-center bg-white min-h-screen flex flex-col justify-center animate-fade-in">
        <div class="mb-10">
            <img src="logo.png" alt="Logo ACHI" class="w-64 mx-auto mb-6 object-contain">
            <p class="text-[11px] font-bold text-gray-400 uppercase tracking-[0.3em] italic">Aplikasi Crewing & Handling Integrasi</p>
        </div>
        
        <div class="space-y-4">
            <input id="u-name" type="text" placeholder="Username" class="w-full p-4 rounded-2xl border border-gray-200 outline-none focus:border-red-500 transition bg-gray-50 text-center">
            <input id="u-pass" type="password" placeholder="Password" class="w-full p-4 rounded-2xl border border-gray-200 outline-none focus:border-red-500 transition bg-gray-50 text-center">
            <button onclick="login()" id="btn-login" class="w-full achi-red text-white p-4 rounded-2xl font-black shadow-lg uppercase tracking-widest active:scale-95 transition">Masuk</button>
        </div>
    </div>

    <div id="app" class="hidden">
        <div class="achi-red p-6 rounded-b-[40px] text-white shadow-xl mb-6 relative">
            <div class="flex justify-between items-center">
                <div>
                    <p id="user-display" class="text-xl font-bold italic">-</p>
                    <p class="text-[9px] opacity-80 uppercase tracking-widest font-bold text-yellow-300">Sistem Integrasi Armada</p>
                </div>
                <button onclick="logout()" class="bg-white/20 p-2 rounded-xl text-xs font-bold border border-white/30">
                    <i class="fas fa-sign-out-alt mr-1"></i> LOGOUT
                </button>
            </div>
        </div>

        <div id="owner-report" class="px-6 mb-6 hidden">
            <div class="bg-white p-4 rounded-3xl shadow-sm border border-gray-100">
                <h3 class="text-[10px] font-bold text-gray-400 uppercase mb-3 tracking-widest text-center italic border-b pb-2">Ringkasan Pengeluaran</h3>
                <div class="grid grid-cols-3 gap-2 text-center">
                    <div>
                        <p class="text-[8px] text-gray-400 font-bold uppercase">Hari Ini</p>
                        <p id="sum-day" class="text-[11px] font-black text-red-600">Rp0</p>
                    </div>
                    <div class="border-x">
                        <p class="text-[8px] text-gray-400 font-bold uppercase">Minggu Ini</p>
                        <p id="sum-week" class="text-[11px] font-black text-red-600">Rp0</p>
                    </div>
                    <div>
                        <p class="text-[8px] text-gray-400 font-bold uppercase">Bulan Ini</p>
                        <p id="sum-month" class="text-[11px] font-black text-red-600">Rp0</p>
                    </div>
                </div>
            </div>
        </div>

        <div class="px-6 grid grid-cols-2 gap-4 mb-8">
            <div onclick="openModal()" class="bg-white p-6 rounded-3xl text-center shadow-md border-b-4 border-gray-800 active:scale-95 transition">
                <i class="fas fa-plus-circle text-3xl text-achi-red mb-2"></i>
                <p class="text-[10px] font-bold uppercase text-gray-600">Input Baru</p>
            </div>
            <div onclick="exportExcel()" class="bg-white p-6 rounded-3xl text-center shadow-md border-b-4 border-green-700 active:scale-95 transition">
                <i class="fas fa-file-excel text-3xl text-green-700 mb-2"></i>
                <p class="text-[10px] font-bold uppercase text-gray-600">Download Excel</p>
            </div>
        </div>

        <div id="history-section" class="px-6 hidden">
            <h3 class="font-bold text-gray-800 text-xs uppercase mb-4 tracking-widest flex items-center">
                <span class="w-2 h-4 achi-red mr-2"></span> Riwayat Transaksi
            </h3>
            <div id="list" class="space-y-4"></div>
        </div>
    </div>

    <div id="modal" class="fixed inset-0 bg-black/70 hidden items-end z-50">
        <div class="bg-white w-full rounded-t-[40px] p-8 max-w-md shadow-2xl">
            <h3 class="font-bold text-achi-red mb-6 italic uppercase border-b pb-2">Form Transaksi</h3>
            <div class="space-y-4">
                <select id="f-kapal" class="w-full p-4 bg-gray-50 border rounded-2xl text-sm font-bold">
                    <option>KM. Nabawi 09</option><option>KM. Lastika Star</option>
                    <option>KM. Srikandi 01</option><option>Rakit 01</option>
                </select>
                <input id="f-ket" type="text" placeholder="Keterangan Pengeluaran" class="w-full p-4 bg-gray-50 border rounded-2xl text-sm outline-none">
                <input id="f-jumlah" type="number" placeholder="Nominal Rp" class="w-full p-4 bg-gray-50 border rounded-2xl text-sm font-bold text-achi-red outline-none">
                <div class="p-4 bg-gray-50 rounded-2xl border-2 border-dashed">
                    <input id="f-file" type="file" accept="image/*" class="text-[10px] w-full mb-3">
                    <textarea id="f-alasan" placeholder="Alasan tanpa nota..." class="w-full p-3 text-xs border rounded-xl h-16 outline-none shadow-inner"></textarea>
                </div>
                <button onclick="kirim()" id="btn-kirim" class="w-full achi-red text-white p-5 rounded-2xl font-bold uppercase shadow-xl active:scale-95 transition">Simpan Data</button>
                <button onclick="closeModal()" class="w-full text-gray-400 text-[10px] py-2 font-bold uppercase">Batal</button>
            </div>
        </div>
    </div>

    <script>
        const API = "https://script.google.com/macros/s/AKfycbyIW_2ooeLL3ukD4xwjad4U-2zaOlimc0NU8JZlLQlyquaRtg8cbQhbuXg_cErZglDC/exec";
        let currentUser = JSON.parse(localStorage.getItem('achi_session'));

        // Cek Session saat buka app
        window.onload = () => {
            if(currentUser) {
                showApp(currentUser);
            }
        };

        async function login() {
            const user = document.getElementById('u-name').value;
            const pass = document.getElementById('u-pass').value;
            if(!user || !pass) return alert("Isi Username & Password!");

            const btn = document.getElementById('btn-login');
            btn.innerText = "VERIFYING...";
            
            // Note: Update Apps Script doGet untuk handle password
            const r = await fetch(`${API}?action=login&username=${user}&password=${pass}`);
            const d = await r.json();

            if(d.status == 'success') {
                localStorage.setItem('achi_session', JSON.stringify(d));
                showApp(d);
            } else {
                alert("Login Gagal! Periksa kembali akun Anda.");
                btn.innerText = "MASUK";
            }
        }

        function showApp(data) {
            document.getElementById('login-page').style.display = 'none';
            document.getElementById('app').classList.remove('hidden');
            document.getElementById('user-display').innerText = data.nama;
            if(data.level >= 2) {
                document.getElementById('history-section').classList.remove('hidden');
                document.getElementById('owner-report').classList.remove('hidden');
                loadData();
            }
        }

        function logout() {
            localStorage.removeItem('achi_session');
            location.reload();
        }

        function openModal() { document.getElementById('modal').style.display = 'flex'; }
        function closeModal() { document.getElementById('modal').style.display = 'none'; }

        async function kirim() {
            const btn = document.getElementById('btn-kirim');
            btn.innerText = "SUBMITTING..."; btn.disabled = true;
            
            const file = document.getElementById('f-file').files[0];
            let img = null;
            if(file) {
                const reader = new FileReader();
                img = await new Promise(res => {
                    reader.onload = () => res(reader.result.split(',')[1]);
                    reader.readAsDataURL(file);
                });
            }

            const payload = {
                table: "Transaksi",
                kapal: document.getElementById('f-kapal').value,
                kategori: "Anfrakan",
                keterangan: document.getElementById('f-ket').value,
                jumlah: document.getElementById('f-jumlah').value,
                alasan: document.getElementById('f-alasan').value,
                user: currentUser.nama, 
                image: img, 
                mimeType: file ? file.type : null
            };

            await fetch(API, { method: 'POST', body: JSON.stringify(payload) });
            alert("Data Berhasil Disimpan!");
            location.reload();
        }

        async function loadData() {
            const r = await fetch(`${API}?action=getTransaksi`);
            const data = await r.json();
            
            let totalDay = 0, totalWeek = 0, totalMonth = 0;
            const now = new Date();
            const startOfWeek = new Date(now.setDate(now.getDate() - now.getDay()));

            document.getElementById('list').innerHTML = data.map(i => {
                const tgl = new Date(i.Tanggal);
                const nominal = Number(i.Jumlah);
                
                // Kalkulasi Laporan
                if(tgl.toDateString() === new Date().toDateString()) totalDay += nominal;
                if(tgl >= startOfWeek) totalWeek += nominal;
                if(tgl.getMonth() === new Date().getMonth()) totalMonth += nominal;

                return `
                    <div class="bg-white p-5 rounded-3xl shadow-sm border-l-[6px] ${i.Bukti_Foto == 'Tanpa Bukti' ? 'border-red-600' : 'border-gray-800'}">
                        <div class="flex justify-between text-[10px] text-gray-400 mb-1 font-bold">
                            <span>${i.Kapal}</span><span>${tgl.toLocaleDateString('id-ID')}</span>
                        </div>
                        <div class="flex justify-between items-center">
                            <p class="text-sm font-bold uppercase text-gray-700">${i.Keterangan}</p>
                            <p class="text-sm font-black text-red-600">Rp${nominal.toLocaleString()}</p>
                        </div>
                        ${i.Bukti_Foto == 'Tanpa Bukti' ? `<p class="text-[9px] text-red-500 mt-2 italic font-bold">⚠️ ${i.Alasan_Tanpa_Bukti}</p>` : `<a href="${i.Bukti_Foto}" target="_blank" class="text-[9px] text-blue-600 font-bold mt-2 inline-block underline italic uppercase">Lihat Nota</a>`}
                    </div>
                `;
            }).join('');

            document.getElementById('sum-day').innerText = "Rp" + totalDay.toLocaleString();
            document.getElementById('sum-week').innerText = "Rp" + totalWeek.toLocaleString();
            document.getElementById('sum-month').innerText = "Rp" + totalMonth.toLocaleString();
        }

        async function exportExcel() {
            const r = await fetch(`${API}?action=getTransaksi`);
            const data = await r.json();
            const ws = XLSX.utils.json_to_sheet(data);
            const wb = XLSX.utils.book_new();
            XLSX.utils.book_append_sheet(wb, ws, "Rekap_ACHI");
            XLSX.writeFile(wb, `LAPORAN_ACHI_${new Date().toLocaleDateString()}.xlsx`);
        }
    </script>
</body>
</html>
