<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - PT Efendy Jaya Abadi</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(-45deg, #b31d1d, #7a1212, #d32f2f, #9a0007);
            background-size: 400% 400%;
            animation: gradientMove 15s ease infinite;
            min-height: 100vh;
        }
        @keyframes gradientMove {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }
        .glass-header { background: rgba(0, 0, 0, 0.2); backdrop-filter: blur(15px); border-bottom: 1px solid rgba(255,255,255,0.1); }
        .menu-card {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 2rem;
            transition: 0.3s;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }
        .menu-card:active { transform: scale(0.95); }
        .icon-box { background: linear-gradient(135deg, #b31d1d, #7a1212); }
    </style>
</head>
<body class="pb-10">

    <div class="glass-header p-8 rounded-b-[3.5rem] mb-6 shadow-2xl">
        <div class="flex flex-col items-center">
            <img src="https://i.ibb.co/6P0qXFf/LOGO.png" alt="PT Efendy Jaya Abadi" class="h-24 mb-4 drop-shadow-lg">
            
            <div class="bg-white/10 px-6 py-3 rounded-2xl backdrop-blur-md border border-white/20 w-full mt-4">
                <p id="u-nama" class="font-black text-white text-center uppercase tracking-tighter">Memuat Nama...</p>
                <div class="flex justify-center gap-2 items-center opacity-70">
                   <p id="u-role" class="text-[8px] text-white font-bold uppercase tracking-widest italic"></p>
                </div>
            </div>
        </div>
    </div>

    <div class="px-6">
        <div id="menu-grid" class="grid grid-cols-2 gap-5">
            </div>
    </div>

    <div class="px-6 mt-8">
        <button onclick="logout()" class="w-full bg-white/10 border border-white/20 p-4 rounded-2xl text-white font-black uppercase text-[10px] tracking-[0.3em] backdrop-blur-sm italic">
            <i class="fas fa-power-off mr-2"></i> Log Out
        </button>
    </div>

<script>
    const USER = JSON.parse(localStorage.getItem('achi_session'));
    
    if(!USER) {
        window.location.href = "index.html";
    } else {
        document.getElementById('u-nama').innerText = USER.nama;
        document.getElementById('u-role').innerText = `${USER.jabatan} | ${USER.kapal}`;
    }

    const grid = document.getElementById('menu-grid');
    let menus = [];

    // Semua level sekarang bisa melihat menu utama sesuai fungsinya
    
    // Menu Khusus Owner & Admin (Level 1 & 2)
    if(USER.level <= 2) {
        menus.push({n: "BONGKAR TRIP", i: "fa-ship", l: "trip.html", desc: "Bagi Hasil Pajeko"});
        menus.push({n: "HUTANG KRU", i: "fa-users-cog", l: "kru-list.html", desc: "Kas & Pinjaman"});
        menus.push({n: "PURCHASING", i: "fa-shopping-cart", l: "purchasing.html", desc: "Belanja & Nota"});
    }
    
    // MENU LAPORAN HARIAN (Tampil untuk SEMUA atau Level Kapten 4)
    // Saya pastikan muncul di dashboard
    menus.push({n: "LAPOR HARIAN", i: "fa-file-invoice", l: "logistik.html", desc: "Anfrakan & Stok"});
    
    // Menu BBM (Owner, Admin, Kapten)
    if(USER.level <= 2 || USER.level == 4) {
        menus.push({n: "MONITOR BBM", i: "fa-gas-pump", l: "bbm.html", desc: "Sisa Stok Solar"});
    }

    grid.innerHTML = menus.map(m => `
        <div onclick="location.href='${m.l}'" class="menu-card p-6 flex flex-col items-center text-center">
            <div class="icon-box w-14 h-14 rounded-2xl flex items-center justify-center mb-4 shadow-lg">
                <i class="fas ${m.i} text-white text-xl"></i>
            </div>
            <h3 class="text-[11px] font-black text-gray-800 uppercase tracking-tighter leading-none mb-1">${m.n}</h3>
            <p class="text-[7px] text-gray-400 font-bold uppercase tracking-widest">${m.desc}</p>
        </div>
    `).join('');

    function logout() {
        if(confirm("Keluar dari Sistem?")) {
            localStorage.clear();
            window.location.href = "index.html";
        }
    }
</script>
</body>
</html>
