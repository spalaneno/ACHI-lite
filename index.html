<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ACHI - Sistem Laporan Integrasi</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        .achi-red { background-color: #e21e26; }
        .text-achi-red { color: #e21e26; }
        body { background-color: #f3f4f6; font-family: 'Segoe UI', sans-serif; }
        
        /* CSS KHUSUS PRINT PDF */
        @media print {
            body * { visibility: hidden; background: white !important; }
            #print-area, #print-area * { visibility: visible; }
            #print-area { position: absolute; left: 0; top: 0; width: 100%; }
            .no-print { display: none !important; }
            .print-only { display: block !important; }
            table { width: 100%; border-collapse: collapse; margin-top: 20px; }
            th, td { border: 1px solid #ddd; padding: 8px; text-align: left; font-size: 10pt; }
            th { background-color: #f2f2f2 !important; color: black !important; }
        }
        .print-only { display: none; }
    </style>
</head>
<body class="max-w-md mx-auto min-h-screen pb-24">

    <div id="login-page" class="p-10 pt-16 text-center bg-white min-h-screen flex flex-col justify-center">
        <img src="logo.png" alt="Logo ACHI" class="w-64 mx-auto mb-6 object-contain">
        <p class="text-[11px] font-bold text-gray-400 uppercase tracking-[0.3em] mb-8 italic">Aplikasi Crewing & Handling Integrasi</p>
        <div class="space-y-4">
            <input id="u-name" type="text" placeholder="Username" class="w-full p-4 rounded-2xl border border-gray-200 outline-none focus:border-red-500 transition bg-gray-50 text-center">
            <input id="u-pass" type="password" placeholder="Password" class="w-full p-4 rounded-2xl border border-gray-200 outline-none focus:border-red-500 transition bg-gray-50 text-center">
            <button onclick="login()" id="btn-login" class="w-full achi-red text-white p-4 rounded-2xl font-black shadow-lg uppercase tracking-widest active:scale-95 transition">Masuk</button>
        </div>
    </div>

    <div id="app" class="hidden animate-fade-in">
        <div class="achi-red p-6 rounded-b-[40px] text-white shadow-xl mb-6 no-print">
            <div class="flex justify-between items-center">
                <div>
                    <p id="user-display" class="text-xl font-bold italic">-</p>
                    <p class="text-[9px] opacity-80 uppercase tracking-widest font-bold text-yellow-300 italic">Sistem Integrasi Armada</p>
                </div>
                <button onclick="logout()" class="bg-white/20 p-2 rounded-xl text-[10px] font-bold border border-white/30">LOGOUT</button>
            </div>
        </div>

        <div id="owner-report" class="px-6 mb-6 hidden no-print">
            <div class="bg-white p-5 rounded-3xl shadow-sm border border-gray-100">
                <h3 class="text-xs font-bold text-gray-800 uppercase mb-4 text-center border-b pb-2 italic">Filter Laporan Cetak</h3>
                <div class="grid grid-cols-2 gap-3 mb-4">
                    <div>
                        <label class="text-[9px] font-bold text-gray-400 block ml-1 uppercase">Dari Tanggal</label>
                        <input type="date" id="filter-start" class="w-full p-2 bg-gray-50 border rounded-lg text-xs outline-none focus:border-red-500">
                    </div>
                    <div>
                        <label class="text-[9px] font-bold text-gray-400 block ml-1 uppercase">Sampai Tanggal</label>
                        <input type="date" id="filter-end" class="w-full p-2 bg-gray-50 border rounded-lg text-xs outline-none focus:border-red-500">
                    </div>
                </div>
                <div class="grid grid-cols-2 gap-2">
                    <button onclick="applyFilter()" class="achi-red text-white py-3 rounded-xl text-[10px] font-bold uppercase tracking-widest shadow-md">Terapkan Filter</button>
                    <button onclick="window.print()" class="bg-gray-800 text-white py-3 rounded-xl text-[10px] font-bold uppercase tracking-widest shadow-md">
                        <i class="fas fa-file-pdf mr-1"></i> Cetak PDF
                    </button>
                </div>
            </div>
        </div>

        <div class="px-6 grid grid-cols-2 gap-4 mb-6 no-print">
            <button onclick="openModal()" class="bg-white p-5 rounded-3xl shadow-md border-b-4 border-gray-800 flex flex-col items-center">
                <i class="fas fa-plus-circle text-2xl text-achi-red mb-1"></i>
                <span class="text-[10px] font-bold uppercase">Input Data</span>
            </button>
            <button onclick="exportExcel()" class="bg-white p-5 rounded-3xl shadow-md border-b-4 border-green-700 flex flex-col items-center">
                <i class="fas fa-file-excel text-2xl text-green-700 mb-1"></i>
                <span class="text-[10px] font-bold uppercase">Excel</span>
            </button>
        </div>

        <div id="print-area" class="px-6">
            <div class="print-only text-center mb-8 border-b-2 border-black pb-4">
                <h1 class="text-2xl font-black text-red-600 italic">ACHI - LAPORAN PENGELUARAN</h1>
                <p class="text-xs font-bold uppercase tracking-widest">Aplikasi Crewing & Handling Integrasi</p>
                <p id="print-period" class="text-[10px] mt-2 italic font-bold text-gray-600"></p>
            </div>

            <div id="list" class="space-y-4">
                </div>
            
            <div id="table-print" class="print-only"></div>

            <div class="print-only mt-12 grid grid-cols-2 gap-4 text-center">
                <div>
                    <p class="text-[10px] font-bold uppercase mb-16 italic">Disetujui Oleh,</p>
                    <p class="text-[10px] font-bold border-t border-black pt-1 inline-block px-8">Owner / PT. ACHI</p>
                </div>
                <div>
                    <p class="text-[10px] font-bold uppercase mb-16 italic">Dibuat Oleh,</p>
                    <p id="print-admin-name" class="text-[10px] font-bold border-t border-black pt-1 inline-block px-8">Admin Operasional</p>
                </div>
            </div>
        </div>
    </div>

    <div id="modal" class="fixed inset-0 bg-black/70 hidden items-end z-50 no-print">
        <div class="bg-white w-full rounded-t-[40px] p-8 max-w-md shadow-2xl animate-slide-up">
            <h3 class="font-bold text-achi-red mb-6 italic uppercase border-b pb-2">Input Transaksi Baru</h3>
            <div class="space-y-4">
                <select id="f-kapal" class="w-full p-4 bg-gray-50 border rounded-2xl text-sm font-bold outline-none appearance-none">
                    <option>KM. Nabawi 09</option><option>KM. Lastika Star</option>
                    <option>KM. Srikandi 01</option><option>Rakit 01</option>
                </select>
                <input id="f-ket" type="text" placeholder="Keterangan (Contoh: Solar 200L)" class="w-full p-4 bg-gray-50 border rounded-2xl text-sm outline-none">
                <input id="f-jumlah" type="number" placeholder="Nominal Rp" class="w-full p-4 bg-gray-50 border rounded-2xl text-sm font-bold text-achi-red outline-none">
                <div class="p-4 bg-gray-50 rounded-2xl border-2 border-dashed border-gray-300">
                    <input id="f-file" type="file" accept="image/*" class="text-[10px] w-full mb-3">
                    <textarea id="f-alasan" placeholder="Alasan jika tanpa nota..." class="w-full p-3 text-xs border rounded-xl h-16 outline-none"></textarea>
                </div>
                <button onclick="kirim()" id="btn-kirim" class="w-full achi-red text-white p-5 rounded-2xl font-bold uppercase shadow-xl active:scale-95 transition">Simpan Laporan</button>
                <button onclick="closeModal()" class="w-full text-gray-400 text-[10px] py-2 font-bold uppercase tracking-widest mt-2">Batal</button>
            </div>
        </div>
    </div>

    <script>
        const API = "https://script.google.com/macros/s/AKfycbyHdv7bTACKVAHccutE8iDdk888pUycCT9XHINLdvdG_5EpPWCtd0GjZ1duSZlthZeR/exec"; 
        let currentUser = JSON.parse(localStorage.getItem('achi_session'));
        let allData = [];

        window.onload = () => { if(currentUser) showApp(currentUser); };

        async function login() {
            const user = document.getElementById('u-name').value;
            const pass = document.getElementById('u-pass').value;
            if(!user || !pass) return alert("Isi Username & Password!");
            const btn = document.getElementById('btn-login');
            btn.innerText = "VERIFYING...";
            const r = await fetch(`${API}?action=login&username=${user}&password=${pass}`);
            const d = await r.json();
            if(d.status == 'success') {
                localStorage.setItem('achi_session', JSON.stringify(d));
                showApp(d);
            } else { alert("Akses Ditolak!"); btn.innerText = "MASUK"; }
        }

        function showApp(data) {
            document.getElementById('login-page').style.display = 'none';
            document.getElementById('app').classList.remove('hidden');
            document.getElementById('user-display').innerText = data.nama;
            document.getElementById('print-admin-name').innerText = data.nama;
            if(data.level >= 2) {
                document.getElementById('owner-report').classList.remove('hidden');
                loadData();
            }
        }

        function logout() { localStorage.removeItem('achi_session'); location.reload(); }
        function openModal() { document.getElementById('modal').style.display = 'flex'; }
        function closeModal() { document.getElementById('modal').style.display = 'none'; }

        async function loadData() {
            const r = await fetch(`${API}?action=getTransaksi`);
            allData = await r.json();
            renderList(allData);
        }

        function renderList(data) {
            const listContainer = document.getElementById('list');
            const tablePrint = document.getElementById('table-print');
            
            // Render UI Card (Untuk HP)
            listContainer.innerHTML = data.map(i => `
                <div class="bg-white p-5 rounded-3xl shadow-sm border-l-8 ${i.Bukti_Foto == 'Tanpa Bukti' ? 'border-red-600' : 'border-gray-800'} no-print">
                    <div class="flex justify-between text-[10px] text-gray-400 mb-1 font-bold">
                        <span>${i.Kapal}</span><span>${new Date(i.Tanggal).toLocaleDateString('id-ID')}</span>
                    </div>
                    <div class="flex justify-between items-center">
                        <p class="text-sm font-bold uppercase text-gray-700 tracking-tight">${i.Keterangan}</p>
                        <p class="text-sm font-black text-red-600">Rp${Number(i.Jumlah).toLocaleString()}</p>
                    </div>
                </div>
            `).join('');

            // Render Tabel Cetak (Hanya Muncul Saat Print PDF)
            let tableHTML = `<table><thead><tr><th>Tgl</th><th>Kapal</th><th>Keterangan</th><th>Nominal</th><th>Bukti</th></tr></thead><tbody>`;
            let total = 0;
            data.forEach(i => {
                total += Number(i.Jumlah);
                tableHTML += `<tr>
                    <td>${new Date(i.Tanggal).toLocaleDateString('id-ID')}</td>
                    <td>${i.Kapal}</td>
                    <td>${i.Keterangan}</td>
                    <td>Rp${Number(i.Jumlah).toLocaleString()}</td>
                    <td>${i.Bukti_Foto == 'Tanpa Bukti' ? 'Alasan: '+i.Alasan_Tanpa_Bukti : 'Ada Nota'}</td>
                </tr>`;
            });
            tableHTML += `<tr><td colspan="3" style="text-align:right; font-weight:bold">TOTAL PENGELUARAN</td><td colspan="2" style="font-weight:bold; color:red">Rp${total.toLocaleString()}</td></tr></tbody></table>`;
            tablePrint.innerHTML = tableHTML;
        }

        function applyFilter() {
            const start = document.getElementById('filter-start').value;
            const end = document.getElementById('filter-end').value;
            if(!start || !end) return alert("Pilih Rentang Tanggal!");

            const filtered = allData.filter(i => {
                const d = new Date(i.Tanggal);
                return d >= new Date(start) && d <= new Date(end);
            });
            
            document.getElementById('print-period').innerText = `Periode Laporan: ${new Date(start).toLocaleDateString()} s/d ${new Date(end).toLocaleDateString()}`;
            renderList(filtered);
            alert(`Filter Berhasil! ${filtered.length} data ditemukan.`);
        }

        async function kirim() {
            const btn = document.getElementById('btn-kirim');
            btn.innerText = "MENGIRIM..."; btn.disabled = true;
            const file = document.getElementById('f-file').files[0];
            let img = null;
            if(file) {
                const reader = new FileReader();
                img = await new Promise(res => {
                    reader.onload = () => res(reader.result.split(',')[1]);
                    reader.readAsDataURL(file);
                });
            }
            const payload = {
                kapal: document.getElementById('f-kapal').value,
                keterangan: document.getElementById('f-ket').value,
                jumlah: document.getElementById('f-jumlah').value,
                alasan: document.getElementById('f-alasan').value,
                user: currentUser.nama, image: img, mimeType: file ? file.type : null
            };
            await fetch(API, { method: 'POST', body: JSON.stringify(payload) });
            alert("Berhasil Disimpan!"); location.reload();
        }

        function exportExcel() {
            const ws = XLSX.utils.json_to_sheet(allData);
            const wb = XLSX.utils.book_new();
            XLSX.utils.book_append_sheet(wb, ws, "Laporan_ACHI");
            XLSX.writeFile(wb, `REKAP_ACHI_${new Date().toLocaleDateString()}.xlsx`);
        }
    </script>
</body>
</html>
