<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ACHI SYSTEM - Mobile Menu</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root { --achi-red: #e21e26; }
        body { background-color: #003366; font-family: 'Inter', sans-serif; -webkit-tap-highlight-color: transparent; color: white; }
        
        /* Background Gradient seperti BCA tapi Merah */
        .bg-main { background: linear-gradient(180deg, #8b0000 0%, #e21e26 50%, #f3f4f6 50%, #f3f4f6 100%); min-height: 100vh; }
        
        /* Gaya Kartu Menu Ala BCA */
        .grid-menu { display: grid; grid-template-cols: repeat(3, 1fr); gap: 15px; padding: 20px; }
        .menu-item { display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; }
        
        .icon-circle { 
            width: 75px; height: 75px; 
            background: linear-gradient(135deg, #0088cc 0%, #0055aa 100%); 
            border-radius: 22px; 
            display: flex; align-items: center; justify-content: center; 
            box-shadow: 0 8px 15px rgba(0,0,0,0.2);
            margin-bottom: 8px;
            transition: transform 0.1s;
            border: 2px solid rgba(255,255,255,0.2);
        }
        
        .menu-item:active .icon-circle { transform: scale(0.9); brightness: 1.1; }
        
        .icon-circle i { font-size: 32px; color: white; }
        .menu-label { font-size: 10px; font-weight: 800; color: #333; text-transform: uppercase; letter-spacing: -0.2px; }

        /* Notification Toast */
        #toast { visibility: hidden; min-width: 200px; background-color: #333; color: #fff; text-align: center; border-radius: 50px; padding: 12px; position: fixed; z-index: 500; left: 50%; bottom: 100px; transform: translateX(-50%); font-size: 11px; font-weight: bold; }
        #toast.show { visibility: visible; animation: fadein 0.5s, fadeout 0.5s 2.5s; }
        
        @keyframes fadein { from { opacity: 0; } to { opacity: 1; } }
        @keyframes fadeout { from { opacity: 1; } to { opacity: 0; } }

        .view-section { display: none; }
        .view-section.active { display: block; }
    </style>
</head>
<body>

    <div id="toast">Notifikasi</div>

    <div id="login-page" class="fixed inset-0 bg-[#e21e26] z-[200] flex flex-col items-center justify-center p-8">
        <div class="bg-white p-5 rounded-[2rem] mb-6 shadow-2xl"><i class="fas fa-ship text-5xl text-[#e21e26]"></i></div>
        <h1 class="text-white font-black text-3xl italic mb-1">ACHI MOBILE</h1>
        <p class="text-[10px] font-bold tracking-[0.5em] text-white/60 mb-12">PT. EFENDY JAYA ABADI</p>
        <div class="w-full max-w-xs space-y-4">
            <input id="u-name" type="text" placeholder="USER ID" class="w-full p-4 rounded-2xl bg-white/10 text-white placeholder-white/40 border-2 border-white/20 outline-none text-center font-bold">
            <input id="u-pass" type="password" placeholder="KODE AKSES" class="w-full p-4 rounded-2xl bg-white/10 text-white placeholder-white/40 border-2 border-white/20 outline-none text-center font-bold">
            <button onclick="login()" class="w-full bg-white text-[#e21e26] p-4 rounded-2xl font-black shadow-xl active:scale-95 transition-all">MASUK</button>
        </div>
    </div>

    <div id="app" class="hidden bg-main">
        
        <div class="p-6 pt-10 flex justify-between items-start text-white">
            <div>
                <p class="text-[10px] font-bold opacity-70">Selamat datang,</p>
                <h2 id="disp-name" class="font-black text-xl tracking-tight leading-none uppercase">-</h2>
                <div id="disp-role" class="inline-block mt-2 px-3 py-1 bg-black/20 rounded-full text-[9px] font-bold border border-white/10"></div>
            </div>
            <button onclick="logout()" class="w-10 h-10 rounded-xl bg-white/10 border border-white/20 flex items-center justify-center shadow-lg"><i class="fas fa-sign-out-alt"></i></button>
        </div>

        <div id="view-home" class="view-section active mt-4">
            <div class="grid-menu" id="menu-container">
                </div>
        </div>

        <div id="view-form" class="view-section px-6 pb-20">
            <div class="bg-white rounded-[2.5rem] p-8 shadow-2xl text-gray-800">
                <div class="flex justify-between items-center mb-6">
                    <h3 id="form-title" class="font-black text-xl italic text-[#e21e26]">PENGAJUAN</h3>
                    <button onclick="showView('home')" class="text-gray-300 text-2xl"><i class="fas fa-times-circle"></i></button>
                </div>
                <div class="space-y-4">
                    <select id="f-cat" class="w-full p-4 bg-gray-100 rounded-2xl text-sm font-black outline-none border-none"></select>
                    <input id="f-ket" type="text" placeholder="Nama Barang" class="w-full p-4 bg-gray-50 rounded-2xl text-sm font-bold border outline-none">
                    <input id="f-qty" type="text" placeholder="Jumlah & Satuan" class="w-full p-4 bg-gray-50 rounded-2xl text-sm font-black border outline-none">
                    <input id="f-alasan" type="text" placeholder="Untuk Keperluan" class="w-full p-4 bg-gray-50 rounded-2xl text-sm font-bold border outline-none">
                    <div class="pt-4 space-y-3">
                        <button onclick="sendData()" id="btn-send" class="w-full bg-[#e21e26] text-white p-5 rounded-2xl font-black uppercase shadow-lg active:scale-95">Kirim & Tambah Lagi</button>
                        <button onclick="showView('home')" class="w-full bg-gray-800 text-white p-4 rounded-2xl font-black text-[11px] uppercase active:scale-95">Selesai</button>
                    </div>
                </div>
            </div>
        </div>

        <div id="view-list" class="view-section px-4 pb-20">
            <div class="flex items-center justify-between p-4 mb-2">
                <button onclick="showView('home')" class="text-gray-800 font-black text-xs uppercase"><i class="fas fa-chevron-left mr-2"></i> Kembali</button>
                <button onclick="loadData()" class="text-[#e21e26] font-black text-xs uppercase"><i class="fas fa-sync-alt"></i></button>
            </div>
            <div id="main-list" class="space-y-4"></div>
        </div>
    </div>

    <div id="modal-reject" class="fixed inset-0 bg-black/90 hidden items-center justify-center z-[400] p-8">...</div>
    <div id="modal-harga" class="fixed inset-0 bg-black/80 hidden items-end z-[300] p-4 backdrop-blur-sm">...</div>

    <script>
        const API = "https://script.google.com/macros/s/AKfycbxX89a-Lh-Y0Y10uU6mCxQxSgz-BmIrpOLdYv6B29F66kajAkARYHUxKq0tugdMpc2L/exec";
        let user = JSON.parse(localStorage.getItem('achi_user')) || null;
        let currentType = "";

        window.onload = () => { if(user) startApp(); };

        function showMsg(t) {
            const toast = document.getElementById("toast");
            toast.innerText = t; toast.className = "show";
            setTimeout(() => { toast.className = ""; }, 3000);
        }

        async function login() {
            const u = document.getElementById('u-name').value;
            const p = document.getElementById('u-pass').value;
            if(!u || !p) return showMsg("User & Kode Akses Wajib!");
            const res = await fetch(`${API}?action=login&username=${u}&password=${p}`);
            const d = await res.json();
            if(d.status === 'success') {
                user = d; localStorage.setItem('achi_user', JSON.stringify(d)); startApp();
            } else showMsg("Akses Ditolak!");
        }

        function startApp() {
            document.getElementById('login-page').style.display = 'none';
            document.getElementById('app').classList.remove('hidden');
            document.getElementById('disp-name').innerText = user.nama;
            document.getElementById('disp-role').innerText = user.jabatan;
            renderMenu();
        }

        function renderMenu() {
            const container = document.getElementById('menu-container');
            let menus = [];

            // LEVEL 1 & 2 (Owner & Accounting)
            if([1, 2].includes(user.level)) {
                menus.push({ id: 'pp', label: 'm-PP', icon: 'fa-shopping-bag', color: 'from-orange-500 to-orange-700' });
            }

            // LEVEL 1, 2, 4, 5 (Pengaju Anfrakan)
            if([1, 2, 4, 5].includes(user.level)) {
                menus.push({ id: 'anfrak', label: 'm-Anfrakan', icon: 'fa-file-invoice', color: 'from-blue-500 to-blue-700' });
            }

            // SEMUA BISA MONITORING (Label beda sesuai level)
            let mLabel = [1, 2, 3].includes(user.level) ? "m-Admin" : "m-Status";
            menus.push({ id: 'list', label: mLabel, icon: 'fa-tasks', color: 'from-green-600 to-green-800' });
            
            // MENU TAMBAHAN ALA BCA
            menus.push({ id: 'kapal', label: 'm-Kapal', icon: 'fa-ship', color: 'from-gray-700 to-gray-900' });
            menus.push({ id: 'info', label: 'Info BCA', icon: 'fa-info-circle', color: 'from-cyan-500 to-cyan-700' });
            menus.push({ id: 'admin', label: 'Ganti Kode', icon: 'fa-user-cog', color: 'from-red-700 to-red-900' });

            container.innerHTML = menus.map(m => `
                <div onclick="handleMenuClick('${m.id}')" class="menu-item">
                    <div class="icon-circle bg-gradient-to-br ${m.color}">
                        <i class="fas ${m.icon}"></i>
                    </div>
                    <span class="menu-label">${m.label}</span>
                </div>
            `).join('');
        }

        function handleMenuClick(id) {
            if(id === 'list') showView('list');
            else if(id === 'pp') openInputForm('Permintaan Pembelian');
            else if(id === 'anfrak') openInputForm('Anfrakan');
            else showMsg("Fitur " + id.toUpperCase() + " segera aktif");
        }

        function showView(view) {
            document.querySelectorAll('.view-section').forEach(s => s.classList.remove('active'));
            document.getElementById('view-' + view).classList.add('active');
            if(view === 'list') loadData();
        }

        function openInputForm(type) {
            currentType = type;
            document.getElementById('form-title').innerText = type === 'Anfrakan' ? "m-ANFRAKAN" : "m-PP";
            const selCat = document.getElementById('f-cat');
            if (type === 'Anfrakan') {
                if (user.level === 5) selCat.innerHTML = '<option>Anfrakan Kamar Mesin</option>';
                else if (user.level === 4) selCat.innerHTML = '<option>Anfrakan Kapal</option><option>Anfrakan Harian</option><option>Anfrakan Lainnya</option>';
                else selCat.innerHTML = '<option>Anfrakan Kapal</option><option>Anfrakan Kamar Mesin</option><option>Anfrakan Harian</option>';
            } else {
                selCat.innerHTML = '<option>PP Kantor</option><option>PP Sparepart</option><option>PP Operasional</option>';
            }
            showView('form');
        }

        async function sendData() {
            const ket = document.getElementById('f-ket').value;
            const qty = document.getElementById('f-qty').value;
            if(!ket || !qty) return showMsg("Isian belum lengkap!");

            const btn = document.getElementById('btn-send');
            btn.disabled = true; btn.innerText = "PROSES...";

            const payload = { action: 'input', tipe: currentType, kategori: document.getElementById('f-cat').value, keterangan: ket, alasan: document.getElementById('f-alasan').value, qty: qty, pemohon: user.nama, kapal: user.kapal || "KANTOR" };
            
            await fetch(API, { method: 'POST', body: JSON.stringify(payload) });
            showMsg("Transaksi Berhasil!");
            
            // RESET FORM UNTUK LANJUT INPUT
            document.getElementById('f-ket').value = "";
            document.getElementById('f-qty').value = "";
            document.getElementById('f-alasan').value = "";
            btn.disabled = false; btn.innerText = "Kirim & Tambah Lagi";
            document.getElementById('f-ket').focus();
        }

        function logout() { localStorage.clear(); location.reload(); }
        // ... (Fungsi loadData, renderCard, dll tetap sama dengan versi sebelumnya)
    </script>
</body>
</html>
