<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ACHI SYSTEM - Alur Berjenjang</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root { --achi-red: #e21e26; }
        body { background-color: #f8fafc; font-family: 'Inter', sans-serif; -webkit-tap-highlight-color: transparent; }
        .bg-achi { background: linear-gradient(180deg, #8b0000 0%, #e21e26 100%); }
        .menu-card { background: white; border-radius: 1.5rem; padding: 1.2rem; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05); border: 1px solid #f1f5f9; height: 100%; }
        .menu-card:active { transform: scale(0.95); }
        .icon-box { width: 48px; height: 48px; border-radius: 1rem; display: flex; align-items: center; justify-content: center; color: white; margin-bottom: 8px; font-size: 1.1rem; }
        #toast { visibility: hidden; min-width: 250px; background-color: #1e293b; color: #fff; text-align: center; border-radius: 12px; padding: 14px; position: fixed; z-index: 500; left: 50%; bottom: 30px; transform: translateX(-50%); font-size: 11px; font-weight: 800; text-transform: uppercase; box-shadow: 0 10px 25px rgba(0,0,0,0.2); }
        #toast.show { visibility: visible; animation: fadein 0.5s, fadeout 0.5s 2.5s; }
        @keyframes fadein { from { bottom: 0; opacity: 0; } to { bottom: 30px; opacity: 1; } }
        @keyframes fadeout { from { bottom: 30px; opacity: 1; } to { bottom: 0; opacity: 0; } }
        .view-section { display: none; }
        .view-section.active { display: block; animation: fadeIn 0.3s ease-in; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        .status-badge { font-size: 7px; font-weight: 900; padding: 3px 8px; border-radius: 99px; text-transform: uppercase; }
    </style>
</head>
<body class="pb-10">

    <div id="toast">Notifikasi</div>

    <div id="login-page" class="fixed inset-0 bg-achi z-[200] flex flex-col items-center justify-center p-8">
        <div class="bg-white p-4 rounded-3xl mb-6 shadow-2xl"><i class="fas fa-ship text-4xl text-[#e21e26]"></i></div>
        <h1 class="text-white font-black text-2xl tracking-tighter uppercase italic">Achi System</h1>
        <p class="text-[9px] font-black tracking-[0.4em] uppercase mb-10 text-white/50">Efendy Jaya Abadi</p>
        <div class="w-full max-w-xs space-y-3">
            <input id="u-name" type="text" placeholder="USER ID" class="w-full p-4 rounded-2xl font-bold bg-white/10 text-white placeholder-white/30 border-none outline-none backdrop-blur-md">
            <input id="u-pass" type="password" placeholder="KODE AKSES" class="w-full p-4 rounded-2xl font-bold bg-white/10 text-white placeholder-white/30 border-none outline-none backdrop-blur-md">
            <button onclick="login()" class="w-full bg-white text-[#e21e26] p-4 rounded-2xl font-black uppercase shadow-xl active:scale-95 transition-all">Masuk</button>
        </div>
    </div>

    <div id="app" class="hidden">
        <div class="bg-[#e21e26] p-6 pb-20 text-white flex justify-between items-center">
            <div>
                <h2 id="disp-name" class="font-black text-sm uppercase">-</h2>
                <p id="disp-role" class="text-[9px] font-bold text-yellow-300 uppercase tracking-widest italic"></p>
            </div>
            <button onclick="logout()" class="w-9 h-9 rounded-full bg-white/10 flex items-center justify-center"><i class="fas fa-power-off"></i></button>
        </div>

        <div class="px-6 -mt-10">
            <div id="view-home" class="view-section active">
                <div class="grid grid-cols-2 gap-4" id="menu-container"></div>
            </div>

            <div id="view-list" class="view-section">
                <div class="flex items-center justify-between mb-4">
                    <button onclick="showView('home')" class="text-[#e21e26] font-bold text-[10px] uppercase"><i class="fas fa-chevron-left mr-1"></i> Kembali</button>
                    <button onclick="loadData()" class="text-gray-400 font-bold text-[10px] uppercase"><i class="fas fa-sync"></i> Refresh</button>
                </div>
                <div id="main-list" class="space-y-4 pb-20"></div>
            </div>
        </div>
    </div>

    <div id="modal-form" class="fixed inset-0 bg-black/80 hidden items-end z-[300] p-4 backdrop-blur-sm">
        <div class="bg-white w-full rounded-t-[2.5rem] p-8">
            <h3 id="form-title" class="font-black text-[#e21e26] uppercase mb-6 italic">Pengajuan</h3>
            <div class="space-y-3">
                <select id="f-cat" class="w-full p-4 bg-gray-100 rounded-xl text-xs font-black outline-none border-none"></select>
                <input id="f-ket" type="text" placeholder="Nama Barang" class="w-full p-4 bg-gray-50 rounded-xl text-xs font-bold outline-none border">
                <input id="f-qty" type="text" placeholder="Jumlah (contoh: 2 Set)" class="w-full p-4 bg-gray-50 rounded-xl text-xs font-black outline-none border">
                <input id="f-alasan" type="text" placeholder="Keperluan" class="w-full p-4 bg-gray-50 rounded-xl text-xs font-bold outline-none border">
                <button onclick="sendData()" id="btn-send" class="w-full bg-[#e21e26] text-white p-4 rounded-xl font-black uppercase shadow-lg mt-2">Kirim Pengajuan</button>
                <button onclick="closeModal()" class="w-full text-gray-400 py-2 text-[10px] font-black uppercase">Batal</button>
            </div>
        </div>
    </div>

    <div id="modal-reject" class="fixed inset-0 bg-black/90 hidden items-center justify-center z-[400] p-8">
        <div class="bg-white w-full max-w-sm rounded-[2rem] p-8">
            <h3 class="font-black text-gray-800 uppercase text-center mb-4">Tolak Pengajuan?</h3>
            <textarea id="f-alasan-reject" class="w-full p-4 bg-gray-50 rounded-xl text-xs h-24 mb-4 border" placeholder="Alasan penolakan..."></textarea>
            <div class="grid grid-cols-2 gap-3">
                <button onclick="closeModal()" class="py-3 text-[10px] font-black text-gray-400 uppercase">Batal</button>
                <button onclick="submitReject()" class="bg-red-600 text-white py-3 rounded-xl font-black text-[10px] uppercase">Reject</button>
            </div>
        </div>
    </div>

    <div id="modal-harga" class="fixed inset-0 bg-black/80 hidden items-end z-[300] p-4 backdrop-blur-sm">
        <div class="bg-white w-full rounded-t-[2.5rem] p-8">
            <h3 class="font-black text-green-600 uppercase mb-4 italic">Realisasi Belanja</h3>
            <p id="h-item" class="text-[10px] font-bold text-gray-400 uppercase mb-6"></p>
            <div class="space-y-4">
                <input id="f-harga" type="number" placeholder="Rp Total Nominal" class="w-full p-5 rounded-2xl font-black text-xl bg-yellow-50 border shadow-inner outline-none">
                <div class="space-y-3">
                    <input type="file" id="f-image" accept="image/*" class="hidden" onchange="previewImg(this)">
                    <button id="btn-foto" onclick="document.getElementById('f-image').click()" class="w-full bg-gray-100 py-4 rounded-xl text-[10px] font-black uppercase"><i class="fas fa-camera mr-2"></i> Foto Nota</button>
                    <img id="img-preview" class="hidden w-full h-40 object-cover rounded-xl border">
                    <div id="area-alasan-nota" class="hidden">
                        <input id="f-alasan-tanpa-nota" type="text" placeholder="Kenapa tidak ada nota?" class="w-full p-4 bg-red-50 text-red-600 rounded-xl text-xs font-bold border border-red-100">
                    </div>
                    <p id="msg-nota" onclick="toggleNoNota()" class="text-[9px] text-red-500 font-black text-center underline cursor-pointer uppercase">Tidak ada nota?</p>
                </div>
                <button onclick="submitHarga()" id="btn-submit-harga" class="w-full bg-green-600 text-white p-5 rounded-2xl font-black uppercase shadow-xl mt-2">Selesaikan & Simpan</button>
            </div>
        </div>
    </div>

    <script>
        const API = "https://script.google.com/macros/s/AKfycbxX89a-Lh-Y0Y10uU6mCxQxSgz-BmIrpOLdYv6B29F66kajAkARYHUxKq0tugdMpc2L/exec"; // <--- ISI URL API 
        let user = JSON.parse(localStorage.getItem('achi_user')) || null;
        let activeId = null;
        let base64Image = "";
        let currentType = "";
        let isNoNota = false;

        window.onload = () => { if(user) startApp(); };

        function showMsg(t, c = "#1e293b") {
            const toast = document.getElementById("toast");
            toast.innerText = t; toast.style.backgroundColor = c;
            toast.className = "show"; setTimeout(() => { toast.className = ""; }, 3000);
        }

        async function login() {
            const u = document.getElementById('u-name').value;
            const p = document.getElementById('u-pass').value;
            if(!u || !p) return showMsg("Isi User & Kode!", "#e21e26");
            const res = await fetch(`${API}?action=login&username=${u}&password=${p}`);
            const d = await res.json();
            if(d.status === 'success') {
                user = d; localStorage.setItem('achi_user', JSON.stringify(d)); startApp();
            } else showMsg("Akses Ditolak!", "#e21e26");
        }

        function startApp() {
            document.getElementById('login-page').style.display = 'none';
            document.getElementById('app').classList.remove('hidden');
            document.getElementById('disp-name').innerText = user.nama;
            document.getElementById('disp-role').innerText = user.jabatan + (user.kapal ? " • "+user.kapal : "");
            renderMenu();
        }

        function renderMenu() {
            const container = document.getElementById('menu-container');
            let menus = [];
            if([1, 2].includes(user.level)) menus.push({ id: 'pp', label: 'BUAT PP', icon: 'fa-cart-plus', color: 'bg-orange-600' });
            if([1, 2, 4, 5].includes(user.level)) menus.push({ id: 'anfrak', label: 'BUAT ANFRAKAN', icon: 'fa-file-invoice', color: 'bg-blue-600' });
            
            let listLabel = [1, 2, 3].includes(user.level) ? "VERIFIKASI & BELANJA" : "STATUS PENGAJUAN";
            menus.push({ id: 'list', label: listLabel, icon: 'fa-tasks', color: 'bg-green-600' });
            menus.push({ id: 'logout', label: 'KELUAR', icon: 'fa-sign-out-alt', color: 'bg-gray-400' });

            container.innerHTML = menus.map(m => `
                <div onclick="handleMenuClick('${m.id}')" class="menu-card">
                    <div class="icon-box ${m.color} shadow-lg shadow-gray-100"><i class="fas ${m.icon}"></i></div>
                    <span class="text-[9px] font-black text-gray-800 uppercase">${m.label}</span>
                </div>
            `).join('');
        }

        function handleMenuClick(id) {
            if(id === 'list') showView('list');
            else if(id === 'logout') logout();
            else openForm(id === 'pp' ? 'Permintaan Pembelian' : 'Anfrakan');
        }

        function showView(view) {
            document.querySelectorAll('.view-section').forEach(s => s.classList.remove('active'));
            document.getElementById('view-' + view).classList.add('active');
            if(view === 'list') loadData();
        }

        function openForm(type) {
            currentType = type;
            document.getElementById('form-title').innerText = type.toUpperCase();
            const selCat = document.getElementById('f-cat');
            if (type === 'Anfrakan') {
                if (user.level === 5) selCat.innerHTML = '<option>Anfrakan Kamar Mesin</option>';
                else if (user.level === 4) selCat.innerHTML = '<option>Anfrakan Kapal</option><option>Anfrakan Harian</option><option>Anfrakan Lainnya</option>';
                else selCat.innerHTML = '<option>Anfrakan Kapal</option><option>Anfrakan Kamar Mesin</option><option>Anfrakan Harian</option>';
            } else {
                selCat.innerHTML = '<option>PP Kantor</option><option>PP Operasional</option><option>PP Sparepart</option>';
            }
            document.getElementById('modal-form').style.display = 'flex';
        }

        async function sendData() {
            const btn = document.getElementById('btn-send');
            btn.disabled = true; btn.innerText = "MENGIRIM...";
            const payload = { action: 'input', tipe: currentType, kategori: document.getElementById('f-cat').value, keterangan: document.getElementById('f-ket').value, alasan: document.getElementById('f-alasan').value, qty: document.getElementById('f-qty').value, pemohon: user.nama, kapal: user.kapal || "KANTOR" };
            await fetch(API, { method: 'POST', body: JSON.stringify(payload) });
            showMsg("Pengajuan Terkirim", "#059669");
            setTimeout(() => location.reload(), 1000);
        }

        async function loadData() {
            const cont = document.getElementById('main-list');
            cont.innerHTML = `<div class="p-10 text-center text-gray-400 font-black text-[10px] uppercase italic animate-pulse">Sinkronisasi Data...</div>`;
            const res = await fetch(`${API}?action=getData`);
            const data = await res.json();
            renderList(data.transaksi);
        }

        function renderList(data) {
            const cont = document.getElementById('main-list');
            const active = data.filter(i => i[9] !== 'SELESAI' && i[9] !== 'REJECTED');
            const history = data.filter(i => i[9] === 'SELESAI' || i[9] === 'REJECTED');

            let html = `<h3 class="text-[9px] font-black text-red-500 mb-4 uppercase tracking-widest italic">Antrean Aktif</h3>`;
            html += active.reverse().map(i => renderCard(i, false)).join('');
            html += `<h3 class="text-[9px] font-black text-gray-400 mt-10 mb-4 uppercase tracking-widest italic">Selesai/Reject</h3>`;
            html += history.reverse().map(i => renderCard(i, true)).join('');
            cont.innerHTML = html;
        }

        function renderCard(i, isHistory) {
            let status = i[9];
            let badge = status === 'MENUNGGU ADMIN' ? 'bg-gray-100 text-gray-500' : 
                        status === 'MENUNGGU PERSETUJUAN OWNER' ? 'bg-orange-100 text-orange-600' :
                        status === 'DISETUJUI OWNER' ? 'bg-blue-100 text-blue-600' : 'bg-green-100 text-green-600';
            
            if(status === 'REJECTED') badge = 'bg-red-100 text-red-600';

            let actionBtn = "";
            if(!isHistory) {
                // 1. Verifikasi (Level 2 & 3)
                if([2, 3].includes(user.level) && status === 'MENUNGGU ADMIN') {
                    actionBtn = `<div class="grid grid-cols-2 gap-2 mt-4"><button onclick="openReject('${i[0]}')" class="bg-gray-100 text-red-600 text-[9px] font-black py-3 rounded-xl uppercase">Reject</button><button onclick="changeStatus('${i[0]}', 'MENUNGGU PERSETUJUAN OWNER')" class="bg-orange-500 text-white text-[9px] font-black py-3 rounded-xl uppercase">Verifikasi</button></div>`;
                }
                // 2. Approval Owner (Level 1)
                else if(user.level === 1 && (status === 'MENUNGGU ADMIN' || status === 'MENUNGGU PERSETUJUAN OWNER')) {
                    actionBtn = `<div class="grid grid-cols-2 gap-2 mt-4"><button onclick="openReject('${i[0]}')" class="bg-gray-100 text-red-600 text-[9px] font-black py-3 rounded-xl uppercase">Reject</button><button onclick="changeStatus('${i[0]}', 'DISETUJUI OWNER')" class="bg-blue-600 text-white text-[9px] font-black py-3 rounded-xl uppercase">Setujui Owner</button></div>`;
                }
                // 3. Eksekusi Belanja (Level 2 & 3) Hanya jika sudah DISETUJUI OWNER
                else if([2, 3].includes(user.level) && status === 'DISETUJUI OWNER') {
                    actionBtn = `<button onclick="openHarga('${i[0]}', '${i[5]}')" class="mt-4 w-full bg-green-600 text-white text-[9px] font-black py-4 rounded-xl uppercase shadow-lg">Input Harga & Nota</button>`;
                }
            }

            return `<div class="bg-white p-6 rounded-[2rem] shadow-sm mb-4 border-l-4 ${isHistory ? 'opacity-50 border-gray-300' : 'border-[#e21e26]'}">
                <div class="flex justify-between mb-4"><span class="${badge} status-badge">${status}</span><span class="text-[8px] font-bold text-gray-300">${i[3] || ''}</span></div>
                <p class="text-[12px] font-black text-gray-800 uppercase leading-tight">${i[5]}</p>
                <p class="text-[9px] text-gray-400 mt-1 font-bold italic">${i[6]} • ${i[4]} • Oleh: ${i[8]}</p>
                ${i[12] ? `<p class="mt-3 p-3 bg-red-50 rounded-xl text-[9px] text-red-600 font-bold border border-red-100">Catatan: ${i[12]}</p>` : ''}
                <div class="mt-4 pt-4 border-t flex justify-between items-center">
                    <span class="text-[12px] font-black text-red-600">${i[7] > 0 ? 'Rp '+Number(i[7]).toLocaleString() : 'BELUM DIBELI'}</span>
                    ${i[11] ? `<a href="${i[11]}" target="_blank" class="text-[9px] bg-blue-50 text-blue-600 px-3 py-1.5 rounded-full font-black uppercase">Nota</a>` : ''}
                </div>
                ${actionBtn}
            </div>`;
        }

        async function changeStatus(id, s) {
            showMsg("Memperbarui...");
            await fetch(API, { method: 'POST', body: JSON.stringify({ action: 'changeStatus', id: id, statusBaru: s }) });
            loadData();
        }

        function openReject(id) { activeId = id; document.getElementById('modal-reject').style.display = 'flex'; }
        async function submitReject() {
            const al = document.getElementById('f-alasan-reject').value;
            if(!al) return showMsg("Alasan Wajib!");
            await fetch(API, { method: 'POST', body: JSON.stringify({ action: 'changeStatus', id: activeId, statusBaru: 'REJECTED', alasan: al }) });
            closeModal(); loadData();
        }

        function openHarga(id, item) { activeId = id; document.getElementById('h-item').innerText = item; document.getElementById('modal-harga').style.display = 'flex'; }
        function toggleNoNota() { 
            isNoNota = !isNoNota; 
            document.getElementById('area-alasan-nota').classList.toggle('hidden'); 
            document.getElementById('btn-foto').classList.toggle('opacity-30');
        }
        function previewImg(i) { let r = new FileReader(); r.onload = (e) => { document.getElementById('img-preview').src = e.target.result; document.getElementById('img-preview').classList.remove('hidden'); base64Image = e.target.result; }; r.readAsDataURL(i.files[0]); }
        
        async function submitHarga() {
            const h = document.getElementById('f-harga').value;
            const al = document.getElementById('f-alasan-tanpa-nota').value;
            if(!h || (!base64Image && !isNoNota)) return showMsg("Lengkapi Data!");
            showMsg("Menyimpan...");
            await fetch(API, { method: 'POST', body: JSON.stringify({ action: 'updateHarga', id: activeId, harga: h, image: base64Image, alasanTanpaNota: al }) });
            location.reload();
        }

        function logout() { localStorage.clear(); location.reload(); }
        function closeModal() { document.querySelectorAll('[id^="modal"]').forEach(m => m.style.display = 'none'); }
    </script>
</body>
</html>
