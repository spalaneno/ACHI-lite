<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ACHI v5.0 - LOGIN</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap');
        
        body {
            font-family: 'Inter', sans-serif;
            margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
            background: linear-gradient(-45deg, #b31d1d, #7a1212, #d32f2f, #9a0007);
            background-size: 400% 400%;
            animation: gradientMove 10s ease infinite;
            overflow: hidden;
        }

        @keyframes gradientMove {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .glass-panel {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 3rem;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        }

        .input-group input {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: white;
            transition: all 0.3s ease;
        }

        .input-group input:focus {
            background: rgba(255, 255, 255, 0.15);
            border-color: rgba(255, 255, 255, 0.5);
            outline: none;
            box-shadow: 0 0 15px rgba(255,255,255,0.1);
        }

        .btn-premium {
            background: white;
            color: #b31d1d;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            font-weight: 900;
        }

        .btn-premium:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(0,0,0,0.2);
        }

        .btn-premium:active {
            transform: translateY(0);
        }

        ::placeholder { color: rgba(255,255,255,0.4); font-size: 0.8rem; letter-spacing: 0.1em; }
    </style>
</head>
<body class="p-6">

    <div class="glass-panel p-10 w-full max-w-sm animate__animated animate__fadeInUp">
        <div class="mb-10 text-center">
            <div class="w-20 h-20 bg-white rounded-3xl mx-auto mb-6 flex items-center justify-center shadow-2xl">
                <i class="fas fa-anchor text-[#b31d1d] text-4xl"></i>
            </div>
            <h1 class="text-3xl font-black italic text-white tracking-tighter uppercase leading-none">ACHI SYSTEM</h1>
            <div class="h-1 w-12 bg-white/30 mx-auto my-3 rounded-full"></div>
            <p class="text-[9px] font-bold text-white/60 tracking-[0.4em] uppercase">PT Efendy Jaya Abadi</p>
        </div>

        <div class="input-group space-y-4">
            <div class="relative">
                <i class="fas fa-user absolute left-4 top-4 text-white/30 text-sm"></i>
                <input type="text" id="u" placeholder="USERNAME" class="w-full pl-12 pr-4 py-4 rounded-2xl font-bold">
            </div>
            <div class="relative">
                <i class="fas fa-lock absolute left-4 top-4 text-white/30 text-sm"></i>
                <input type="password" id="p" placeholder="PASSWORD" class="w-full pl-12 pr-4 py-4 rounded-2xl font-bold">
            </div>
            
            <button onclick="doLogin()" id="btn" class="btn-premium w-full py-4 rounded-2xl shadow-2xl mt-4 uppercase italic tracking-widest text-sm">
                Login Dashboard
            </button>
        </div>

        <p id="msg" class="mt-6 text-[10px] font-black text-white/40 uppercase italic text-center tracking-widest"></p>
        
        <div class="mt-8 pt-8 border-t border-white/10 text-center">
            <p class="text-[8px] text-white/20 font-bold tracking-widest uppercase">&copy; 2026 Achindo Maritime Solution</p>
        </div>
    </div>

<script>
    const API = "https://script.google.com/macros/s/AKfycbybxx3aQDtmyJ2xGsGYdVu3pyt6TpEv4T04IPrIs64T_qwTTlRRY1tVszEfzn5pTu5v/exec";

    async function doLogin() {
        const u = document.getElementById('u').value.trim();
        const p = document.getElementById('p').value.trim();
        const msg = document.getElementById('msg');
        const btn = document.getElementById('btn');

        if(!u || !p) {
            msg.innerText = "Lengkapi data akses!";
            return;
        }

        btn.innerText = "AUTHENTICATING...";
        btn.disabled = true;

        try {
            const r = await fetch(`${API}?action=login&u=${u}&p=${p}`);
            const res = await r.json();
            
            if(res.status === "success") {
                localStorage.setItem('achi_session', JSON.stringify(res.data));
                msg.innerText = "LOGIN BERHASIL...";
                setTimeout(() => { window.location.href = "dashboard.html"; }, 500);
            } else {
                msg.innerText = "AKSES DITOLAK: CEK KEMBALI DATA ANDA";
                btn.innerText = "LOGIN DASHBOARD";
                btn.disabled = false;
            }
        } catch(e) {
            msg.innerText = "SERVER TIDAK MERESPON";
            btn.innerText = "LOGIN DASHBOARD";
            btn.disabled = false;
        }
    }
</script>
</body>
</html>
