<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ACHI - Aplikasi Crewing & Handling Integrasi</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        /* Skema Warna ACHI */
        .achi-red { background-color: #e21e26; }
        .achi-dark { background-color: #1a1a1a; }
        .text-achi-red { color: #e21e26; }
        body { background-color: #f8f9fa; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; -webkit-tap-highlight-color: transparent; }
        .animate-fade-in { animation: fadeIn 0.3s ease-in; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    </style>
</head>
<body class="max-w-md mx-auto min-h-screen bg-gray-50 pb-20">

    <div id="login-page" class="p-10 pt-20 text-center bg-white min-h-screen animate-fade-in">
        <div class="mb-8">
            <img src="logo.png" alt="Logo ACHI" class="w-32 mx-auto mb-4 object-contain">
            <h1 class="text-5xl font-black text-achi-red italic leading-none">ACHI</h1>
            <p class="text-[11px] font-bold text-gray-800 uppercase tracking-tighter mt-2 italic">Aplikasi Crewing & Handling Integrasi</p>
        </div>
        
        <div class="space-y-4">
            <input id="email" type="email" placeholder="Email Terdaftar" class="w-full p-4 rounded-xl border border-gray-300 outline-none focus:border-[#e21e26] transition shadow-sm">
            <button onclick="login()" id="btn-login" class="w-full achi-red text-white p-4 rounded-xl font-bold shadow-lg uppercase tracking-widest hover:bg-red-700 transition">Masuk</button>
            <p class="text-[9px] text-gray-400 mt-10 uppercase tracking-widest">&copy; 2026 PT. ACHI INTEGRASI</p>
        </div>
    </div>

    <div id="app" class="hidden animate-fade-in">
        <div class="achi-red p-6 rounded-b-[40px] text-white shadow-xl mb-8">
            <div class="flex justify-between items-center">
                <div>
                    <p class="text-[10px] opacity-80 uppercase font-bold text-yellow-300 tracking-widest">Sistem Integrasi Armada</p>
                    <h2 id="user-display" class="text-xl font-bold italic">-</h2>
                </div>
                <div class="w-14 h-14 bg-white rounded-full overflow-hidden border-4 border-white/20 shadow-lg">
                    <img src="logo.png" class="w-full h-full object-contain p-1">
                </div>
            </div>
        </div>

        <div class="px-6 grid grid-cols-2 gap-5 mb-8">
            <div onclick="openModal()" class="bg-white p-6 rounded-3xl text-center shadow-md border-b-4 border-gray-800 active:scale-95 transition">
                <i class="fas fa-file-invoice-dollar text-4xl text-achi-red mb-3"></i>
                <p class="text-[11px] font-bold uppercase text-gray-700">Anfrakan</p>
            </div>
            <div id="btn-export" onclick="exportExcel()" class="bg-white p-6 rounded-3xl text-center shadow-md border-b-4 border-green-700 active:scale-95 transition hidden">
                <i class="fas fa-file-excel text-4xl text-green-700 mb-3"></i>
                <p class="text-[11px] font-bold uppercase text-gray-700 tracking-tighter">Export Laporan</p>
            </div>
        </div>

        <div id="history-section" class="px-6 hidden pb-20">
            <div class="flex justify-between items-center mb-4">
                <h3 class="font-bold text-gray-800 text-xs uppercase tracking-widest flex items-center">
                    <span class="w-2 h-5 achi-red mr-2 rounded-full"></span> Transaksi Harian
                </h3>
                <button onclick="loadData()" class="text-[10px] text-achi-red font-bold uppercase italic underline">Refresh</button>
            </div>
            <div id="list" class="space-y-4">
                </div>
        </div>
    </div>

    <div id="modal" class="fixed inset-0 bg-black/70 hidden items-end z-50 transition-all">
        <div class="bg-white w-full rounded-t-[40px] p-8 max-w-md shadow-2xl">
            <div class="w-16 h-1 bg-gray-300 mx-auto mb-6 rounded-full"></div>
            <h3 class="font-bold text-achi-red mb-6 italic uppercase border-b-2 border-gray-100 pb-2 flex items-center">
                <i class="fas fa-edit mr-2"></i> Form Pengeluaran
            </h3>
            
            <div class="space-y-4">
                <div>
                    <label class="text-[10px] font-bold text-gray-400 uppercase ml-1">Pilih Armada</label>
                    <select id="f-kapal" class="w-full p-4 bg-gray-50 border rounded-2xl text-sm font-bold mt-1 outline-none">
                        <option>KM. Nabawi 09</option>
                        <option>KM. Lastika Star</option>
                        <option>KM. Srikandi 01</option>
                        <option>Rakit 01</option>
                    </select>
                </div>

                <input id="f-ket" type="text" placeholder="Keterangan (Solar, Es, Logistik)" class="w-full p-4 bg-gray-50 border rounded-2xl text-sm outline-none">
                
                <input id="f-jumlah" type="number" placeholder="Nominal (Rp)" class="w-full p-4 bg-gray-50 border rounded-2xl text-sm font-bold text-achi-red outline-none">
                
                <div class="p-4 bg-gray-50 rounded-2xl border-2 border-dashed border-gray-200">
                    <label class="text-[10px] font-bold block mb-2 text-gray-500 uppercase italic">Lampiran Nota/Foto Bukti</label>
                    <input id="f-file" type="file" accept="image/*" class="text-[10px] w-full mb-3">
                    <textarea id="f-alasan" placeholder="WAJIB: Mengapa tidak ada bukti? (Contoh: Beli di laut)" class="w-full p-3 text-xs border rounded-xl h-16 outline-none focus:border-red-500"></textarea>
                </div>

                <button onclick="kirim()" id="btn-kirim" class="w-full achi-red text-white p-5 rounded-2xl font-bold uppercase shadow-xl shadow-red-200 active:scale-95 transition">Simpan Data ACHI</button>
                <button onclick="closeModal()" class="w-full text-gray-400 text-[10px] py-2 font-bold uppercase tracking-widest mt-2">Batal</button>
            </div>
        </div>
    </div>

    <script>
        // --- KONFIGURASI API ---
        const API = "https://script.google.com/macros/s/AKfycbza7Fxg5vNcrlfgyCw9j-033OfWVvq8NwaVim5WiiUvK0moQdWYYSONdHoWToI6roAX/exec"; 
        let user = "";

        async function login() {
            const email = document.getElementById('email').value;
            if(!email) return alert("Masukkan Email!");
            
            const btn = document.getElementById('btn-login');
            btn.innerText = "AUTHENTICATING...";
            
            try {
                const r = await fetch(`${API}?action=login&email=${email}`);
                const d = await r.json();
                if(d.status == 'success') {
                    user = d.nama;
                    document.getElementById('login-page').classList.add('hidden');
                    document.getElementById('app').classList.remove('hidden');
                    document.getElementById('user-display').innerText = d.nama;
                    if(d.level >= 2) {
                        document.getElementById('btn-export').classList.remove('hidden');
                        document.getElementById('history-section').classList.remove('hidden');
                        loadData();
                    }
                } else {
                    alert("Akses Ditolak! Email tidak terdaftar dalam sistem ACHI.");
                    btn.innerText = "Masuk";
                }
            } catch(e) { 
                alert("Koneksi gagal. Periksa URL API Anda."); 
                btn.innerText = "Masuk"; 
            }
        }

        function openModal() { document.getElementById('modal').style.display = 'flex'; }
        function closeModal() { document.getElementById('modal').style.display = 'none'; }

        async function kirim() {
            const btn = document.getElementById('btn-kirim');
            const ket = document.getElementById('f-ket').value;
            const jumlah = document.getElementById('f-jumlah').value;

            if(!ket || !jumlah) return alert("Keterangan & Jumlah wajib diisi!");

            btn.innerText = "SENDING TO CLOUD..."; btn.disabled = true;
            
            const file = document.getElementById('f-file').files[0];
            let img = null;
            if(file) {
                const reader = new FileReader();
                img = await new Promise(res => {
                    reader.onload = () => res(reader.result.split(',')[1]);
                    reader.readAsDataURL(file);
                });
            }

            const payload = {
                table: "Transaksi",
                kapal: document.getElementById('f-kapal').value,
                kategori: "Anfrakan",
                keterangan: ket,
                jumlah: jumlah,
                alasan: document.getElementById('f-alasan').value,
                user: user, 
                image: img, 
                mimeType: file ? file.type : null
            };

            try {
                await fetch(API, { method: 'POST', body: JSON.stringify(payload) });
                alert("DATA TERINTEGRASI! Transaksi berhasil disimpan.");
                location.reload();
            } catch(e) {
                alert("Gagal mengirim data.");
                btn.innerText = "Simpan Data ACHI"; btn.disabled = false;
            }
        }

        async function loadData() {
            const listContainer = document.getElementById('list');
            listContainer.innerHTML = '<p class="text-center text-[10px] text-gray-400 italic">Memuat riwayat...</p>';
            
            const r = await fetch(`${API}?action=getTransaksi`);
            const data = await r.json();
            listContainer.innerHTML = data.map(i => `
                <div class="bg-white p-5 rounded-2xl shadow-sm border-l-8 ${i.Bukti_Foto == 'Tanpa Bukti' ? 'border-red-600' : 'border-gray-800'}">
                    <div class="flex justify-between text-[10px] text-gray-400 mb-2 font-bold uppercase tracking-tighter">
                        <span>${i.Kapal}</span><span>${new Date(i.Tanggal).toLocaleDateString('id-ID')}</span>
                    </div>
                    <div class="flex justify-between items-center">
                        <p class="text-sm font-bold uppercase text-gray-800">${i.Keterangan}</p>
                        <p class="text-sm font-black text-red-600">-Rp ${Number(i.Jumlah).toLocaleString()}</p>
                    </div>
                    ${i.Bukti_Foto == 'Tanpa Bukti' ? 
                        `<div class="bg-red-50 p-2 mt-2 rounded-lg border border-red-100 italic"><p class="text-[9px] text-red-600 font-bold leading-tight">⚠️ ALASAN: ${i.Alasan_Tanpa_Bukti}</p></div>` : 
                        `<a href="${i.Bukti_Foto}" target="_blank" class="text-[9px] text-blue-600 font-black mt-3 inline-block underline italic uppercase tracking-widest"><i class="fas fa-camera mr-1"></i> Lihat Bukti Nota</a>`
                    }
                    <div class="mt-2 pt-2 border-t border-gray-50 flex justify-end">
                        <span class="text-[8px] text-gray-300 italic font-bold uppercase">Admin: ${i.Admin}</span>
                    </div>
                </div>
            `).join('');
        }

        async function exportExcel() {
            const r = await fetch(`${API}?action=getTransaksi`);
            const data = await r.json();
            const ws = XLSX.utils.json_to_sheet(data);
            const wb = XLSX.utils.book_new();
            XLSX.utils.book_append_sheet(wb, ws, "Rekap_ACHI");
            XLSX.writeFile(wb, `REKAP_ACHI_${new Date().toLocaleDateString()}.xlsx`);
        }
    </script>
</body>
</html>
