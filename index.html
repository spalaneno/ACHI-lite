<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ACHI v5.0 - LOGIN</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background: #0b0b0b; height: 100vh; display: flex; align-items: center; justify-content: center; margin: 0; font-family: sans-serif; }
        .card { background: #1a1a1a; padding: 2rem; border-radius: 2rem; width: 100%; max-width: 320px; border: 1px solid #333; text-align: center; }
        input { width: 100%; padding: 12px; margin-bottom: 15px; border-radius: 12px; border: 1px solid #444; background: #222; color: white; outline: none; }
        button { width: 100%; padding: 12px; border-radius: 12px; background: #b31d1d; color: white; font-weight: bold; border: none; cursor: pointer; text-transform: uppercase; }
    </style>
</head>
<body>
    <div class="card">
        <h1 class="text-white text-3xl font-black italic mb-1">ACHI</h1>
        <p class="text-red-600 text-[10px] font-bold tracking-widest mb-8 uppercase">Efendy Jaya Abadi</p>
        
        <input type="text" id="user" placeholder="USERNAME">
        <input type="password" id="pass" placeholder="PASSWORD">
        <button onclick="login()">Masuk Sistem</button>
        <p id="msg" class="text-red-500 text-[10px] mt-4 font-bold"></p>
    </div>

<script>
    // URL baru sekelong
    const API = "https://script.google.com/macros/s/AKfycbxM9pv6qDrUI2hWO2IiEHaJntlWoN2X5LbTSOLqaMSJt1tpUwEGY8oX6uf9dtBNxnkz/exec"; 

    async function login() {
        const u = document.getElementById('user').value;
        const p = document.getElementById('pass').value;
        const msg = document.getElementById('msg');
        
        msg.innerText = "MENGECEK AKSES...";
        
        try {
            const r = await fetch(`${API}?action=login&u=${u}&p=${p}`);
            const res = await r.json();
            
            if(res.status === "success") {
                localStorage.setItem('achi_session', JSON.stringify(res.data));
                window.location.href = "dashboard.html"; // Pindah ke Dashboard
            } else {
                msg.innerText = "USER ATAU PASSWORD SALAH!";
            }
        } catch(e) {
            msg.innerText = "GAGAL TERHUBUNG KE SERVER";
        }
    }
</script>
</body>
</html>
