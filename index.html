<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ACHI - Premium Integration</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;800&display=swap" rel="stylesheet">
    <?!= include('styles'); ?>
</head>
<body class="bg-black text-white antialiased">

    <div id="loader" class="hidden fixed inset-0 flex items-center justify-center bg-black z-[999]">
        <div class="flex flex-col items-center">
            <div class="w-12 h-12 border-4 border-t-red-600 border-white/10 rounded-full animate-spin"></div>
            <p class="mt-4 text-[10px] tracking-[0.4em] text-zinc-500 font-bold uppercase">SINKRONISASI...</p>
        </div>
    </div>

    <div id="app-container">
        <section id="login-page" class="min-h-screen flex items-center justify-center p-6">
            <div class="w-full max-w-sm text-center">
                <img src="logo.png" class="w-28 mx-auto mb-10 drop-shadow-[0_0_15px_rgba(255,49,49,0.3)]">
                <div class="glass-card p-10">
                    <h1 class="text-2xl font-black italic mb-8 uppercase tracking-widest">ACHI LOGIN</h1>
                    <div class="space-y-4">
                        <input type="text" id="username" placeholder="Username" class="w-full p-4 input-premium">
                        <input type="password" id="password" placeholder="Password" class="w-full p-4 input-premium">
                        <button onclick="handleLogin()" class="w-full p-4 btn-red text-white font-bold text-xs uppercase tracking-widest mt-4">Masuk</button>
                    </div>
                </div>
            </div>
        </section>

        <div id="dashboard-content" class="hidden"></div>
    </div>

    <script>
        const formatIDR = (v) => "Rp " + new Intl.NumberFormat('id-ID').format(v);

        async function handleLogin() {
            const user = document.getElementById('username').value.trim();
            const pass = document.getElementById('password').value.trim();
            if(!user || !pass) return;
            
            document.getElementById('loader').classList.remove('hidden');

            google.script.run.withSuccessHandler(function(result) {
                document.getElementById('loader').classList.add('hidden');
                if(result.success) {
                    document.getElementById('login-page').classList.add('hidden');
                    loadInterface(result);
                } else {
                    alert(result.message);
                }
            }).loginProcess({username: user, password: pass});
        }

        function loadInterface(result) {
            let role = result.user.role.toLowerCase();
            // Mapping File
            let page = 'crew';
            if(['owner'].includes(role) || result.user.username.toUpperCase() === 'HENGKY' || result.user.username.toUpperCase() === 'ACHI') page = 'owner';
            else if(role === 'accounting') page = 'accounting';
            else if(role === 'purchasing') page = 'purchasing';
            else if(role === 'kapten') page = 'kapten';
            else if(role === 'kkm') page = 'kkm';

            google.script.run.withSuccessHandler(function(html) {
                const dash = document.getElementById('dashboard-content');
                dash.innerHTML = html;
                dash.classList.remove('hidden');
                initData(result);
            }).include(page);
        }

        function initData(res) {
            // Mengisi data dasar ke elemen yang ada di setiap role
            if(document.getElementById('userName')) document.getElementById('userName').innerText = res.user.username;
            if(document.getElementById('userPhoto') && res.user.foto) document.getElementById('userPhoto').src = res.user.foto;
            
            // Logika spesifik per role (diatur di file masing-masing nanti)
            if(typeof window.roleInit === "function") window.roleInit(res);
        }
    </script>
</body>
</html>
