<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DASHBOARD ADMIN - ACHI SYSTEM</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap');
        body { background: #000; color: #fff; font-family: 'Plus Jakarta Sans', sans-serif; }
        .card-admin { background: #0a0a0a; border: 1px solid #221212; border-radius: 1.5rem; }
        .input-red { background: #150a0a; border: 1px solid #331111; padding: 14px; border-radius: 12px; font-size: 14px; color: white; width: 100%; outline: none; transition: 0.3s; }
        .input-red:focus { border-color: #dc2626; background: #1a0a0a; }
        .btn-red { background: #dc2626; color: white; font-weight: 800; text-transform: uppercase; transition: 0.3s; box-shadow: 0 10px 20px -10px rgba(220, 38, 38, 0.5); }
        .btn-red:hover { background: #b91c1c; transform: translateY(-1px); }
    </style>
</head>
<body class="p-5">

    <div class="flex justify-between items-center mb-8">
        <div>
            <h1 class="text-xl font-black italic tracking-tighter uppercase leading-none text-red-600">Admin Panel</h1>
            <p class="text-[8px] text-gray-500 font-bold uppercase tracking-widest mt-1">Input Data Logistik Fleet</p>
        </div>
        <div class="flex gap-2">
            <button onclick="window.location.href='rekap.html'" class="w-10 h-10 card-admin flex items-center justify-center text-red-600 border-red-900/20">
                <i class="fas fa-file-invoice"></i>
            </button>
            <div class="w-10 h-10 rounded-full bg-red-600 flex items-center justify-center font-black border-2 border-red-900">A</div>
        </div>
    </div>

    <div class="card-admin p-6 space-y-5">
        <div>
            <label class="text-[9px] font-bold text-red-500/60 uppercase ml-1 tracking-widest">Pilih Armada Kapal</label>
            <select id="input-kapal" class="input-red mt-1">
                <option value="NABAWI 09">NABAWI 09</option>
                <option value="LASTIKA STAR">LASTIKA STAR</option>
                <option value="SRIKANDI 01">SRIKANDI 01</option>
            </select>
        </div>

        <div class="grid grid-cols-2 gap-4">
            <div>
                <label class="text-[9px] font-bold text-red-500/60 uppercase ml-1 tracking-widest">Nomor Trip</label>
                <input type="number" id="input-trip" placeholder="Contoh: 01" class="input-red mt-1">
            </div>
            <div>
                <label class="text-[9px] font-bold text-red-500/60 uppercase ml-1 tracking-widest">Tanggal</label>
                <input type="date" id="input-tanggal" class="input-red mt-1">
            </div>
        </div>

        <div>
            <label class="text-[9px] font-bold text-red-500/60 uppercase ml-1 tracking-widest">Nama Barang / Keperluan</label>
            <input type="text" id="input-barang" placeholder="Contoh: Pembelian Oli" class="input-red mt-1">
        </div>

        <div>
            <label class="text-[9px] font-bold text-red-500/60 uppercase ml-1 tracking-widest">Estimasi Harga (Rp)</label>
            <input type="number" id="input-harga" placeholder="Masukkan Nominal" class="input-red mt-1">
        </div>

        <button onclick="submitData()" id="btnSubmit" class="w-full btn-red py-4 rounded-xl mt-4 text-sm tracking-widest flex items-center justify-center gap-2">
            <i class="fas fa-paper-plane text-[10px]"></i> KIRIM KE OWNER
        </button>
    </div>

    <script>
        // URL WEB APP BOSS
        const API_URL = "https://script.google.com/macros/s/AKfycbwXVYldmD36WRt1Qgu5rcXqLRCjDyorZeYwaDUNueOmaoSlCFyJcK3WVQsXktDPG6Q/exec";

        // Auto-set tanggal hari ini
        document.getElementById('input-tanggal').valueAsDate = new Date();

        async function submitData() {
            const kapal = document.getElementById('input-kapal').value;
            const trip = document.getElementById('input-trip').value;
            const tanggal = document.getElementById('input-tanggal').value;
            const barang = document.getElementById('input-barang').value;
            const harga = document.getElementById('input-harga').value;
            const btn = document.getElementById('btnSubmit');

            if(!trip || !barang || !harga) {
                alert("Boss, data belum lengkap. Mohon periksa kembali!");
                return;
            }

            btn.innerText = "SEDANG MENGIRIM...";
            btn.disabled = true;

            const payload = {
                action: "inputLogistik",
                tanggal: tanggal,
                trip: trip,
                barang: barang,
                harga: harga,
                kapal: kapal,
                status: "PENDING"
            };

            try {
                // Gunakan mode no-cors jika hanya butuh submit tanpa baca response detail
                await fetch(API_URL, {
                    method: 'POST',
                    mode: 'no-cors',
                    cache: 'no-cache',
                    body: JSON.stringify(payload)
                });
                
                alert("Data Berhasil Terkirim ke Spreadsheet!");
                
                // Reset form setelah sukses
                document.getElementById('input-barang').value = "";
                document.getElementById('input-harga').value = "";
                document.getElementById('input-trip').value = "";
            } catch (error) {
                alert("Gagal koneksi ke database. Pastikan internet aktif!");
            } finally {
                btn.innerHTML = '<i class="fas fa-paper-plane text-[10px]"></i> KIRIM KE OWNER';
                btn.disabled = false;
            }
        }
    </script>
</body>
</html>
