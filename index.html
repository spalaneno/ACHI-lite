<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ACHI - Efendy Jaya Abadi</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root { --achi-red: #e21e26; }
        body { background-color: #f3f4f6; font-family: 'Inter', sans-serif; }
        .bg-main { background: linear-gradient(180deg, #8b0000 0%, #e21e26 100%); min-height: 100vh; }
        .bca-card { background: white; border-radius: 1.5rem; padding: 1.5rem; box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.1); }
        .menu-icon { background: linear-gradient(135deg, #e21e26 0%, #8b0000 100%); width: 55px; height: 55px; border-radius: 1rem; display: flex; align-items: center; justify-content: center; color: white; margin-bottom: 5px; box-shadow: 0 4px 10px rgba(226, 30, 38, 0.3); }
    </style>
</head>
<body>

    <div id="login-page" class="bg-main flex flex-col items-center justify-center p-8 text-center">
        <img src="logo.png" class="w-56 mb-2">
        <p class="text-[9px] font-black tracking-[0.3em] uppercase mb-12 text-white/80 italic">Aplikasi Crewing & Handling Integrasi</p>
        <div class="w-full max-w-xs space-y-3">
            <input id="u-name" type="text" placeholder="USER ID" class="w-full p-4 rounded-xl border-none bg-white/20 text-white placeholder-white/60 text-center font-bold outline-none backdrop-blur-md">
            <input id="u-pass" type="password" placeholder="KODE AKSES" class="w-full p-4 rounded-xl border-none bg-white/20 text-white placeholder-white/60 text-center font-bold outline-none backdrop-blur-md">
            <button onclick="login()" class="w-full bg-white text-[#e21e26] p-4 rounded-xl font-black uppercase shadow-xl">Login</button>
        </div>
    </div>

    <div id="app" class="hidden min-h-screen bg-gray-50 text-gray-800 pb-24">
        <div class="bg-[#e21e26] p-6 pb-24 text-white">
            <div class="flex justify-between items-center">
                <div class="flex items-center gap-3">
                    <img src="logo.png" class="w-10 h-10 bg-white rounded-lg p-1">
                    <div><h2 id="disp-name" class="font-black text-sm uppercase">-</h2><p id="disp-role" class="text-[8px] font-bold text-yellow-300 uppercase"></p></div>
                </div>
                <button onclick="logout()"><i class="fas fa-sign-out-alt text-xl"></i></button>
            </div>
        </div>

        <div class="px-6 -mt-16">
            <div class="bca-card grid grid-cols-3 gap-6 text-center">
                <div onclick="showSection('trans')" class="flex flex-col items-center"><div class="menu-icon"><i class="fas fa-history"></i></div><span class="text-[8px] font-bold uppercase">History</span></div>
                <div id="menu-input" onclick="openModal()" class="flex flex-col items-center"><div class="menu-icon"><i class="fas fa-plus"></i></div><span class="text-[8px] font-bold uppercase">Input</span></div>
                <div onclick="showSection('awak')" class="flex flex-col items-center"><div class="menu-icon"><i class="fas fa-wallet"></i></div><span class="text-[8px] font-bold uppercase">Saldo</span></div>
            </div>
        </div>

        <div class="px-6 mt-8">
            <h3 id="section-title" class="text-[10px] font-black text-gray-400 uppercase tracking-widest mb-4 italic">Monitor Transaksi</h3>
            <div id="main-list" class="space-y-4"></div>
        </div>
    </div>

    <div id="modal" class="fixed inset-0 bg-black/80 hidden items-end z-[100]">
        <div class="bg-white w-full rounded-t-[2.5rem] p-8 max-h-[90vh] overflow-y-auto">
            <div class="flex justify-between items-center mb-6">
                <h3 class="font-black text-[#e21e26] uppercase">Pengajuan & Bukti</h3>
                <button onclick="closeModal()" class="text-gray-300 text-3xl">&times;</button>
            </div>
            <div class="space-y-4">
                <select id="f-tipe" class="w-full p-4 bg-gray-100 rounded-xl font-bold text-sm outline-none"></select>
                <select id="f-cat" class="w-full p-4 bg-gray-100 rounded-xl text-sm outline-none"></select>
                <input id="f-ket" type="text" placeholder="Nama Barang" class="w-full p-4 border rounded-xl outline-none text-sm">
                <input id="f-alasan" type="text" placeholder="Alasan" class="w-full p-4 border rounded-xl outline-none text-sm">
                <input id="f-jumlah" type="number" placeholder="Nominal Rp" class="w-full p-4 border rounded-xl font-black outline-none">
                
                <div class="p-4 border-2 border-dashed border-gray-200 rounded-xl text-center">
                    <p class="text-[10px] font-bold text-gray-400 uppercase mb-2">Upload Bukti / Nota</p>
                    <input type="file" id="f-image" accept="image/*" class="hidden" onchange="previewImg(this)">
                    <button onclick="document.getElementById('f-image').click()" class="bg-gray-100 text-gray-600 px-4 py-2 rounded-lg text-[10px] font-bold uppercase"><i class="fas fa-camera mr-2"></i>Ambil Foto</button>
                    <img id="img-preview" class="hidden mt-3 w-full rounded-lg shadow-sm">
                </div>

                <button onclick="sendData()" id="btn-send" class="w-full bg-[#e21e26] text-white p-5 rounded-2xl font-bold uppercase shadow-lg shadow-red-200">Kirim Sekarang</button>
            </div>
        </div>
    </div>

    <script>
        const API = "https://script.google.com/macros/s/AKfycbxNGXE28-I_8ID7vDO0ueHQzdOIJse38VMKPhjMmnyZFmgZItr-UNUbnb14pxNUIc8/exec";
        let user = JSON.parse(localStorage.getItem('achi_user')) || null;
        let globalData = null;
        let base64Image = "";

        window.onload = () => { if(user) startApp(); };

        async function login() {
            const u = document.getElementById('u-name').value;
            const p = document.getElementById('u-pass').value;
            const res = await fetch(`${API}?action=login&username=${u}&password=${p}`);
            const d = await res.json();
            if(d.status === 'success') {
                user = d;
                localStorage.setItem('achi_user', JSON.stringify(d));
                startApp();
            } else alert("Login Gagal!");
        }

        function startApp() {
            document.getElementById('login-page').style.display = 'none';
            document.getElementById('app').classList.remove('hidden');
            document.getElementById('disp-name').innerText = user.nama;
            document.getElementById('disp-role').innerText = user.jabatan;
            
            const selTipe = document.getElementById('f-tipe');
            const selCat = document.getElementById('f-cat');
            if(user.level === 3) {
                selTipe.innerHTML = '<option value="Pembelian Darat">Pembelian Darat (Admin)</option>';
                selCat.innerHTML = '<option>Kebutuhan Kantor</option><option>Operasional Darat</option>';
            } else {
                selTipe.innerHTML = '<option value="Anfrakan Kapal">Anfrakan Kapal</option>';
                selCat.innerHTML = '<option>Dapur</option><option>Mesin</option><option>Operasional</option>';
            }
            loadData();
        }

        async function loadData() {
            const res = await fetch(`${API}?action=getData&level=${user.level}&kapal=${user.kapal}&jabatan=${user.jabatan}&nama=${user.nama}`);
            globalData = await res.json();
            showSection('trans');
        }

        function previewImg(input) {
            if (input.files && input.files[0]) {
                let reader = new FileReader();
                reader.onload = function(e) {
                    document.getElementById('img-preview').src = e.target.result;
                    document.getElementById('img-preview').classList.remove('hidden');
                    base64Image = e.target.result;
                };
                reader.readAsDataURL(input.files[0]);
            }
        }

        function showSection(type) {
            const list = document.getElementById('main-list');
            if(type === 'trans') {
                list.innerHTML = globalData.transaksi.map(i => `
                    <div class="bg-white p-5 rounded-3xl shadow-sm border-l-8 border-[#e21e26]">
                        <div class="flex justify-between text-[8px] font-black text-gray-400 uppercase"><span>${i[2]}</span><span>${i[8]}</span></div>
                        <p class="text-xs font-black mt-1 uppercase text-gray-700">${i[5]}</p>
                        <div class="flex justify-between items-end mt-3">
                            <span class="text-sm font-black text-[#e21e26]">Rp${Number(i[6]).toLocaleString()}</span>
                            ${i[10] ? `<a href="${i[10]}" target="_blank" class="text-[8px] bg-gray-100 px-3 py-1 rounded-full font-bold text-blue-600"><i class="fas fa-paperclip mr-1"></i>LIHAT NOTA</a>` : ''}
                        </div>
                    </div>
                `).join('');
            }
        }

        async function sendData() {
            const btn = document.getElementById('btn-send');
            btn.innerText = "SEDANG MENGUPLOAD..."; btn.disabled = true;

            const payload = {
                tipe: document.getElementById('f-tipe').value,
                kategori: document.getElementById('f-cat').value,
                keterangan: document.getElementById('f-ket').value,
                alasan: document.getElementById('f-alasan').value,
                jumlah: document.getElementById('f-jumlah').value,
                pemohon: user.nama,
                kapal: user.kapal,
                image: base64Image // Kirim Base64
            };

            await fetch(API, { method: 'POST', body: JSON.stringify(payload) });
            alert("Berhasil!");
            location.reload();
        }

        function logout() { localStorage.clear(); location.reload(); }
        function openModal() { document.getElementById('modal').style.display = 'flex'; }
        function closeModal() { document.getElementById('modal').style.display = 'none'; }
    </script>
</body>
</html>
