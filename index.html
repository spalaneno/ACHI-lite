<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ACHI - Efendy Jaya Abadi</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root { --achi-red: #e21e26; }
        body { background-color: #f3f4f6; font-family: 'Inter', sans-serif; }
        .bca-card { background: white; border-radius: 1.5rem; padding: 1.2rem; box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.1); }
        .menu-icon { background: linear-gradient(135deg, #e21e26 0%, #8b0000 100%); width: 55px; height: 55px; border-radius: 1.2rem; display: flex; align-items: center; justify-content: center; color: white; margin-bottom: 5px; }
        .btn-status { font-size: 7px; font-weight: 900; padding: 2px 8px; border-radius: 99px; text-transform: uppercase; }
        .bg-achi { background-color: var(--achi-red); }
    </style>
</head>
<body class="pb-10">

    <div id="login-page" class="fixed inset-0 bg-[#8b0000] z-[200] flex flex-col items-center justify-center p-8 text-center">
        <img src="logo.png" class="w-64 mb-1">
        <p class="text-[9px] font-black tracking-[0.3em] uppercase mb-12 text-white italic">Crewing & Handling Integration</p>
        <div class="w-full max-w-xs space-y-3">
            <input id="u-name" type="text" placeholder="USER ID" class="w-full p-4 rounded-xl text-center font-bold outline-none bg-white/20 text-white placeholder-white/50 border-none">
            <input id="u-pass" type="password" placeholder="KODE AKSES" class="w-full p-4 rounded-xl text-center font-bold outline-none bg-white/20 text-white placeholder-white/50 border-none">
            <button onclick="login()" class="w-full bg-white text-[#e21e26] p-4 rounded-xl font-black uppercase">Masuk</button>
        </div>
    </div>

    <div id="app" class="hidden min-h-screen">
        <div class="bg-achi p-6 pb-20 text-white flex justify-between items-center shadow-lg">
            <div class="flex items-center gap-3">
                <div class="w-10 h-10 bg-white rounded-lg p-1"><img src="logo.png"></div>
                <div><h2 id="disp-name" class="font-black text-xs uppercase leading-none">-</h2><p id="disp-role" class="text-[8px] font-bold text-yellow-300 uppercase mt-1"></p></div>
            </div>
            <button onclick="logout()" class="opacity-70"><i class="fas fa-power-off text-lg"></i></button>
        </div>

        <div class="px-6 -mt-10">
            <div class="bca-card grid grid-cols-3 gap-4 text-center">
                <div onclick="loadData()" class="flex flex-col items-center"><div class="menu-icon"><i class="fas fa-sync-alt"></i></div><span class="text-[8px] font-bold">REFRESH</span></div>
                <div id="btn-minta" class="flex flex-col items-center"><div class="menu-icon" id="icon-minta"><i class="fas fa-file-signature"></i></div><span class="text-[8px] font-bold">MINTA ANFRAK</span></div>
                <div onclick="alert('Fitur segera hadir')" class="flex flex-col items-center"><div class="menu-icon"><i class="fas fa-wallet"></i></div><span class="text-[8px] font-bold">SALDO</span></div>
            </div>
        </div>

        <div class="px-6 mt-8">
            <h3 class="text-[10px] font-black text-gray-400 uppercase tracking-widest mb-4 italic">Alur Monitoring</h3>
            <div id="main-list" class="space-y-4"></div>
        </div>
    </div>

    <div id="modal-reject" class="fixed inset-0 bg-black/80 hidden items-center justify-center z-[150] p-6">
        <div class="bg-white w-full max-w-sm rounded-3xl p-6">
            <h3 class="font-black text-red-600 uppercase mb-2">Tolak Anfrakan?</h3>
            <p class="text-[10px] text-gray-400 mb-4 font-bold uppercase">Berikan alasan penolakan agar pemohon mengerti.</p>
            <textarea id="f-alasan-reject" class="w-full p-4 bg-gray-50 border rounded-xl text-xs outline-none h-24 mb-4" placeholder="Contoh: Barang masih ada di gudang / Double Input"></textarea>
            <div class="grid grid-cols-2 gap-3">
                <button onclick="closeModal()" class="py-3 text-xs font-bold text-gray-400 uppercase">Batal</button>
                <button onclick="submitReject()" class="bg-red-600 text-white py-3 rounded-xl font-black text-xs uppercase">Ya, Tolak!</button>
            </div>
        </div>
    </div>

    <div id="modal-harga" class="fixed inset-0 bg-black/80 hidden items-end z-[100] p-4">
        <div class="bg-white w-full rounded-t-[2.5rem] p-8">
            <h3 class="font-black text-green-600 uppercase mb-4 italic">Realisasi Pembelian</h3>
            <div class="space-y-4">
                <p id="h-item" class="text-xs font-bold text-gray-600"></p>
                <input id="f-harga" type="number" placeholder="Harga Total (Rp)" class="w-full p-4 border rounded-xl font-black outline-none bg-yellow-50">
                
                <div class="space-y-2">
                    <p class="text-[8px] font-black text-gray-400 uppercase">Lampiran Nota</p>
                    <input type="file" id="f-image" accept="image/*" class="hidden" onchange="previewImg(this)">
                    <button id="btn-foto" onclick="document.getElementById('f-image').click()" class="w-full bg-gray-100 py-3 rounded-xl text-[10px] font-black text-gray-600 uppercase"><i class="fas fa-camera mr-2"></i>Ambil Foto Nota</button>
                    <img id="img-preview" class="hidden w-full h-32 object-cover rounded-xl mt-2">
                    <div id="area-alasan-nota" class="hidden mt-2">
                        <input id="f-alasan-tanpa-nota" type="text" placeholder="Kenapa tidak ada nota?" class="w-full p-3 border-red-300 border bg-red-50 rounded-xl text-xs outline-none">
                    </div>
                    <p id="msg-nota" onclick="toggleNoNota()" class="text-[9px] text-red-500 font-bold text-center cursor-pointer underline">Tidak ada nota? Klik di sini</p>
                </div>

                <button onclick="submitHarga()" id="btn-submit-harga" class="w-full bg-green-600 text-white p-5 rounded-2xl font-bold uppercase shadow-lg">Simpan & Selesai</button>
            </div>
        </div>
    </div>

    <div id="modal-anfrak" class="fixed inset-0 bg-black/80 hidden items-end z-[100] p-4">
        <div class="bg-white w-full rounded-t-[2.5rem] p-8 max-h-[85vh] overflow-y-auto">
            <h3 class="font-black text-[#e21e26] uppercase mb-4">Pengajuan Baru</h3>
            <div class="space-y-3">
                <select id="f-cat" class="w-full p-4 bg-gray-100 rounded-xl text-xs font-bold outline-none"></select>
                <input id="f-ket" type="text" placeholder="Nama Barang" class="w-full p-4 border rounded-xl text-xs outline-none">
                <input id="f-alasan" type="text" placeholder="Alasan/Keperluan" class="w-full p-4 border rounded-xl text-xs outline-none">
                <input id="f-qty" type="text" placeholder="Jumlah (Contoh: 10 Liter)" class="w-full p-4 border rounded-xl text-xs font-bold outline-none">
                <button onclick="sendAnfrakan()" id="btn-send" class="w-full bg-[#e21e26] text-white p-4 rounded-xl font-bold uppercase mt-2">Kirim</button>
                <button onclick="closeModal()" class="w-full text-gray-400 py-2 text-xs font-bold uppercase">Batal</button>
            </div>
        </div>
    </div>

    <script>
        const API = "https://script.google.com/macros/s/AKfycbyaG5MLjnUCUiJf-bq7zt_qlkZ4lvQ_N8qkw6ffnqRy4eEXSF8zT_pKm0Ee0ytHzcdt/exec";
        let user = JSON.parse(localStorage.getItem('achi_user')) || null;
        let activeId = null;
        let base64Image = "";
        let isNoNota = false;

        window.onload = () => { if(user) startApp(); };

        async function login() {
            const u = document.getElementById('u-name').value;
            const p = document.getElementById('u-pass').value;
            const res = await fetch(`${API}?action=login&username=${u}&password=${p}`);
            const d = await res.json();
            if(d.status === 'success') {
                user = d; localStorage.setItem('achi_user', JSON.stringify(d)); startApp();
            } else alert("Akses Ditolak!");
        }

        function startApp() {
            document.getElementById('login-page').style.display = 'none';
            document.getElementById('app').classList.remove('hidden');
            document.getElementById('disp-name').innerText = user.nama;
            document.getElementById('disp-role').innerText = user.jabatan;
            
            const btnMinta = document.getElementById('btn-minta');
            if (user.level === 3) {
                btnMinta.onclick = () => alert("Admin hanya menyetujui & input harga.");
                document.getElementById('icon-minta').classList.add('opacity-30');
            } else {
                btnMinta.onclick = () => {
                    const selCat = document.getElementById('f-cat');
                    if (user.jabatan === 'KKM') selCat.innerHTML = '<option>Kamar Mesin</option>';
                    else selCat.innerHTML = '<option>Dapur</option><option>Operasional Kapal</option><option>Kamar Mesin (Darurat)</option><option>Harian</option>';
                    document.getElementById('modal-anfrak').style.display = 'flex';
                };
            }
            loadData();
        }

        async function loadData() {
            const res = await fetch(`${API}?action=getData`);
            const data = await res.json();
            renderList(data.transaksi);
        }

        function renderList(data) {
            const cont = document.getElementById('main-list');
            cont.innerHTML = data.reverse().map(i => {
                let statusColor = i[9] === 'MENUNGGU ADMIN' ? 'bg-orange-100 text-orange-600' : 
                                 i[9] === 'DISETUJUI OWNER' ? 'bg-blue-100 text-blue-600' : 
                                 i[9] === 'SELESAI' ? 'bg-green-100 text-green-600' : 'bg-red-100 text-red-600';
                
                let actionBtn = "";
                if ((user.level === 3 || user.level === 1) && i[9] === 'MENUNGGU ADMIN') {
                    actionBtn = `
                        <div class="grid grid-cols-2 gap-2 mt-3">
                            <button onclick="openReject('${i[0]}')" class="bg-gray-100 text-red-600 text-[8px] font-black p-3 rounded-xl uppercase">Reject</button>
                            <button onclick="changeStatus('${i[0]}', 'DISETUJUI OWNER')" class="bg-blue-600 text-white text-[8px] font-black p-3 rounded-xl uppercase">Approve</button>
                        </div>`;
                } else if (user.level === 1 && i[9] === 'DISETUJUI OWNER') {
                    actionBtn = `<button onclick="openReject('${i[0]}')" class="mt-2 w-full bg-gray-50 text-red-400 text-[8px] font-bold p-2 rounded-lg">BATALKAN / REJECT</button>`;
                } else if (user.level === 3 && i[9] === 'DISETUJUI OWNER') {
                    actionBtn = `<button onclick="openHarga('${i[0]}', '${i[5]}')" class="mt-3 w-full bg-green-600 text-white text-[8px] font-black p-3 rounded-xl uppercase tracking-widest">Beli & Input Harga</button>`;
                }

                return `
                <div class="bg-white p-5 rounded-3xl shadow-sm border border-gray-100">
                    <div class="flex justify-between mb-3">
                        <span class="${statusColor} btn-status">${i[9]}</span>
                        <span class="text-[8px] font-bold text-gray-300 italic">${new Date(i[1]).toLocaleDateString()}</span>
                    </div>
                    <p class="text-[11px] font-black text-gray-800 uppercase leading-tight">${i[5]}</p>
                    <p class="text-[9px] text-gray-400 mt-1">Qty: ${i[6]} • ${i[2]}</p>
                    ${i[12] ? `<p class="mt-2 text-[8px] bg-red-50 p-2 rounded-lg text-red-500 font-bold italic border border-red-100">Info: ${i[12]}</p>` : ''}
                    <div class="mt-3 pt-3 border-t flex justify-between items-center">
                        <span class="text-[10px] font-black text-red-600">${i[7] > 0 ? 'Rp'+Number(i[7]).toLocaleString() : 'Menunggu Harga...'}</span>
                        ${i[11] ? `<a href="${i[11]}" target="_blank" class="text-[8px] text-blue-500 font-black underline">LIHAT NOTA</a>` : ''}
                    </div>
                    ${actionBtn}
                </div>`;
            }).join('');
        }

        // FUNGSI REJECT
        function openReject(id) { activeId = id; document.getElementById('modal-reject').style.display = 'flex'; }
        async function submitReject() {
            const alasan = document.getElementById('f-alasan-reject').value;
            if(!alasan) return alert("Alasan reject wajib diisi!");
            await fetch(API, { method: 'POST', body: JSON.stringify({ action: 'changeStatus', id: activeId, statusBaru: 'REJECTED', alasan: alasan }) });
            location.reload();
        }

        async function changeStatus(id, status) {
            if(!confirm("Setujui pengajuan ini?")) return;
            await fetch(API, { method: 'POST', body: JSON.stringify({ action: 'changeStatus', id: id, statusBaru: status }) });
            loadData();
        }

        // FUNGSI LOGIKA NOTA
        function toggleNoNota() {
            isNoNota = !isNoNota;
            const area = document.getElementById('area-alasan-nota');
            const btnFoto = document.getElementById('btn-foto');
            const msg = document.getElementById('msg-nota');
            if(isNoNota) {
                area.classList.remove('hidden'); btnFoto.classList.add('opacity-30');
                msg.innerText = "Gunakan Kamera Kembali";
            } else {
                area.classList.add('hidden'); btnFoto.classList.remove('opacity-30');
                msg.innerText = "Tidak ada nota? Klik di sini";
            }
        }

        function openHarga(id, item) {
            activeId = id; document.getElementById('h-item').innerText = item;
            document.getElementById('modal-harga').style.display = 'flex';
        }

        async function submitHarga() {
            const h = document.getElementById('f-harga').value;
            const alasanTanpa = document.getElementById('f-alasan-tanpa-nota').value;
            if(!h) return alert("Harga wajib diisi!");
            if(!base64Image && !isNoNota) return alert("Foto nota wajib ada atau isi alasan jika tidak ada nota!");
            if(isNoNota && !alasanTanpa) return alert("Alasan tanpa nota wajib diisi!");

            document.getElementById('btn-submit-harga').innerText = "MENYIMPAN...";
            await fetch(API, { method: 'POST', body: JSON.stringify({ 
                action: 'updateHarga', id: activeId, harga: h, image: base64Image, alasanTanpaNota: alasanTanpa 
            }) });
            location.reload();
        }

        async function sendAnfrakan() {
            const payload = { 
                tipe: "Anfrakan Kapal", kategori: document.getElementById('f-cat').value,
                keterangan: document.getElementById('f-ket').value, alasan: document.getElementById('f-alasan').value,
                qty: document.getElementById('f-qty').value, pemohon: user.nama, kapal: user.kapal
            };
            await fetch(API, { method: 'POST', body: JSON.stringify(payload) });
            location.reload();
        }

        function previewImg(input) {
            let reader = new FileReader();
            reader.onload = (e) => { 
                document.getElementById('img-preview').src = e.target.result;
                document.getElementById('img-preview').classList.remove('hidden');
                base64Image = e.target.result;
                isNoNota = false; document.getElementById('area-alasan-nota').classList.add('hidden');
            };
            reader.readAsDataURL(input.files[0]);
        }

        function logout() { localStorage.clear(); location.reload(); }
        function closeModal() { 
            document.querySelectorAll('[id^="modal"]').forEach(m => m.style.display = 'none'); 
        }
    </script>
</body>
</html>
