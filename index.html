<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ACHI SYSTEM - PT EFENDY JAYA ABADI</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css"/>
    <style>
        :root { --main-red: #b31d1d; }
        body { background: #fdfdfd; font-family: 'Inter', sans-serif; }
        .red-gradient { background: linear-gradient(-45deg, #b31d1d, #7a1212); }
        .view-section { display: none; }
        .view-section.active { display: block; animation: fadeInUp 0.5s both; }
        #toast { visibility: hidden; position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%); background: #000; color: white; padding: 12px 30px; border-radius: 50px; font-size: 11px; z-index: 10000; }
        #toast.show { visibility: visible; }
        .input-field { width: 100%; padding: 1rem; background: #f3f4f6; border-radius: 1rem; font-weight: bold; outline: none; border: 2px solid transparent; transition: 0.3s; }
        .input-field:focus { border-color: var(--main-red); background: white; }
    </style>
</head>
<body>

<div id="toast">Notifikasi</div>

<div id="login-page" class="fixed inset-0 z-[1000] red-gradient flex flex-col items-center justify-center p-10 text-center text-white">
    <div class="w-32 h-32 bg-white rounded-[2rem] p-4 mb-6 animate__animated animate__zoomIn">
        <img src="logo.png" class="w-full h-full object-contain">
    </div>
    <h1 class="text-4xl font-black italic uppercase animate__animated animate__fadeInUp">ACHI Mobile</h1>
    <p class="text-[10px] tracking-[0.4em] mb-10 opacity-70 uppercase animate__animated animate__fadeInUp">Aplikasi Crewing & Handling Integrasi</p>
    <div class="w-full max-w-xs space-y-4 animate__animated animate__fadeInUp">
        <input id="u" type="text" placeholder="USER ID" class="w-full p-5 rounded-2xl bg-white text-gray-800 text-center font-bold uppercase outline-none shadow-xl">
        <input id="p" type="password" placeholder="KODE AKSES" class="w-full p-5 rounded-2xl bg-white text-gray-800 text-center font-bold outline-none shadow-xl">
        <button onclick="doLogin()" id="btn-login" class="w-full bg-[#0a192f] text-white p-5 rounded-3xl font-black uppercase shadow-2xl active:scale-95">AUTHORIZE ACCESS</button>
    </div>
</div>

<div id="app" class="hidden min-h-screen">
    <header class="red-gradient pt-12 pb-24 px-8 text-white rounded-b-[3rem] shadow-xl flex justify-between items-start">
        <div>
            <div id="user-r" class="bg-black/20 px-3 py-1 rounded-full text-[9px] font-bold uppercase border border-white/10 inline-block mb-2"></div>
            <h2 id="user-n" class="text-3xl font-black uppercase leading-none">-</h2>
        </div>
        <button onclick="doLogout()" class="w-12 h-12 bg-white/10 rounded-2xl flex items-center justify-center"><i class="fas fa-power-off"></i></button>
    </header>

    <main class="px-6 -mt-12">
        <section id="view-home" class="view-section active">
            <div class="bg-white p-8 rounded-[2.5rem] shadow-xl grid grid-cols-3 gap-6" id="menu-grid"></div>
        </section>

        <section id="view-form" class="view-section">
            <div class="bg-white rounded-[2.5rem] p-8 shadow-2xl relative">
                <button onclick="openView('home')" class="absolute right-6 top-6 text-gray-300 text-2xl"><i class="fas fa-times-circle"></i></button>
                <h3 id="form-title" class="text-2xl font-black text-[#b31d1d] uppercase italic mb-8">ANFRAKAN</h3>
                
                <div class="space-y-4">
                    <select id="f-cat" class="input-field"></select>
                    <input id="f-ket" type="text" placeholder="Nama Barang (Contoh: Beras)" class="input-field">
                    
                    <div class="flex gap-4">
                        <input id="f-qty" type="number" placeholder="Jumlah" class="input-field flex-[2]">
                        <input id="f-sat" type="text" placeholder="Satuan (Kg/Ltr/Box)" class="input-field flex-[1]">
                    </div>

                    <button id="btn-save" onclick="submitData()" class="w-full red-gradient text-white p-5 rounded-2xl font-black uppercase shadow-xl mt-4">KIRIM</button>
                </div>
            </div>
        </section>

        <section id="view-list" class="view-section pb-20">
            <div class="flex justify-between items-center my-6">
                <button onclick="openView('home')" class="font-bold text-xs uppercase"><i class="fas fa-arrow-left mr-2"></i> Kembali</button>
                <button onclick="refreshData()" class="w-10 h-10 bg-white rounded-xl shadow text-red-600"><i id="sync-icon" class="fas fa-sync-alt"></i></button>
            </div>
            <div id="data-list" class="space-y-4"></div>
        </section>
    </main>
</div>

<script>
    const API = "https://script.google.com/macros/s/AKfycbxknjxmr96CRRXtgHZbj8j8lprJGBPzUZhv1o6KqxKq1wyd4Y95ZdtuIMZ9FQ4T2XFS/exec";
    let USER = JSON.parse(localStorage.getItem('achi_session')) || null;

    window.onload = () => { if(USER) start(); };

    function toast(m) {
        const t = document.getElementById('toast'); t.innerText = m; t.className = "show";
        setTimeout(() => t.className = "", 3000);
    }

    async function doLogin() {
        const u = document.getElementById('u').value, p = document.getElementById('p').value;
        if(!u || !p) return toast("Lengkapi Data!");
        document.getElementById('btn-login').innerHTML = "CONNECTING...";
        try {
            const r = await fetch(`${API}?action=login&u=${u}&p=${p}`);
            const d = await r.json();
            if(d.status === 'success') { USER = d; localStorage.setItem('achi_session', JSON.stringify(d)); start(); }
            else { toast("Akses Gagal!"); document.getElementById('btn-login').innerHTML = "AUTHORIZE ACCESS"; }
        } catch(e) { toast("Error Jaringan"); }
    }

    function start() {
        document.getElementById('login-page').style.display = 'none';
        document.getElementById('app').classList.remove('hidden');
        document.getElementById('user-n').innerText = USER.nama;
        document.getElementById('user-r').innerText = USER.jabatan + " • " + USER.kapal;
        drawMenu();
    }

    function drawMenu() {
        const g = document.getElementById('menu-grid');
        let m = [];
        if(USER.level === 1) m = [{id:'pp', l:'PP', i:'fa-file-invoice-dollar'}, {id:'anf', l:'Anfrak', i:'fa-ship'}, {id:'lis', l:'Status', i:'fa-chart-bar'}];
        else if(USER.level === 3) m = [{id:'pp', l:'PP', i:'fa-file-invoice-dollar'}, {id:'buy', l:'Daftar Beli', i:'fa-cart-shopping'}, {id:'lis', l:'Status', i:'fa-list-check'}];
        else m = [{id:'anf', l:'Anfrakan', i:'fa-anchor'}, {id:'lis', l:'Status', i:'fa-clipboard-check'}];

        g.innerHTML = m.map(x => `<div onclick="handle('${x.id}')" class="flex flex-col items-center"><div class="w-14 h-14 rounded-2xl bg-gray-50 flex items-center justify-center text-xl text-red-600 shadow-sm mb-2"><i class="fas ${x.i}"></i></div><span class="text-[10px] font-black uppercase">${x.l}</span></div>`).join('');
    }

    function handle(id) {
        if(id === 'lis' || id === 'buy') openView('list');
        else if(id === 'pp') openForm('Permintaan Pembelian');
        else if(id === 'anf') openForm('Anfrakan');
    }

    function openView(v) {
        document.querySelectorAll('.view-section').forEach(s => s.classList.remove('active'));
        document.getElementById('view-'+v).classList.add('active');
        if(v === 'list') refreshData();
    }

    function openForm(t) {
        document.getElementById('form-title').innerText = t;
        const s = document.getElementById('f-cat');
        s.innerHTML = t === 'Anfrakan' ? '<option>Anfrakan Deck</option><option>Anfrakan Mesin</option>' : '<option>PP Sparepart</option><option>PP Umum</option>';
        openView('form');
    }

    async function submitData() {
        const k = document.getElementById('f-ket').value, q = document.getElementById('f-qty').value, s = document.getElementById('f-sat').value;
        if(!k || !q || !s) return toast("Lengkapi Form!");
        const b = document.getElementById('btn-save'); b.disabled = true; b.innerText = "MENGIRIM...";
        
        const p = { action: 'input', tgl: new Date().toLocaleDateString('id-ID'), jam: new Date().toLocaleTimeString('id-ID'), kategori: document.getElementById('f-cat').value, keterangan: k, satuan: s, qty: q, pemohon: USER.nama, kapal: USER.kapal };
        
        try {
            await fetch(API, { method: 'POST', body: JSON.stringify(p) });
            toast("Data Terkirim!");
            document.getElementById('f-ket').value = ""; document.getElementById('f-qty').value = ""; document.getElementById('f-sat').value = "";
            openView('home');
        } catch(e) { toast("Gagal Terkirim!"); }
        b.disabled = false; b.innerText = "KIRIM";
    }

    async function refreshData() {
        const l = document.getElementById('data-list'), ic = document.getElementById('sync-icon');
        ic.classList.add('fa-spin');
        try {
            const r = await fetch(`${API}?action=getData&level=${USER.level}&kapal=${USER.kapal}`);
            const d = await r.json();
            l.innerHTML = d.transaksi.map(i => `
                <div class="bg-white p-5 rounded-3xl shadow-sm border border-gray-100">
                    <div class="flex justify-between items-start mb-3">
                        <span class="text-[8px] font-black px-2 py-1 bg-gray-100 rounded-full uppercase">${i[8]}</span>
                        <span class="text-[9px] text-gray-400 font-bold">${i[1]}</span>
                    </div>
                    <h4 class="text-sm font-black text-gray-800 uppercase">${i[4]}</h4>
                    <p class="text-xs font-bold text-red-600 mt-1">${i[6]} ${i[5]}</p>
                    <p class="text-[9px] text-gray-400 mt-2 font-bold uppercase">${i[7]} • ${i[9]}</p>
                    ${USER.level === 2 && i[8] === 'MENUNGGU ADMIN' ? `<button onclick="updateStatus('${i[0]}','TELAH DIPERIKSA')" class="w-full mt-4 p-3 bg-blue-600 text-white rounded-xl font-bold text-[10px]">VERIFIKASI</button>` : ''}
                    ${USER.level === 1 && i[8] === 'TELAH DIPERIKSA' ? `<button onclick="updateStatus('${i[0]}','DISETUJUI OWNER')" class="w-full mt-4 p-3 bg-green-600 text-white rounded-xl font-bold text-[10px]">SETUJUI OWNER</button>` : ''}
                </div>
            `).join('');
        } catch(e) { toast("Gagal Sinkron!"); }
        ic.classList.remove('fa-spin');
    }

    async function updateStatus(id, s) {
        toast("Updating...");
        await fetch(API, { method: 'POST', body: JSON.stringify({ action: 'changeStatus', id: id, s: s }) });
        refreshData();
    }

    function doLogout() { localStorage.clear(); location.reload(); }
</script>
</body>
</html>
