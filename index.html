<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - PT Efendy Jaya Abadi</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        body {
            background: radial-gradient(circle at center, #1a0000 0%, #000000 100%);
            font-family: 'Inter', sans-serif;
            height: 100vh; display: flex; align-items: center; justify-content: center; margin: 0;
            overflow: hidden;
        }
        /* Animasi cahaya merah di latar belakang */
        .bg-glow {
            position: absolute; width: 300px; height: 300px;
            background: #b31d1d; filter: blur(150px);
            border-radius: 50%; opacity: 0.2; animation: move 10s infinite alternate;
        }
        @keyframes move { from { transform: translate(-50%, -50%); } to { transform: translate(50%, 50%); } }
        
        .login-card {
            background: rgba(20, 20, 20, 0.8);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(179, 29, 29, 0.3);
            border-radius: 2.5rem;
            width: 100%; max-width: 360px;
        }
        .input-dark {
            background: rgba(40, 40, 40, 0.5);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: white; transition: 0.3s;
        }
        .input-dark:focus { border-color: #b31d1d; background: rgba(60, 60, 60, 0.8); outline: none; }
        .btn-crimson {
            background: linear-gradient(to right, #b31d1d, #7a1212);
            color: white; font-weight: 900; transition: 0.3s;
        }
        .btn-crimson:active { transform: scale(0.95); }
    </style>
</head>
<body>
    <div class="bg-glow"></div>
    
    <div class="login-card p-10 shadow-2xl z-10">
        <div class="text-center mb-10">
            <img src="https://i.ibb.co/6P0qXFf/LOGO-BAPAK.png" alt="Logo" class="h-28 mx-auto mb-2 drop-shadow-[0_0_15px_rgba(179,29,29,0.5)]">
            <div class="h-[2px] w-12 bg-[#b31d1d] mx-auto rounded-full"></div>
        </div>

        <div class="space-y-4">
            <div class="relative">
                <i class="fas fa-user absolute left-4 top-4 text-gray-500"></i>
                <input type="text" id="u" placeholder="USERNAME" class="input-dark w-full pl-12 pr-4 py-4 rounded-2xl font-bold text-sm">
            </div>
            <div class="relative">
                <i class="fas fa-lock absolute left-4 top-4 text-gray-500"></i>
                <input type="password" id="p" placeholder="PASSWORD" class="input-dark w-full pl-12 pr-4 py-4 rounded-2xl font-bold text-sm">
            </div>
            <button onclick="doLogin()" id="btn" class="btn-crimson w-full py-4 rounded-2xl shadow-lg mt-4 uppercase italic tracking-widest text-xs">
                Authentifikasi
            </button>
        </div>
        <p id="msg" class="mt-6 text-[9px] font-black text-red-500 text-center uppercase italic tracking-widest"></p>
    </div>

<script>
    const API = "https://script.google.com/macros/s/AKfycbwfWHNuSdfpw8UoQ0XrWxvU7yfQwnw366KwdzOFLvwApqjPgpiWS0PwMyGwg0C9SCIS/exec";
    async function doLogin() {
        const u = document.getElementById('u').value.trim();
        const p = document.getElementById('p').value.trim();
        const msg = document.getElementById('msg');
        if(!u || !p) return;
        msg.innerText = "Mengecek Akses...";
        try {
            const r = await fetch(`${API}?action=login&u=${u}&p=${p}`);
            const res = await r.json();
            if(res.status === "success") {
                localStorage.setItem('achi_session', JSON.stringify(res.data));
                window.location.href = "dashboard.html";
            } else { msg.innerText = "Akses Ditolak!"; }
        } catch(e) { msg.innerText = "Kesalahan Server!"; }
    }
</script>
</body>
</html>
