<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Sistem Laporan ACHI</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        .achi-red { background-color: #e21e26; }
        .text-achi-red { color: #e21e26; }
        body { background-color: #f3f4f6; font-family: 'Segoe UI', sans-serif; }
        
        /* Layout untuk Cetak Laporan */
        @media print {
            @page { size: A4 portrait; margin: 1.5cm; }
            .no-print { display: none !important; }
            .print-only { display: block !important; }
            body { background: white !important; }
            #print-area { position: absolute; left: 0; top: 0; width: 100%; }
            .kop { border-bottom: 3px double #000; text-align: center; margin-bottom: 20px; padding-bottom: 10px; }
            table { width: 100%; border-collapse: collapse; margin-top: 15px; }
            th, td { border: 1px solid #000; padding: 8px; font-size: 10pt; text-align: left; }
            th { background-color: #f2f2f2 !important; font-weight: bold; text-transform: uppercase; }
            .text-right { text-align: right; }
            .font-bold { font-weight: bold; }
        }
        .print-only { display: none; }
    </style>
</head>
<body class="max-w-md mx-auto min-h-screen pb-24">

    <div id="login-page" class="p-10 pt-24 text-center bg-white min-h-screen flex flex-col items-center">
        <h1 class="text-5xl font-black text-achi-red italic mb-2">ACHI</h1>
        <p class="text-[10px] font-bold text-gray-400 tracking-[0.3em] mb-12 uppercase italic">Integrated Fleet System</p>
        
        <div class="w-full space-y-4">
            <input id="u-name" type="text" placeholder="Username" class="w-full p-4 rounded-2xl border border-gray-200 outline-none focus:border-red-500 bg-gray-50 text-center">
            <input id="u-pass" type="password" placeholder="Password" class="w-full p-4 rounded-2xl border border-gray-200 outline-none focus:border-red-500 bg-gray-50 text-center">
            <button onclick="login()" id="btn-login" class="w-full achi-red text-white p-4 rounded-2xl font-bold shadow-lg uppercase tracking-widest active:scale-95 transition">Masuk</button>
        </div>
    </div>

    <div id="app" class="hidden">
        <div class="achi-red p-6 rounded-b-[40px] text-white shadow-xl mb-6 no-print">
            <div class="flex justify-between items-center">
                <div>
                    <p id="user-display" class="text-xl font-bold italic">-</p>
                    <p id="role-display" class="text-[9px] opacity-80 uppercase tracking-widest font-bold text-yellow-300 italic"></p>
                </div>
                <button onclick="logout()" class="bg-white/20 p-2 rounded-xl text-white"><i class="fas fa-sign-out-alt"></i></button>
            </div>
        </div>

        <div id="owner-menu" class="px-6 mb-6 hidden no-print">
            <div class="bg-white p-5 rounded-3xl shadow-sm border border-gray-100">
                <p class="text-[10px] font-bold text-gray-400 uppercase mb-4 tracking-widest italic border-b pb-2">Panel Filter Laporan</p>
                <div class="grid grid-cols-2 gap-3 mb-4">
                    <input type="date" id="start-date" class="w-full p-2 bg-gray-50 border rounded-lg text-xs outline-none focus:border-red-500">
                    <input type="date" id="end-date" class="w-full p-2 bg-gray-50 border rounded-lg text-xs outline-none focus:border-red-500">
                </div>
                <button onclick="applyFilter()" id="btn-filter" class="w-full achi-red text-white py-3 rounded-xl text-[10px] font-bold uppercase tracking-widest shadow-md">Terapkan Filter</button>
            </div>
        </div>

        <div id="print-area" class="px-6">
            <div class="print-only kop">
                <h1 class="text-3xl font-black text-red-600">PT. ACHI</h1>
                <p class="text-[10px] font-bold uppercase tracking-[0.3em]">Armada Crewing & Handling Integrasi</p>
                <div style="margin-top: 15px; font-size: 10pt; font-weight: bold; text-decoration: underline;" id="print-title">LAPORAN PENGELUARAN ARMADA</div>
                <p id="print-period-label" class="text-[9px] italic mt-1"></p>
            </div>

            <h3 id="view-label" class="font-bold text-gray-800 text-[11px] uppercase mb-4 tracking-widest flex items-center no-print italic">
                <span class="w-2 h-4 achi-red mr-2 rounded-full"></span> Pengeluaran Hari Ini
            </h3>
            
            <div id="main-list" class="space-y-4 no-print"></div>

            <div id="table-output" class="print-only"></div>

            <div class="print-only mt-12 grid grid-cols-2 text-center">
                <div>
                    <p class="text-[10pt] mb-20">Dibuat Oleh,</p>
                    <p id="p-admin-name" class="text-[10pt] font-bold border-t border-black inline-block px-8 uppercase">-</p>
                    <p class="text-[8pt] italic">Admin Operasional</p>
                </div>
                <div>
                    <p class="text-[10pt] mb-20">Disetujui Oleh,</p>
                    <p class="text-[10pt] font-bold border-t border-black inline-block px-8 uppercase">Hengky</p>
                    <p class="text-[8pt] italic">Owner PT. ACHI</p>
                </div>
            </div>
        </div>

        <div class="fixed bottom-0 left-0 right-0 max-w-md mx-auto bg-white border-t p-4 flex justify-around items-center no-print shadow-2xl z-50">
            <button onclick="loadInitialData()" class="text-gray-400 hover:text-achi-red flex flex-col items-center">
                <i class="fas fa-home text-xl"></i>
                <span class="text-[9px] font-bold mt-1">HARI INI</span>
            </button>
            <button onclick="openModal()" class="achi-red w-14 h-14 rounded-full text-white -mt-12 border-4 border-white shadow-xl flex items-center justify-center transition active:scale-90">
                <i class="fas fa-plus text-xl"></i>
            </button>
            <button id="nav-rep-btn" onclick="toggleFilterMenu()" class="hidden text-gray-400 hover:text-achi-red flex flex-col items-center">
                <i class="fas fa-file-invoice text-xl"></i>
                <span class="text-[9px] font-bold mt-1">LAPORAN</span>
            </button>
        </div>
    </div>

    <div id="modal" class="fixed inset-0 bg-black/60 hidden items-end z-[100] no-print">
        <div class="bg-white w-full rounded-t-[40px] p-8 max-w-md animate-slide-up shadow-2xl">
            <div class="flex justify-between items-center mb-6 border-b pb-4">
                <h3 class="font-bold text-achi-red italic uppercase tracking-widest">Input Pengeluaran</h3>
                <button onclick="closeModal()" class="text-gray-300"><i class="fas fa-times text-xl"></i></button>
            </div>
            <div class="space-y-4">
                <select id="f-kapal" class="w-full p-4 bg-gray-50 border rounded-2xl text-sm font-bold outline-none">
                    <option>KM. Nabawi 09</option><option>KM. Lastika Star</option>
                    <option>KM. Srikandi 01</option><option>Rakit 01</option>
                </select>
                <input id="f-ket" type="text" placeholder="Keterangan Pengeluaran" class="w-full p-4 bg-gray-50 border rounded-2xl text-sm outline-none">
                <input id="f-jumlah" type="number" placeholder="Nominal (Tanpa Titik/Koma)" class="w-full p-4 bg-gray-50 border rounded-2xl text-sm font-bold text-achi-red outline-none">
                <div class="p-4 bg-gray-50 rounded-2xl border-2 border-dashed text-center">
                    <p class="text-[9px] font-bold text-gray-400 uppercase mb-2">Bukti Nota (Opsional)</p>
                    <input id="f-file" type="file" accept="image/*" class="text-[10px] w-full">
                </div>
                <button onclick="saveData()" id="btn-save" class="w-full achi-red text-white p-5 rounded-2xl font-bold uppercase shadow-xl active:scale-95 transition tracking-widest">Kirim Data</button>
            </div>
        </div>
    </div>

    <script>
        // GANTI URL DI BAWAH INI DENGAN URL DEPLOY ANDA
        const API = "https://script.google.com/macros/s/AKfycbwiQ4jFiovkcE5vvArQZwqwJiMHDx-jUJMhvfj14S1nP_o_-pBcku_yLd6Xji40mTcL/exec"; 
        
        let currentUser = JSON.parse(localStorage.getItem('achi_session'));
        let allData = [];

        window.onload = () => { if(currentUser) showApp(currentUser); };

        async function login() {
            const u = document.getElementById('u-name').value.trim();
            const p = document.getElementById('u-pass').value.trim();
            if(!u || !p) return alert("Lengkapi Login!");

            const btn = document.getElementById('btn-login');
            btn.innerHTML = '<i class="fas fa-circle-notch fa-spin"></i> MEMPROSES...';
            btn.disabled = true;

            try {
                const r = await fetch(`${API}?action=login&username=${encodeURIComponent(u)}&password=${encodeURIComponent(p)}`);
                const d = await r.json();
                if(d.status === 'success') {
                    localStorage.setItem('achi_session', JSON.stringify(d));
                    currentUser = d;
                    showApp(d);
                } else {
                    alert("Username atau Password Salah!");
                    btn.innerHTML = "Masuk";
                    btn.disabled = false;
                }
            } catch(e) {
                alert("Kesalahan Jaringan!");
                btn.innerHTML = "Masuk";
                btn.disabled = false;
            }
        }

        function showApp(d) {
            document.getElementById('login-page').style.display = 'none';
            document.getElementById('app').classList.remove('hidden');
            document.getElementById('user-display').innerText = d.nama;
            document.getElementById('p-admin-name').innerText = d.nama;
            
            const roleEl = document.getElementById('role-display');
            if(d.level === 1) roleEl.innerText = "Admin Operasional";
            if(d.level === 2) roleEl.innerText = "Accounting (OD)";
            if(d.level === 3) roleEl.innerText = "Owner PT. ACHI";

            if(d.level >= 2) document.getElementById('nav-rep-btn').classList.remove('hidden');
            
            loadInitialData();
        }

        async function loadInitialData() {
            document.getElementById('view-label').innerText = "Pengeluaran Hari Ini";
            document.getElementById('owner-menu').classList.add('hidden');
            
            const list = document.getElementById('main-list');
            list.innerHTML = '<p class="text-center text-xs font-bold text-gray-400 italic">Menyinkronkan data...</p>';
            
            try {
                const r = await fetch(`${API}?action=getTransaksi`);
                allData = await r.json();
                
                // Filter: Hari ini saja
                const tglSkrg = new Date().toLocaleDateString('id-ID');
                let filtered = allData.filter(i => new Date(i.Tanggal).toLocaleDateString('id-ID') == tglSkrg);
                
                // Jika Level 1, hanya lihat data sendiri
                if(currentUser.level === 1) filtered = filtered.filter(i => i.Admin === currentUser.nama);
                
                document.getElementById('print-period-label').innerText = `Laporan Per Tanggal: ${tglSkrg}`;
                render(filtered);
            } catch(e) {
                list.innerHTML = '<p class="text-center text-red-500 text-xs">Gagal memuat data.</p>';
            }
        }

        async function applyFilter() {
            const startStr = document.getElementById('start-date').value;
            const endStr = document.getElementById('end-date').value;
            if(!startStr || !endStr) return alert("Pilih tanggal mulai dan akhir!");

            const btn = document.getElementById('btn-filter');
            btn.innerText = "MENYARING...";
            
            const start = new Date(startStr); start.setHours(0,0,0,0);
            const end = new Date(endStr); end.setHours(23,59,59,999);

            const filtered = allData.filter(i => {
                const d = new Date(i.Tanggal);
                return d >= start && d <= end;
            });

            document.getElementById('print-period-label').innerText = `Periode: ${start.toLocaleDateString('id-ID')} s/d ${end.toLocaleDateString('id-ID')}`;
            document.getElementById('view-label').innerText = "Hasil Filter Laporan";
            
            render(filtered);
            btn.innerText = "Terapkan Filter";
        }

        function render(data) {
            const list = document.getElementById('main-list');
            const table = document.getElementById('table-output');
            let total = 0;

            // Render Card (Mobile View)
            list.innerHTML = data.map(i => {
                total += Number(i.Jumlah);
                return `
                <div class="bg-white p-5 rounded-3xl shadow-sm border-l-8 ${i.Bukti_Foto === 'Tanpa Bukti' ? 'border-red-600' : 'border-gray-800'}">
                    <div class="flex justify-between text-[10px] text-gray-400 font-bold mb-1 uppercase">
                        <span>${i.Kapal}</span><span>${new Date(i.Tanggal).toLocaleDateString('id-ID')}</span>
                    </div>
                    <div class="flex justify-between items-center">
                        <p class="text-sm font-bold text-gray-700 uppercase">${i.Keterangan}</p>
                        <p class="text-sm font-black text-red-600">Rp${Number(i.Jumlah).toLocaleString('id-ID')}</p>
                    </div>
                    <div class="mt-2 text-[8px] text-gray-300 font-bold italic uppercase tracking-widest flex justify-between">
                        <span>Input: ${i.Admin}</span>
                        ${i.Bukti_Foto !== 'Tanpa Bukti' ? `<a href="${i.Bukti_Foto}" target="_blank" class="text-blue-400">LIHAT NOTA</a>` : ''}
                    </div>
                </div>`;
            }).join('');

            if(data.length === 0) list.innerHTML = '<p class="text-center text-xs text-gray-400">Tidak ada data ditemukan.</p>';

            // Render Tabel (Print View)
            let tHtml = `<table><thead><tr><th style="width:5%">No</th><th style="width:15%">Tanggal</th><th style="width:20%">Armada</th><th style="width:30%">Keterangan</th><th style="width:10%">Admin</th><th style="width:20%">Nominal</th></tr></thead><tbody>`;
            data.forEach((i, idx) => {
                tHtml += `<tr><td>${idx+1}</td><td>${new Date(i.Tanggal).toLocaleDateString('id-ID')}</td><td>${i.Kapal}</td><td>${i.Keterangan}</td><td>${i.Admin}</td><td class="text-right font-bold">Rp${Number(i.Jumlah).toLocaleString('id-ID')}</td></tr>`;
            });
            tHtml += `<tr><td colspan="5" class="text-right font-bold uppercase">Total Pengeluaran</td><td class="text-right font-bold" style="color:red">Rp${total.toLocaleString('id-ID')}</td></tr></tbody></table>`;
            table.innerHTML = tHtml;

            // Tambahkan tombol cetak di tampilan HP
            if(data.length > 0 && currentUser.level >= 2) {
                list.innerHTML += `<button onclick="window.print()" class="w-full bg-blue-600 text-white p-4 rounded-2xl font-bold shadow-lg mt-4 uppercase text-[10px] tracking-widest"><i class="fas fa-print mr-2"></i>Cetak Laporan Resmi (PDF)</button>`;
            }
        }

        async function saveData() {
            const ket = document.getElementById('f-ket').value;
            const jumlah = document.getElementById('f-jumlah').value;
            if(!ket || !jumlah) return alert("Keterangan & Nominal Wajib Diisi!");

            const btn = document.getElementById('btn-save');
            btn.innerText = "MENGIRIM..."; btn.disabled = true;

            const file = document.getElementById('f-file').files[0];
            let img = null, mime = null;
            if(file) {
                const reader = new FileReader();
                img = await new Promise(res => { reader.onload = () => res(reader.result.split(',')[1]); reader.readAsDataURL(file); });
                mime = file.type;
            }

            const payload = {
                kapal: document.getElementById('f-kapal').value,
                keterangan: ket,
                jumlah: jumlah,
                user: currentUser.nama,
                image: img,
                mimeType: mime
            };

            try {
                await fetch(API, { method: 'POST', body: JSON.stringify(payload) });
                alert("Data Berhasil Disimpan!");
                location.reload();
            } catch(e) {
                alert("Gagal mengirim data!");
                btn.innerText = "Kirim Data"; btn.disabled = false;
            }
        }

        function toggleFilterMenu() { document.getElementById('owner-menu').classList.toggle('hidden'); }
        function logout() { localStorage.clear(); location.reload(); }
        function openModal() { document.getElementById('modal').style.display = 'flex'; }
        function closeModal() { document.getElementById('modal').style.display = 'none'; }
    </script>
</body>
</html>
