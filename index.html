<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ACHI Premium - Owner Edition</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;800&display=swap" rel="stylesheet">
    <style>
        :root { --achi-red: #ff3131; --achi-green: #00ff88; --bg-black: #050505; }
        body { background-color: var(--bg-black); color: #fff; font-family: 'Plus Jakarta Sans', sans-serif; }
        .glass-card { background: rgba(20, 20, 20, 0.6); backdrop-filter: blur(15px); border: 1px solid rgba(255, 255, 255, 0.05); border-radius: 24px; }
        .btn-red { background: linear-gradient(135deg, #ff3131, #8b0000); border-radius: 16px; transition: 0.3s; }
        .input-premium { background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.1); border-radius: 16px; color: #fff; }
        .input-premium:focus { border-color: var(--achi-red); outline: none; }
        .nav-float { background: rgba(10,10,10,0.8); backdrop-filter: blur(10px); border: 1px solid rgba(255,255,255,0.05); border-radius: 24px; }
        .text-green { color: var(--achi-green); }
        .text-red { color: var(--achi-red); }
        @keyframes slideUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
        .animate-up { animation: slideUp 0.6s ease-out forwards; }
    </style>
</head>
<body class="antialiased overflow-x-hidden">

    <div id="loader" class="hidden fixed inset-0 flex items-center justify-center bg-black z-[999]">
        <div class="flex flex-col items-center">
            <div class="w-12 h-12 border-4 border-t-red-600 border-white/10 rounded-full animate-spin"></div>
            <p class="mt-4 text-[10px] tracking-[0.4em] text-zinc-500 font-bold uppercase">Memproses Data...</p>
        </div>
    </div>

    <section id="login-page" class="min-h-screen flex items-center justify-center p-6">
        <div class="w-full max-w-sm text-center">
            <img src="logo.png" class="w-28 mx-auto mb-12 drop-shadow-[0_0_20px_rgba(255,49,49,0.2)]">
            <div class="glass-card p-10 shadow-2xl">
                <h1 class="text-2xl font-extrabold tracking-tighter italic mb-8 uppercase tracking-[0.2em]">ACHI Login</h1>
                <div class="space-y-4">
                    <input type="text" id="username" placeholder="Username" class="w-full p-4 input-premium text-sm">
                    <input type="password" id="password" placeholder="Password" class="w-full p-4 input-premium text-sm">
                    <button onclick="handleLogin()" class="w-full p-4 btn-red text-white font-bold text-xs tracking-widest uppercase mt-4">Akses Masuk</button>
                </div>
                <p id="loginError" class="text-red-500 text-[10px] mt-6 hidden font-bold uppercase"></p>
            </div>
        </div>
    </section>

    <section id="main-dashboard" class="hidden min-h-screen pb-32">
        <header class="p-8 flex justify-between items-center">
            <div>
                <p id="welcomeGreeting" class="text-[10px] font-bold text-zinc-500 uppercase tracking-widest mb-1"></p>
                <h2 id="userDisplayName" class="text-xl font-extrabold text-white tracking-tight"></h2>
            </div>
            <img id="userPhoto" src="https://via.placeholder.com/100" class="w-14 h-14 rounded-2xl border-2 border-zinc-800 p-1">
        </header>

        <div class="px-8 space-y-6 animate-up">
            
            <div id="owner-finance" class="hidden grid grid-cols-1 gap-4">
                <div class="glass-card p-6 bg-gradient-to-br from-zinc-900 to-black">
                    <div class="flex justify-between items-center mb-2">
                        <span class="text-[10px] font-bold text-zinc-500 uppercase tracking-[0.2em]">Pemasukan Trip Ini</span>
                        <i class="fas fa-arrow-trend-up text-green text-lg"></i>
                    </div>
                    <h3 id="displayPemasukan" class="text-3xl font-black text-green tracking-tighter">Rp 0</h3>
                </div>
                <div class="glass-card p-6 bg-gradient-to-br from-zinc-900 to-black">
                    <div class="flex justify-between items-center mb-2">
                        <span class="text-[10px] font-bold text-zinc-500 uppercase tracking-[0.2em]">Pengeluaran Trip Ini</span>
                        <i class="fas fa-arrow-trend-down text-red text-lg"></i>
                    </div>
                    <h3 id="displayPengeluaran" class="text-3xl font-black text-red tracking-tighter">Rp 0</h3>
                </div>
            </div>

            <div id="crew-finance" class="grid grid-cols-2 gap-4">
                <div class="glass-card p-5">
                    <p class="text-[9px] font-bold text-zinc-500 uppercase">Saldo Upah</p>
                    <h3 id="displaySaldo" class="text-lg font-bold mt-1">Rp 0</h3>
                </div>
                <div class="glass-card p-5">
                    <p class="text-[9px] font-bold text-zinc-500 uppercase">Hutang</p>
                    <h3 id="displayHutang" class="text-lg font-bold text-red mt-1">Rp 0</h3>
                </div>
            </div>

            <div class="pt-4">
                <h3 class="text-[10px] font-extrabold text-zinc-500 uppercase tracking-[0.3em] mb-6">Menu Operasional</h3>
                <div class="grid grid-cols-4 gap-4">
                    <div class="flex flex-col items-center space-y-2"><div class="w-14 h-14 glass-card flex items-center justify-center"><i class="fas fa-ship text-red-500"></i></div><span class="text-[9px] font-bold text-zinc-500 uppercase">Armada</span></div>
                    <div class="flex flex-col items-center space-y-2"><div class="w-14 h-14 glass-card flex items-center justify-center"><i class="fas fa-file-signature text-red-500"></i></div><span class="text-[9px] font-bold text-zinc-500 uppercase">Anfrakan</span></div>
                    <div class="flex flex-col items-center space-y-2"><div class="w-14 h-14 glass-card flex items-center justify-center"><i class="fas fa-receipt text-red-500"></i></div><span class="text-[9px] font-bold text-zinc-500 uppercase">Log</span></div>
                    <div onclick="location.reload()" class="flex flex-col items-center space-y-2"><div class="w-14 h-14 glass-card flex items-center justify-center"><i class="fas fa-power-off text-zinc-700"></i></div><span class="text-[9px] font-bold text-zinc-500 uppercase">Logout</span></div>
                </div>
            </div>
        </div>

        <nav class="fixed bottom-6 left-6 right-6 h-20 nav-float flex justify-around items-center px-4 z-50">
            <i class="fas fa-home text-red-500 text-xl"></i>
            <i class="fas fa-chart-line text-zinc-600 text-xl"></i>
            <div class="w-14 h-14 btn-red flex items-center justify-center -mt-12 border-[6px] border-[#050505] text-white shadow-2xl shadow-red-600/20">
                <i class="fas fa-plus text-xl"></i>
            </div>
            <i class="fas fa-users text-zinc-600 text-xl"></i>
            <i class="fas fa-gear text-zinc-600 text-xl"></i>
        </nav>
    </section>

    <script>
        const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbypG1Pg3kTaQIc2HObIix3lt6O7nf0PiICenityDVzfIn6-Xp_jfS_Na-ydqZ-q_iCl/exec";
        const formatIDR = (val) => "Rp " + new Intl.NumberFormat('id-ID').format(val);

        async function handleLogin() {
            const user = document.getElementById('username').value.trim();
            const pass = document.getElementById('password').value.trim();
            const loader = document.getElementById('loader');
            
            if(!user || !pass) return;
            loader.classList.remove('hidden');

            try {
                const response = await fetch(`${WEB_APP_URL}?action=login`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                    body: JSON.stringify({ username: user, password: pass })
                });
                const result = await response.json();

                if(result.success) {
                    document.getElementById('login-page').classList.add('hidden');
                    document.getElementById('main-dashboard').classList.remove('hidden');
                    
                    let g = "Halo,";
                    let d = result.user.username;
                    let u = result.user.username.toUpperCase();

                    if(u === "ACHI" || u === "CHRISTY NOVALITA PRATIWI") {
                        g = "Selamat Datang Ibu CEO";
                        d = "Boss Achy";
                    } else if(u === "HENGKY") {
                        g = "Selamat Datang Bapak CEO";
                        d = "Pak CEO";
                    }

                    document.getElementById('welcomeGreeting').innerText = g;
                    document.getElementById('userDisplayName').innerText = d;
                    
                    if(result.user.role === 'Owner') {
                        document.getElementById('owner-finance').classList.remove('hidden');
                        document.getElementById('crew-finance').classList.add('hidden');
                        document.getElementById('displayPemasukan').innerText = formatIDR(result.stats.pemasukan);
                        document.getElementById('displayPengeluaran').innerText = formatIDR(result.stats.pengeluaran);
                    } else {
                        document.getElementById('displaySaldo').innerText = formatIDR(result.user.saldo);
                        document.getElementById('displayHutang').innerText = formatIDR(result.user.hutang);
                    }
                    
                    if(result.user.foto) document.getElementById('userPhoto').src = result.user.foto;
                } else {
                    alert(result.message);
                }
            } catch (e) {
                alert("Gangguan koneksi!");
            } finally {
                loader.classList.add('hidden');
            }
        }
    </script>
</body>
</html>
