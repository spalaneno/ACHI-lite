<script>
    const API = "https://script.google.com/macros/s/AKfycbxX89a-Lh-Y0Y10uU6mCxQxSgz-BmIrpOLdYv6B29F66kajAkARYHUxKq0tugdMpc2L/exec";
    let user = JSON.parse(localStorage.getItem('achi_user')) || null;
    let cachedData = null; // Menyimpan data di memori agar loading cepat
    let isDelegasiActive = false;
    let currentType = "";

    window.onload = () => { if(user) startApp(); };

    // FUNGSI LOGIN LEBIH CEPAT
    async function login() {
        const u = document.getElementById('u-name').value;
        const p = document.getElementById('u-pass').value;
        if(!u || !p) return;
        
        // Tampilkan loading saat klik
        document.querySelector('button[onclick="login()"]').innerText = "AUTHENTICATING...";
        
        try {
            const res = await fetch(`${API}?action=login&username=${u}&password=${p}`);
            const d = await res.json();
            if(d.status === 'success') {
                user = d; 
                localStorage.setItem('achi_user', JSON.stringify(d)); 
                startApp();
            } else {
                alert("User/Kode Salah!");
                document.querySelector('button[onclick="login()"]').innerText = "MASUK";
            }
        } catch(e) { alert("Koneksi Error"); }
    }

    function startApp() {
        document.getElementById('login-page').style.display = 'none';
        document.getElementById('app').classList.remove('hidden');
        document.getElementById('disp-name').innerText = user.nama;
        renderMenu();
        // Pre-fetch data di background tanpa mengganggu user
        backgroundSync();
    }

    // AMBIL DATA DI BACKGROUND
    async function backgroundSync() {
        try {
            const res = await fetch(`${API}?action=getData`);
            cachedData = await res.json();
        } catch(e) { console.log("Sync failed"); }
    }

    // PINDAH HALAMAN INSTAN (TIDAK MENUNGGU SERVER)
    function showView(v) {
        document.querySelectorAll('.view-section').forEach(s => s.classList.remove('active'));
        document.getElementById('view-' + v).classList.add('active');
        
        if(v === 'list') {
            // Tampilkan data dari cache dulu (INSTAN!)
            if(cachedData) {
                renderList(cachedData.transaksi);
            }
            // Tetap tarik data terbaru di background
            loadData();
        }
    }

    async function loadData() {
        const cont = document.getElementById('main-list');
        // Jika belum ada cache, tampilkan loading skeleton
        if(!cachedData) {
            cont.innerHTML = `<div class="p-10 text-center opacity-50 font-black italic">SINKRONISASI DATA...</div>`;
        }
        
        try {
            const res = await fetch(`${API}?action=getData`);
            cachedData = await res.json();
            renderList(cachedData.transaksi);
        } catch(e) { showMsg("Gagal refresh data"); }
    }

    function renderList(data) {
        const cont = document.getElementById('main-list');
        // Gunakan .reverse() dan .join() sekaligus untuk performa render
        cont.innerHTML = data.slice().reverse().map(i => renderCard(i)).join('');
    }

    // Tombol Update Status Langsung Memberikan Respon UI tanpa menunggu server selesai
    async function updateStatus(id, s) {
        showMsg("MEMPROSES...");
        // Kirim ke server
        await fetch(API, { method: 'POST', body: JSON.stringify({ action: 'changeStatus', id: id, statusBaru: s }) });
        loadData(); // Update data terbaru
    }

    function showMsg(t) {
        const toast = document.getElementById("toast");
        toast.innerText = t; toast.className = "show";
        setTimeout(() => { toast.className = ""; }, 2000);
    }

    function logout() { localStorage.clear(); location.reload(); }
</script>
