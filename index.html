<script>
        const API = "https://script.google.com/macros/s/AKfycbwiQ4jFiovkcE5vvArQZwqwJiMHDx-jUJMhvfj14S1nP_o_-pBcku_yLd6Xji40mTcL/exec"; 
        let currentUser = JSON.parse(localStorage.getItem('achi_session'));
        let allData = [];

        window.onload = () => { if(currentUser) showApp(currentUser); };

        async function login() {
            const user = document.getElementById('u-name').value.trim();
            const pass = document.getElementById('u-pass').value.trim();
            if(!user || !pass) return alert("Isi Username & Password!");
            const btn = document.getElementById('btn-login');
            btn.innerHTML = 'MEMPROSES...';
            try {
                const r = await fetch(`${API}?action=login&username=${encodeURIComponent(user)}&password=${encodeURIComponent(pass)}`);
                const d = await r.json();
                if(d.status === 'success') {
                    localStorage.setItem('achi_session', JSON.stringify(d));
                    currentUser = d;
                    showApp(d);
                } else { alert("Login Gagal!"); btn.innerHTML = "MASUK KE SISTEM"; }
            } catch (e) { alert("Error Koneksi!"); }
        }

        function showApp(data) {
            document.getElementById('login-page').style.display = 'none';
            document.getElementById('app').classList.remove('hidden');
            document.getElementById('user-display').innerText = data.nama;
            document.getElementById('print-admin-name').innerText = data.nama;
            if(data.level >= 2) {
                document.getElementById('owner-report').classList.remove('hidden');
                document.getElementById('btn-excel').classList.remove('hidden');
            }
            loadData();
        }

        async function loadData() {
            try {
                const r = await fetch(`${API}?action=getTransaksi`);
                const rawData = await r.json();
                // Filter awal untuk Level 1
                allData = (currentUser.level === 1) ? rawData.filter(i => i.Admin === currentUser.nama) : rawData;
                renderList(allData);
            } catch(e) { console.error("Gagal muat data"); }
        }

        function renderList(data) {
            const listContainer = document.getElementById('list');
            const tablePrint = document.getElementById('table-print');
            
            // Render Card untuk Tampilan HP
            listContainer.innerHTML = data.map(i => `
                <div class="bg-white p-5 rounded-3xl shadow-sm border-l-8 ${i.Bukti_Foto === 'Tanpa Bukti' ? 'border-red-600' : 'border-gray-800'}">
                    <div class="flex justify-between text-[10px] text-gray-400 mb-1 font-bold uppercase">
                        <span>${i.Kapal}</span><span>${new Date(i.Tanggal).toLocaleDateString('id-ID')}</span>
                    </div>
                    <div class="flex justify-between items-center">
                        <p class="text-sm font-bold uppercase text-gray-700">${i.Keterangan}</p>
                        <p class="text-sm font-black text-red-600">Rp${Number(i.Jumlah).toLocaleString()}</p>
                    </div>
                </div>
            `).join('');

            // Render Tabel untuk PDF (PENTING)
            let tableHTML = `<table>
                <thead>
                    <tr>
                        <th>TANGGAL</th>
                        <th>ARMADA</th>
                        <th>KETERANGAN</th>
                        <th>ADMIN</th>
                        <th>NOMINAL</th>
                    </tr>
                </thead>
                <tbody>`;
            
            let total = 0;
            data.forEach(i => {
                total += Number(i.Jumlah);
                // Format tanggal agar seragam di PDF
                const tglFormat = new Date(i.Tanggal).toLocaleDateString('id-ID', {day:'2-digit', month:'2-digit', year:'numeric'});
                tableHTML += `<tr>
                    <td>${tglFormat}</td>
                    <td>${i.Kapal}</td>
                    <td>${i.Keterangan}</td>
                    <td>${i.Admin}</td>
                    <td>Rp${Number(i.Jumlah).toLocaleString()}</td>
                </tr>`;
            });

            if(data.length === 0) {
                tableHTML += `<tr><td colspan="5" style="text-align:center">Data Tidak Ditemukan</td></tr>`;
            }

            tableHTML += `<tr>
                <td colspan="4" style="text-align:right; font-weight:bold">TOTAL</td>
                <td style="font-weight:bold; color:red">Rp${total.toLocaleString()}</td>
            </tr></tbody></table>`;
            
            tablePrint.innerHTML = tableHTML;
        }

        function applyFilter() {
            const startVal = document.getElementById('filter-start').value;
            const endVal = document.getElementById('filter-end').value;
            
            if(!startVal || !endVal) return alert("Pilih kedua tanggal!");

            // Buat objek tanggal dan reset jam ke 00:00:00 agar perbandingan akurat
            const startDate = new Date(startVal);
            startDate.setHours(0,0,0,0);
            
            const endDate = new Date(endVal);
            endDate.setHours(23,59,59,999); // Sampai akhir hari tersebut

            const filtered = allData.filter(i => {
                const itemDate = new Date(i.Tanggal);
                return itemDate >= startDate && itemDate <= endDate;
            });

            document.getElementById('print-period').innerText = `PERIODE: ${startDate.toLocaleDateString('id-ID')} - ${endDate.toLocaleDateString('id-ID')}`;
            
            // Update tampilan
            renderList(filtered);
            
            if(filtered.length === 0) {
                alert("Tidak ada data pada tanggal tersebut.");
            } else {
                alert("Berhasil memfilter " + filtered.length + " data.");
            }
        }

        async function kirim() {
            const btn = document.getElementById('btn-kirim');
            btn.innerHTML = 'MENGIRIM...'; btn.disabled = true;
            const file = document.getElementById('f-file').files[0];
            let img = null;
            if(file) {
                const reader = new FileReader();
                img = await new Promise(res => {
                    reader.onload = () => res(reader.result.split(',')[1]);
                    reader.readAsDataURL(file);
                });
            }
            const payload = {
                kapal: document.getElementById('f-kapal').value,
                keterangan: document.getElementById('f-ket').value,
                jumlah: document.getElementById('f-jumlah').value,
                alasan: document.getElementById('f-alasan').value,
                user: currentUser.nama, image: img, mimeType: file ? file.type : null
            };
            await fetch(API, { method: 'POST', body: JSON.stringify(payload) });
            alert("Tersimpan!"); location.reload();
        }

        function logout() { localStorage.removeItem('achi_session'); location.reload(); }
        function openModal() { document.getElementById('modal').style.display = 'flex'; }
        function closeModal() { document.getElementById('modal').style.display = 'none'; }
        function exportExcel() {
            const ws = XLSX.utils.json_to_sheet(allData);
            const wb = XLSX.utils.book_new();
            XLSX.utils.book_append_sheet(wb, ws, "Rekap");
            XLSX.writeFile(wb, "ACHI_REPORT.xlsx");
        }
    </script>
