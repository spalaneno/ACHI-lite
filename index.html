<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Sistem Kapal</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        .bca-blue { background-color: #004a99; }
        .bca-light { background-color: #f0f4f8; }
        .menu-card { background: white; border-radius: 15px; padding: 15px; text-align: center; box-shadow: 0 4px 6px rgba(0,0,0,0.05); }
    </style>
</head>
<body class="max-w-md mx-auto min-h-screen bg-gray-100 pb-20">

    <div id="login-page" class="p-10 pt-32 text-center">
        <h1 class="text-3xl font-bold text-[#004a99] italic mb-8">NABAWI APP</h1>
        <input id="email" type="email" placeholder="Email User" class="w-full p-4 rounded-xl border mb-4 outline-none">
        <button onclick="login()" class="w-full bca-blue text-white p-4 rounded-xl font-bold">LOGIN</button>
    </div>

    <div id="app" class="hidden">
        <div class="bca-blue p-6 rounded-b-[40px] text-white shadow-lg mb-6">
            <p class="text-xs opacity-70 italic">Selamat Datang,</p>
            <h2 id="user-display" class="text-xl font-bold italic">-</h2>
        </div>

        <div class="px-6 grid grid-cols-2 gap-4 mb-6">
            <div onclick="openModal()" class="menu-card border-b-4 border-blue-600 active:scale-95 transition">
                <i class="fas fa-file-invoice-dollar text-3xl text-blue-700 mb-2"></i>
                <p class="text-[10px] font-bold uppercase">Anfrakan</p>
            </div>
            <div id="btn-export" onclick="exportExcel()" class="menu-card border-b-4 border-green-600 active:scale-95 transition hidden">
                <i class="fas fa-file-excel text-3xl text-green-700 mb-2"></i>
                <p class="text-[10px] font-bold uppercase">Export Excel</p>
            </div>
        </div>

        <div id="history-section" class="px-6 hidden">
            <h3 class="font-bold text-gray-700 text-xs uppercase mb-4 tracking-widest">Riwayat Transaksi</h3>
            <div id="list" class="space-y-3"></div>
        </div>
    </div>

    <div id="modal" class="fixed inset-0 bg-black/60 hidden items-end z-50">
        <div class="bg-white w-full rounded-t-[30px] p-6 max-w-md">
            <h3 class="font-bold text-blue-900 mb-4 italic uppercase">Input Anfrakan</h3>
            <select id="f-kapal" class="w-full p-3 border rounded-xl mb-3 text-sm">
                <option>KM. Nabawi 09</option><option>KM. Lastika Star</option>
                <option>KM. Srikandi 01</option><option>Rakit 01</option>
            </select>
            <input id="f-ket" type="text" placeholder="Keterangan (Solar/Logistik)" class="w-full p-3 border rounded-xl mb-3 text-sm">
            <input id="f-jumlah" type="number" placeholder="Nominal (Rp)" class="w-full p-3 border rounded-xl mb-3 text-sm">
            
            <div class="p-3 bg-gray-50 rounded-xl mb-4 border border-dashed">
                <label class="text-[9px] font-bold block mb-1 uppercase">Lampiran Bukti</label>
                <input id="f-file" type="file" accept="image/*" class="text-xs mb-2">
                <textarea id="f-alasan" placeholder="Alasan jika tidak ada bukti..." class="w-full p-2 text-xs border rounded-lg h-16"></textarea>
            </div>

            <button onclick="kirim()" id="btn-kirim" class="w-full bca-blue text-white p-4 rounded-xl font-bold mb-2">SIMPAN</button>
            <button onclick="closeModal()" class="w-full text-gray-400 text-xs py-2">BATAL</button>
        </div>
    </div>

    <script>
        const API = "https://script.google.com/macros/s/AKfycbzPx51CZZhYa1HfwtRwmdo5zyMb91cLGE2xucPrfbFulL99bCiVfIPqwfZRzQfgilI/exec";
        let user = "";

        async function login() {
            const email = document.getElementById('email').value;
            const r = await fetch(`${API}?action=login&email=${email}`);
            const d = await r.json();
            if(d.status == 'success') {
                user = d.nama;
                document.getElementById('login-page').style.display='none';
                document.getElementById('app').classList.remove('hidden');
                document.getElementById('user-display').innerText = d.nama;
                if(d.level >= 2) {
                    document.getElementById('btn-export').classList.remove('hidden');
                    document.getElementById('history-section').classList.remove('hidden');
                    loadData();
                }
            } else { alert("User tidak ditemukan"); }
        }

        function openModal() { document.getElementById('modal').style.display='flex'; }
        function closeModal() { document.getElementById('modal').style.display='none'; }

        async function kirim() {
            const btn = document.getElementById('btn-kirim');
            btn.innerText = "Processing..."; btn.disabled = true;
            const file = document.getElementById('f-file').files[0];
            let img = null;
            if(file) {
                const reader = new FileReader();
                img = await new Promise(res => {
                    reader.onload = () => res(reader.result.split(',')[1]);
                    reader.readAsDataURL(file);
                });
            }
            const payload = {
                kapal: document.getElementById('f-kapal').value,
                kategori: "Anfrakan",
                keterangan: document.getElementById('f-ket').value,
                jumlah: document.getElementById('f-jumlah').value,
                alasan: document.getElementById('f-alasan').value,
                user: user, image: img, mimeType: file ? file.type : null
            };
            await fetch(API, {method:'POST', body: JSON.stringify(payload)});
            alert("Berhasil!"); location.reload();
        }

        async function loadData() {
            const r = await fetch(`${API}?action=getTransaksi`);
            const data = await r.json();
            document.getElementById('list').innerHTML = data.map(i => `
                <div class="bg-white p-4 rounded-xl shadow-sm border-l-4 ${i.Bukti_Foto == 'Tanpa Bukti' ? 'border-red-500' : 'border-blue-700'}">
                    <div class="flex justify-between text-[9px] text-gray-400 mb-1 font-bold italic">
                        <span>${i.Kapal}</span><span>${new Date(i.Tanggal).toLocaleDateString()}</span>
                    </div>
                    <div class="flex justify-between items-center">
                        <p class="text-sm font-bold uppercase">${i.Keterangan}</p>
                        <p class="text-sm font-bold text-red-600">-Rp ${Number(i.Jumlah).toLocaleString()}</p>
                    </div>
                    ${i.Bukti_Foto == 'Tanpa Bukti' ? `<p class="text-[9px] text-red-500 mt-1 italic font-bold">⚠️ Alasan: ${i.Alasan_Tanpa_Bukti}</p>` : `<a href="${i.Bukti_Foto}" target="_blank" class="text-[9px] text-blue-600 font-bold mt-2 inline-block italic underline">LIHAT BUKTI</a>`}
                </div>
            `).join('');
        }

        async function exportExcel() {
            const r = await fetch(`${API}?action=getTransaksi`);
            const data = await r.json();
            const ws = XLSX.utils.json_to_sheet(data);
            const wb = XLSX.utils.book_new();
            XLSX.utils.book_append_sheet(wb, ws, "Laporan");
            XLSX.writeFile(wb, `Laporan_Nabawi_${new Date().getTime()}.xlsx`);
        }
    </script>
</body>
</html>
