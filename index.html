<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ACHI SYSTEM</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        .achi-red { background-color: #e21e26; }
        .text-achi-red { color: #e21e26; }
        @media print { .no-print { display: none !important; } .print-only { display: block !important; } }
        .print-only { display: none; }
    </style>
</head>
<body class="max-w-md mx-auto bg-gray-50 min-h-screen pb-20">

    <div id="login-page" class="p-10 pt-32 text-center bg-white min-h-screen">
        <h1 class="text-6xl font-black text-achi-red italic mb-2">ACHI</h1>
        <p class="text-[10px] font-bold text-gray-300 tracking-[0.4em] mb-12 uppercase italic">Fleet Integration</p>
        <div class="space-y-4">
            <input id="u-name" type="text" placeholder="Username" class="w-full p-4 rounded-2xl border bg-gray-50 text-center outline-none focus:ring-2 ring-red-500">
            <input id="u-pass" type="password" placeholder="Password" class="w-full p-4 rounded-2xl border bg-gray-50 text-center outline-none focus:ring-2 ring-red-500">
            <button onclick="login()" id="btn-login" class="w-full achi-red text-white p-4 rounded-2xl font-bold uppercase shadow-xl hover:opacity-90 transition">Login</button>
            <p class="text-[9px] text-gray-400 mt-4 italic">Ketik "guest" (tanpa password) untuk akses tamu</p>
        </div>
    </div>

    <div id="app" class="hidden">
        <div class="achi-red p-6 rounded-b-[40px] text-white shadow-xl mb-6 no-print flex justify-between items-center">
            <div>
                <p id="user-display" class="text-xl font-bold italic">-</p>
                <p id="role-display" class="text-[9px] uppercase font-bold text-yellow-300 tracking-tighter"></p>
            </div>
            <button onclick="logout()" class="w-10 h-10 bg-white/20 rounded-full"><i class="fas fa-power-off"></i></button>
        </div>

        <div id="view-finance" class="hidden px-4">
            <div id="stats" class="grid grid-cols-3 gap-2 mb-6">
                <div class="bg-white p-3 rounded-2xl shadow-sm text-center border-b-4 border-blue-500">
                    <p class="text-[7px] font-bold text-gray-400 uppercase">Hari Ini</p>
                    <p id="sum-day" class="text-[9px] font-black">Rp0</p>
                </div>
                <div class="bg-white p-3 rounded-2xl shadow-sm text-center border-b-4 border-green-500">
                    <p class="text-[7px] font-bold text-gray-400 uppercase">Minggu Ini</p>
                    <p id="sum-week" class="text-[9px] font-black">Rp0</p>
                </div>
                <div class="bg-white p-3 rounded-2xl shadow-sm text-center border-b-4 border-red-500">
                    <p class="text-[7px] font-bold text-gray-400 uppercase">Bulan Ini</p>
                    <p id="sum-month" class="text-[9px] font-black">Rp0</p>
                </div>
            </div>

            <div class="no-print bg-white p-4 rounded-3xl mb-6 shadow-sm border space-y-2">
                <div class="grid grid-cols-2 gap-2">
                    <input type="date" id="start-date" class="p-2 border rounded-xl text-[10px] w-full bg-gray-50">
                    <input type="date" id="end-date" class="p-2 border rounded-xl text-[10px] w-full bg-gray-50">
                </div>
                <select id="filter-kapal" class="w-full p-2 border rounded-xl text-[10px] font-bold bg-gray-50">
                    <option value="SEMUA">-- SEMUA KAPAL --</option>
                    <option>KM. Nabawi 09</option><option>KM. Lastika Star</option><option>KM. Srikandi 01</option>
                </select>
                <button onclick="applyFilter()" class="w-full achi-red text-white py-2 rounded-xl text-[10px] font-bold uppercase">Terapkan Filter & Cari</button>
            </div>

            <div id="print-area">
                <div class="print-only text-center border-b-4 border-black pb-4 mb-6">
                    <h1 class="text-3xl font-black">PT. ACHI</h1>
                    <p class="text-xs font-bold uppercase">Laporan Pengeluaran Armada</p>
                    <p id="print-period" class="text-[10px] italic"></p>
                </div>
                <div id="main-list" class="space-y-3 no-print"></div>
                <div id="table-output" class="print-only"></div>
                <div id="sig" class="print-only mt-10 grid grid-cols-2 text-center text-[10pt]">
                    <div><p class="mb-20">Dibuat Oleh,</p><p id="p-admin" class="font-bold border-t border-black inline-block px-6 uppercase">-</p></div>
                    <div><p class="mb-20">Disetujui Oleh,</p><p class="font-bold border-t border-black inline-block px-6 uppercase">Hengky / Owner</p></div>
                </div>
            </div>
        </div>

        <div id="view-guest" class="hidden px-4 space-y-6">
            <div class="bg-white p-8 rounded-[40px] shadow-sm text-center border border-gray-100">
                <div class="w-24 h-24 bg-red-50 rounded-full mx-auto mb-4 flex items-center justify-center text-achi-red text-4xl shadow-inner"><i class="fas fa-user-shield"></i></div>
                <h2 id="owner-name" class="font-black text-2xl uppercase italic">-</h2>
                <p id="owner-pt" class="text-achi-red font-bold text-[10px] tracking-widest uppercase mb-4">-</p>
                <div class="grid grid-cols-2 gap-2 text-[9px] font-bold">
                    <div class="bg-gray-50 p-3 rounded-2xl">JABATAN:<br><span id="owner-job" class="text-gray-400">Owner</span></div>
                    <div class="bg-gray-50 p-3 rounded-2xl">LOKASI:<br><span id="owner-loc" class="text-gray-400">Manado</span></div>
                </div>
            </div>

            <div class="space-y-3">
                <h3 class="font-black text-gray-400 text-[10px] uppercase ml-2 tracking-widest"><i class="fas fa-anchor mr-1"></i> Daftar Awak Kapal</h3>
                <div id="awak-list" class="space-y-2"></div>
            </div>
        </div>

        <div class="fixed bottom-0 left-0 right-0 max-w-md mx-auto bg-white/90 backdrop-blur-md border-t p-4 flex justify-around items-center no-print z-50">
            <button onclick="location.reload()" class="text-gray-400 flex flex-col items-center">
                <i class="fas fa-home text-xl"></i><span class="text-[8px] font-bold mt-1 uppercase">Beranda</span>
            </button>
            <button id="btn-plus" onclick="openModal()" class="achi-red w-14 h-14 rounded-full text-white -mt-12 border-4 border-white shadow-xl flex items-center justify-center transition active:scale-90">
                <i class="fas fa-plus text-xl"></i>
            </button>
            <button onclick="window.print()" class="text-gray-400 flex flex-col items-center">
                <i class="fas fa-print text-xl"></i><span class="text-[8px] font-bold mt-1 uppercase">Cetak</span>
            </button>
        </div>
    </div>

    <div id="modal" class="fixed inset-0 bg-black/60 hidden items-end z-[100] no-print">
        <div class="bg-white w-full rounded-t-[40px] p-8 max-w-md animate-slide-up">
            <div class="flex justify-between items-center mb-6">
                <h3 class="font-black text-achi-red uppercase italic">Input Transaksi</h3>
                <button onclick="closeModal()" class="text-gray-300"><i class="fas fa-times text-xl"></i></button>
            </div>
            <div class="space-y-4">
                <select id="f-kapal" class="w-full p-4 bg-gray-50 border rounded-2xl text-sm font-bold">
                    <option>KM. Nabawi 09</option><option>KM. Lastika Star</option><option>KM. Srikandi 01</option>
                </select>
                <input id="f-ket" type="text" placeholder="Keterangan Pengeluaran" class="w-full p-4 border rounded-2xl text-sm outline-none">
                <input id="f-jumlah" type="number" placeholder="Nominal Rp" class="w-full p-4 border rounded-2xl text-sm font-bold">
                <button onclick="saveData()" id="btn-save" class="w-full achi-red text-white p-5 rounded-2xl font-bold uppercase shadow-xl transition active:scale-95">Kirim Data</button>
            </div>
        </div>
    </div>

    <script>
        // GANTI URL DI BAWAH INI
        const API = "https://script.google.com/macros/s/AKfycbzeEAaUpnzYRuF1WRm0AeKh6pReY4j8BsU4Mx2kaonZNvIkykFsBABWrP-MGMNE4Qoj/exec"; 
        
        let currentUser = JSON.parse(localStorage.getItem('achi_session'));
        let allData = [];

        window.onload = () => { if(currentUser) showApp(currentUser); };

        async function login() {
            const u = document.getElementById('u-name').value.trim();
            const p = document.getElementById('u-pass').value.trim();
            if(!u) return alert("Isi Username!");
            
            document.getElementById('btn-login').innerText = "PROSES...";
            try {
                const r = await fetch(`${API}?action=login&username=${u}&password=${p}`);
                const d = await r.json();
                if(d.status === 'success') {
                    localStorage.setItem('achi_session', JSON.stringify(d));
                    showApp(d);
                } else { alert("Login Gagal!"); document.getElementById('btn-login').innerText = "Login"; }
            } catch(e) { alert("Gagal koneksi ke server!"); document.getElementById('btn-login').innerText = "Login"; }
        }

        function showApp(d) {
            currentUser = d;
            document.getElementById('login-page').style.display = 'none';
            document.getElementById('app').classList.remove('hidden');
            document.getElementById('user-display').innerText = d.nama;
            document.getElementById('p-admin').innerText = d.nama;

            if(d.level === 0) { // GUEST
                document.getElementById('role-display').innerText = "GUEST ACCESS";
                document.getElementById('view-guest').classList.remove('hidden');
                document.getElementById('btn-plus').style.display = 'none';
                loadGuestData();
            } else { // ADMIN / OWNER
                document.getElementById('role-display').innerText = d.level === 3 ? "OWNER (DIREKSI)" : "OPERASIONAL STAFF";
                document.getElementById('view-finance').classList.remove('hidden');
                if(d.level === 3) document.getElementById('sig').style.display = 'none';
                loadInitialData();
            }
        }

        async function loadGuestData() {
            const r = await fetch(`${API}?action=getGuestData`);
            const d = await r.json();
            // Load Profil Owner
            document.getElementById('owner-name').innerText = d.owner.nama;
            document.getElementById('owner-pt').innerText = d.owner.pt;
            document.getElementById('owner-job').innerText = d.owner.jabatan;
            document.getElementById('owner-loc').innerText = d.owner.lokasi;
            // Load Awak
            document.getElementById('awak-list').innerHTML = d.awak.map(i => `
                <div class="bg-white p-4 rounded-2xl shadow-sm border flex justify-between items-center">
                    <div>
                        <p class="font-black text-xs uppercase">${i.nama}</p>
                        <p class="text-[9px] text-achi-red font-bold uppercase">${i.jabatan} - ${i.kapal}</p>
                    </div>
                    <span class="text-[8px] bg-green-100 text-green-600 px-3 py-1 rounded-full font-black uppercase">${i.status}</span>
                </div>
            `).join('');
        }

        async function loadInitialData() {
            const r = await fetch(`${API}?action=getTransaksi`);
            allData = await r.json();
            
            const todayStr = new Date().toLocaleDateString('id-ID');
            let filtered = allData.filter(i => new Date(i.Tanggal).toLocaleDateString('id-ID') == todayStr);
            if(currentUser.level === 1) filtered = filtered.filter(i => i.Admin === currentUser.nama);
            
            calculateStats(allData);
            render(filtered);
        }

        function calculateStats(data) {
            const now = new Date();
            const todayStr = now.toLocaleDateString('id-ID');
            const startWeek = new Date(now.setDate(now.getDate() - now.getDay()));
            const startMonth = new Date(now.getFullYear(), now.getMonth(), 1);

            let dSum = 0, wSum = 0, mSum = 0;
            data.forEach(i => {
                const iDate = new Date(i.Tanggal);
                const val = Number(i.Jumlah);
                if(iDate.toLocaleDateString('id-ID') == todayStr) dSum += val;
                if(iDate >= startWeek) wSum += val;
                if(iDate >= startMonth) mSum += val;
            });
            document.getElementById('sum-day').innerText = "Rp" + dSum.toLocaleString();
            document.getElementById('sum-week').innerText = "Rp" + wSum.toLocaleString();
            document.getElementById('sum-month').innerText = "Rp" + mSum.toLocaleString();
        }

        function render(data) {
            const list = document.getElementById('main-list');
            const table = document.getElementById('table-output');
            let total = 0;

            list.innerHTML = data.map(i => {
                total += Number(i.Jumlah);
                return `<div class="bg-white p-4 rounded-2xl shadow-sm border-l-4 border-gray-800">
                    <div class="flex justify-between text-[8px] text-gray-400 font-bold mb-1 uppercase"><span>${i.Kapal}</span><span>${new Date(i.Tanggal).toLocaleDateString('id-ID')}</span></div>
                    <div class="flex justify-between items-center"><p class="text-[11px] font-bold text-gray-700 uppercase">${i.Keterangan}</p><p class="text-[11px] font-black text-red-600">Rp${Number(i.Jumlah).toLocaleString()}</p></div>
                </div>`;
            }).join('') + `<div class="p-4 bg-gray-800 text-white rounded-2xl flex justify-between font-bold text-xs"><span>TOTAL</span><span>Rp${total.toLocaleString()}</span></div>`;

            let tHtml = `<table class="w-full"><thead><tr><th>No</th><th>Tanggal</th><th>Armada</th><th>Keterangan</th><th>Nominal</th></tr></thead><tbody>`;
            data.forEach((i, idx) => {
                tHtml += `<tr><td>${idx+1}</td><td>${new Date(i.Tanggal).toLocaleDateString('id-ID')}</td><td>${i.Kapal}</td><td>${i.Keterangan}</td><td align="right">Rp${Number(i.Jumlah).toLocaleString()}</td></tr>`;
            });
            tHtml += `<tr><td colspan="4" align="right"><b>TOTAL</b></td><td align="right"><b>Rp${total.toLocaleString()}</b></td></tr></tbody></table>`;
            table.innerHTML = tHtml;
        }

        async function applyFilter() {
            const s = new Date(document.getElementById('start-date').value);
            const e = new Date(document.getElementById('end-date').value);
            const k = document.getElementById('filter-kapal').value;
            if(!s || !e) return alert("Pilih Tanggal!");
            s.setHours(0,0,0,0); e.setHours(23,59,59,999);
            
            let filtered = allData.filter(i => {
                const d = new Date(i.Tanggal);
                return d >= s && d <= e && (k === "SEMUA" || i.Kapal === k) && (currentUser.level >= 2 || i.Admin === currentUser.nama);
            });
            document.getElementById('print-period').innerText = `PERIODE: ${s.toLocaleDateString('id-ID')} - ${e.toLocaleDateString('id-ID')} (${k})`;
            render(filtered);
        }

        async function saveData() {
            const btn = document.getElementById('btn-save'); btn.innerText = "KIRIM..."; btn.disabled = true;
            const payload = {
                kapal: document.getElementById('f-kapal').value, keterangan: document.getElementById('f-ket').value,
                jumlah: document.getElementById('f-jumlah').value, user: currentUser.nama
            };
            await fetch(API, { method: 'POST', body: JSON.stringify(payload) });
            alert("Tersimpan!"); location.reload();
        }

        function logout() { localStorage.clear(); location.reload(); }
        function openModal() { document.getElementById('modal').style.display = 'flex'; }
        function closeModal() { document.getElementById('modal').style.display = 'none'; }
    </script>
</body>
</html>
