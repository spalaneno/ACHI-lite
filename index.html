<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ACHI - Efendy Jaya Abadi</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        .achi-red { background-color: #e21e26; }
        body { background-color: #f3f4f6; font-family: 'Inter', sans-serif; overflow-x: hidden; }
        @media print {
            .no-print { display: none !important; }
            .print-only { display: block !important; }
            .kop-surat { text-align: center; border-bottom: 4px double black; padding-bottom: 10px; margin-bottom: 20px; }
            table { width: 100%; border-collapse: collapse; margin-top: 10px; }
            th, td { border: 1px solid black; padding: 5px; font-size: 9pt; text-align: left; }
        }
        .print-only { display: none; }
    </style>
</head>
<body class="max-w-md mx-auto min-h-screen pb-20">

    <div id="login-page" class="p-10 pt-20 text-center bg-white min-h-screen">
        <img src="logo.png" class="w-32 mx-auto mb-4">
        <h1 class="text-4xl font-black text-[#e21e26] italic leading-none">ACHI</h1>
        <p class="text-[8px] font-bold text-gray-400 tracking-[0.3em] uppercase mb-12 italic">Aplikasi Crewing & Handling Integrasi</p>
        <div class="space-y-3">
            <input id="u-name" type="text" placeholder="Username" class="w-full p-4 rounded-2xl border bg-gray-50 outline-none text-center">
            <input id="u-pass" type="password" placeholder="Password" class="w-full p-4 rounded-2xl border bg-gray-50 outline-none text-center">
            <button onclick="login()" id="btn-login" class="w-full achi-red text-white p-4 rounded-2xl font-bold uppercase shadow-lg">Masuk</button>
        </div>
    </div>

    <div id="app" class="hidden">
        <div class="achi-red p-6 rounded-b-[40px] text-white shadow-xl no-print">
            <div class="flex justify-between items-center">
                <div class="flex items-center gap-3">
                    <img src="logo.png" class="w-10 h-10 bg-white rounded-lg p-1">
                    <div>
                        <h2 id="disp-name" class="font-bold text-sm leading-none">-</h2>
                        <p id="disp-role" class="text-[8px] font-bold text-yellow-300 uppercase mt-1"></p>
                    </div>
                </div>
                <button onclick="logout()" class="p-2 bg-white/10 rounded-full"><i class="fas fa-power-off text-xs"></i></button>
            </div>
        </div>

        <div class="px-4 mt-4">
            <div id="owner-stats" class="hidden grid grid-cols-3 gap-2 mb-6">
                <div class="bg-gray-900 p-3 rounded-2xl text-white text-center">
                    <p class="text-[7px] text-gray-400 uppercase">Harian</p>
                    <p id="stat-day" class="text-[10px] font-black">Rp0</p>
                </div>
                <div class="bg-gray-900 p-3 rounded-2xl text-white text-center border-x border-gray-700">
                    <p class="text-[7px] text-gray-400 uppercase">Mingguan</p>
                    <p id="stat-week" class="text-[10px] font-black">Rp0</p>
                </div>
                <div class="bg-gray-900 p-3 rounded-2xl text-white text-center">
                    <p class="text-[7px] text-gray-400 uppercase">Bulanan</p>
                    <p id="stat-month" class="text-[10px] font-black">Rp0</p>
                </div>
            </div>

            <div id="section-awak" class="mb-6">
                <h3 class="text-[10px] font-black text-gray-400 uppercase mb-3 tracking-widest italic">Informasi Saldo & Panjar</h3>
                <div id="list-awak" class="space-y-2"></div>
            </div>

            <div id="section-trans" class="no-print pb-10">
                <h3 class="text-[10px] font-black text-gray-400 uppercase mb-3 tracking-widest italic">Monitoring Anfrakan</h3>
                <div id="list-trans" class="space-y-3"></div>
            </div>
        </div>

        <div class="print-only" id="print-area">
            <div class="kop-surat">
                <h1 class="text-2xl font-black uppercase">Efendy Jaya Abadi</h1>
                <p class="text-[9px] font-bold tracking-[0.2em]">Laporan Operasional ACHI</p>
            </div>
            <div id="table-out"></div>
            <div id="sig-area" class="mt-10 grid grid-cols-2 text-center text-[10pt]">
                <div><p class="mb-16">Dibuat Oleh,</p><p id="sig-user" class="font-bold border-t border-black inline-block px-6 uppercase">-</p></div>
                <div><p class="mb-16">Disetujui Oleh,</p><p class="font-bold border-t border-black inline-block px-6 uppercase font-black">Hengky / Owner</p></div>
            </div>
        </div>

        <div class="fixed bottom-0 left-0 right-0 max-w-md mx-auto bg-white border-t p-3 flex justify-around no-print shadow-2xl items-center">
            <button onclick="location.reload()" class="text-gray-400 flex flex-col items-center"><i class="fas fa-home text-lg"></i><span class="text-[7px] font-bold mt-1">BERANDA</span></button>
            <button id="btn-add" onclick="openModal()" class="achi-red w-12 h-12 rounded-full text-white -mt-10 border-4 border-white shadow-lg flex items-center justify-center"><i class="fas fa-plus"></i></button>
            <button onclick="window.print()" class="text-gray-400 flex flex-col items-center"><i class="fas fa-print text-lg"></i><span class="text-[7px] font-bold mt-1">CETAK</span></button>
        </div>
    </div>

    <div id="modal" class="fixed inset-0 bg-black/60 hidden items-end z-[100] no-print">
        <div class="bg-white w-full rounded-t-[40px] p-8 animate-slide-up">
            <div class="flex justify-between items-center mb-6">
                <h3 class="font-black text-[#e21e26] uppercase italic">Form Input</h3>
                <button onclick="closeModal()" class="text-gray-300 text-xl"><i class="fas fa-times"></i></button>
            </div>
            <div class="space-y-4">
                <select id="f-tipe" class="w-full p-4 bg-gray-50 border rounded-2xl text-sm font-bold">
                    <option value="Anfrakan Kapal">Anfrakan Kapal</option>
                    <option value="Pembelian Darat">Pembelian Darat (Kantor)</option>
                </select>
                <select id="f-cat" class="w-full p-4 bg-gray-50 border rounded-2xl text-sm">
                    <option>Dapur</option><option>Mesin</option><option>Operasional</option><option>Lainnya</option>
                </select>
                <input id="f-ket" type="text" placeholder="Nama Barang / Keperluan" class="w-full p-4 border rounded-2xl text-sm bg-gray-50 outline-none">
                <input id="f-alasan" type="text" placeholder="Alasan Pengajuan" class="w-full p-4 border rounded-2xl text-sm bg-gray-50 outline-none">
                <input id="f-jumlah" type="number" placeholder="Nominal Rp" class="w-full p-4 border rounded-2xl text-sm font-bold bg-gray-50 outline-none">
                <button onclick="sendData()" id="btn-send" class="w-full achi-red text-white p-5 rounded-2xl font-bold uppercase shadow-xl">Kirim Sekarang</button>
            </div>
        </div>
    </div>

    <script>
        const API = "https://script.google.com/macros/s/AKfycbys4Sb8gzQbyAQVSkFDJdNWMC9Kj8k4GxnNppJcNeSneLuUlgXjquDh2KYbypc11HYm/exec";
        let user = null;

        async function login() {
            const u = document.getElementById('u-name').value;
            const p = document.getElementById('u-pass').value;
            const res = await fetch(`${API}?action=login&username=${u}&password=${p}`);
            const d = await res.json();
            if(d.status === 'success') {
                user = d;
                document.getElementById('login-page').style.display = 'none';
                document.getElementById('app').classList.remove('hidden');
                init();
            } else alert("Gagal Login!");
        }

        function init() {
            document.getElementById('disp-name').innerText = user.nama;
            document.getElementById('disp-role').innerText = user.jabatan || "Guest";
            if(user.level <= 3) document.getElementById('owner-stats').classList.remove('hidden');
            if(user.level === 1) document.getElementById('sig-area').style.display = 'none';
            document.getElementById('sig-user').innerText = user.nama;
            load();
        }

        async function load() {
            const res = await fetch(`${API}?action=getData&level=${user.level}&kapal=${user.kapal}&jabatan=${user.jabatan}&nama=${user.nama}`);
            const data = await res.json();
            renderAwak(data.awak);
            renderTrans(data.transaksi);
        }

        function renderAwak(data) {
            const cont = document.getElementById('list-awak');
            cont.innerHTML = data.map(i => `
                <div class="bg-white p-4 rounded-2xl border border-gray-100 shadow-sm">
                    <div class="flex justify-between items-start mb-2">
                        <p class="text-[10px] font-black uppercase">${i[0]} <br><span class="text-[8px] text-red-600 font-bold">${i[1]}</span></p>
                        <span class="text-[7px] bg-green-100 text-green-600 px-2 py-0.5 rounded-full font-bold uppercase">${i[6]}</span>
                    </div>
                    <div class="grid grid-cols-3 gap-2 border-t pt-2 text-center">
                        <div><p class="text-[7px] text-gray-400">GAJI</p><p class="text-[9px] font-bold">Rp${Number(i[3]).toLocaleString()}</p></div>
                        <div><p class="text-[7px] text-red-400 font-bold">PANJAR</p><p class="text-[9px] font-bold text-red-600">Rp${Number(i[4]).toLocaleString()}</p></div>
                        <div class="text-right"><p class="text-[7px] text-blue-500 font-bold uppercase tracking-tighter">SISA SALDO</p><p class="text-[10px] font-black text-blue-700">Rp${Number(i[5]).toLocaleString()}</p></div>
                    </div>
                </div>
            `).join('');
        }

        function renderTrans(data) {
            const listCont = document.getElementById('list-trans');
            const tableCont = document.getElementById('table-out');
            let total = 0;

            listCont.innerHTML = data.map(i => {
                total += Number(i[6]);
                return `<div class="bg-white p-4 rounded-2xl border-l-4 border-red-600 shadow-sm mb-3">
                    <div class="flex justify-between text-[7px] font-bold text-gray-400 uppercase"><span>${i[2]}</span><span>${i[8]}</span></div>
                    <p class="text-xs font-bold mt-1 uppercase">${i[5]}</p>
                    <p class="text-[9px] text-gray-400 italic">${i[9]}</p>
                    <div class="flex justify-between items-end mt-2"><span class="text-[8px] bg-gray-100 px-2 py-0.5 rounded font-bold">${i[3]}</span><span class="text-xs font-black">Rp${Number(i[6]).toLocaleString()}</span></div>
                </div>`;
            }).join('');

            let t = `<table><thead><tr><th>No</th><th>Tanggal</th><th>Kapal</th><th>Keterangan</th><th>Status</th><th>Jumlah</th></tr></thead><tbody>`;
            data.forEach((i, x) => t += `<tr><td>${x+1}</td><td>${new Date(i[1]).toLocaleDateString()}</td><td>${i[2]}</td><td>${i[5]}</td><td>${i[8]}</td><td align="right">Rp${Number(i[6]).toLocaleString()}</td></tr>`);
            tableCont.innerHTML = t + `<tr><td colspan="5" align="right"><b>TOTAL</b></td><td align="right"><b>Rp${total.toLocaleString()}</b></td></tr></tbody></table>`;
        }

        async function sendData() {
            const btn = document.getElementById('btn-send');
            btn.innerText = "MENGIRIM..."; btn.disabled = true;
            const payload = {
                tipe: document.getElementById('f-tipe').value, kategori: document.getElementById('f-cat').value,
                keterangan: document.getElementById('f-ket').value, alasan: document.getElementById('f-alasan').value,
                jumlah: document.getElementById('f-jumlah').value, pemohon: user.nama, kapal: user.kapal
            };
            await fetch(API, { method: 'POST', body: JSON.stringify(payload) });
            location.reload();
        }

        function logout() { localStorage.clear(); location.reload(); }
        function openModal() { document.getElementById('modal').style.display = 'flex'; }
        function closeModal() { document.getElementById('modal').style.display = 'none'; }
    </script>
</body>
</html>
