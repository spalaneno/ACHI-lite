<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ACHI - Sistem Integrasi Armada</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        .achi-red { background-color: #e21e26; }
        .text-achi-red { color: #e21e26; }
        body { background-color: #f3f4f6; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        
        /* Cetak PDF Profesional */
        @media print {
            @page { size: portrait; margin: 1cm; }
            body * { visibility: hidden; }
            #print-area, #print-area * { visibility: visible; }
            #print-area { position: absolute; left: 0; top: 0; width: 100%; display: block !important; }
            .no-print { display: none !important; }
            table { width: 100%; border-collapse: collapse; margin-top: 20px; }
            th, td { border: 1px solid #000; padding: 8px; text-align: left; font-size: 9pt; }
            th { background-color: #f2f2f2 !important; font-weight: bold; }
        }
        .print-only { display: none; }
    </style>
</head>
<body class="max-w-md mx-auto min-h-screen pb-24">

    <div id="login-page" class="p-10 pt-20 text-center bg-white min-h-screen flex flex-col justify-center animate-fade-in">
        <div class="mb-10">
            <h1 class="text-4xl font-black text-achi-red italic tracking-tighter">ACHI</h1>
            <p class="text-[10px] font-bold text-gray-400 uppercase tracking-[0.3em] mt-2">Crewing & Handling Integrasi</p>
        </div>
        
        <div class="space-y-4">
            <div class="relative">
                <i class="fas fa-user absolute left-4 top-4 text-gray-300"></i>
                <input id="u-name" type="text" placeholder="Username" class="w-full p-4 pl-12 rounded-2xl border border-gray-200 outline-none focus:border-red-500 transition bg-gray-50">
            </div>
            <div class="relative">
                <i class="fas fa-lock absolute left-4 top-4 text-gray-300"></i>
                <input id="u-pass" type="password" placeholder="Password" class="w-full p-4 pl-12 rounded-2xl border border-gray-200 outline-none focus:border-red-500 transition bg-gray-50">
            </div>
            <button onclick="login()" id="btn-login" class="w-full achi-red text-white p-4 rounded-2xl font-black shadow-lg uppercase tracking-widest active:scale-95 transition">MASUK KE SISTEM</button>
        </div>
        <p class="text-[9px] text-gray-400 mt-10 uppercase font-bold italic">Versi Terintegrasi 2024.1</p>
    </div>

    <div id="app" class="hidden">
        <div class="achi-red p-6 rounded-b-[40px] text-white shadow-xl mb-6 no-print">
            <div class="flex justify-between items-center">
                <div>
                    <p id="user-display" class="text-xl font-bold italic">Memuat...</p>
                    <p id="role-display" class="text-[9px] opacity-80 uppercase tracking-widest font-bold text-yellow-300 italic"></p>
                </div>
                <button onclick="logout()" class="bg-white/20 p-2 px-4 rounded-xl text-[10px] font-bold border border-white/30 uppercase">Logout</button>
            </div>
        </div>

        <div id="owner-report" class="px-6 mb-6 hidden no-print">
            <div class="bg-white p-5 rounded-3xl shadow-sm border border-gray-100 text-center">
                <h3 class="text-[10px] font-bold text-gray-400 uppercase mb-4 tracking-widest border-b pb-2">Filter Laporan</h3>
                <div class="grid grid-cols-2 gap-3 mb-4">
                    <input type="date" id="filter-start" class="w-full p-2 bg-gray-50 border rounded-lg text-xs outline-none">
                    <input type="date" id="filter-end" class="w-full p-2 bg-gray-50 border rounded-lg text-xs outline-none">
                </div>
                <div class="grid grid-cols-2 gap-2">
                    <button onclick="applyFilter()" class="achi-red text-white py-3 rounded-xl text-[10px] font-bold uppercase shadow-md">Filter</button>
                    <button onclick="window.print()" class="bg-gray-800 text-white py-3 rounded-xl text-[10px] font-bold uppercase shadow-md">Cetak PDF</button>
                </div>
            </div>
        </div>

        <div class="px-6 grid grid-cols-2 gap-4 mb-6 no-print">
            <button onclick="openModal()" class="bg-white p-6 rounded-3xl shadow-md border-b-4 border-gray-800 flex flex-col items-center active:scale-95 transition">
                <i class="fas fa-plus-circle text-2xl text-achi-red mb-1"></i>
                <span class="text-[10px] font-bold uppercase">Input Data</span>
            </button>
            <button id="btn-excel" onclick="exportExcel()" class="bg-white p-6 rounded-3xl shadow-md border-b-4 border-green-700 flex flex-col items-center hidden active:scale-95 transition">
                <i class="fas fa-file-excel text-2xl text-green-700 mb-1"></i>
                <span class="text-[10px] font-bold uppercase">Export Excel</span>
            </button>
        </div>

        <div id="print-area" class="px-6">
            <div class="print-only text-center mb-10 border-b-2 border-black pb-4">
                <h1 class="text-3xl font-black text-red-600 italic leading-none">ACHI</h1>
                <p class="text-[10px] font-bold uppercase tracking-[0.4em] mt-1">Laporan Pengeluaran Armada</p>
                <p id="print-period" class="text-[10px] mt-3 font-bold text-gray-600 uppercase"></p>
            </div>

            <h3 id="history-title" class="font-bold text-gray-800 text-[11px] uppercase mb-4 tracking-widest flex items-center no-print">
                <span class="w-2 h-4 achi-red mr-2 rounded-full"></span> Riwayat Transaksi
            </h3>
            
            <div id="list" class="space-y-4 no-print"></div>
            <div id="table-print" class="print-only"></div>

            <div class="print-only mt-16 grid grid-cols-2 gap-10 text-center">
                <div>
                    <p class="text-[10px] font-bold uppercase mb-24 italic">Dibuat Oleh,</p>
                    <p id="print-admin-name" class="text-[10px] font-bold border-t border-black pt-1 inline-block px-10 uppercase">-</p>
                </div>
                <div>
                    <p class="text-[10px] font-bold uppercase mb-24 italic">Disetujui Oleh,</p>
                    <p class="text-[10px] font-bold border-t border-black pt-1 inline-block px-10 uppercase">Hengky / Owner</p>
                </div>
            </div>
        </div>
    </div>

    <div id="modal" class="fixed inset-0 bg-black/80 hidden items-end z-50 no-print">
        <div class="bg-white w-full rounded-t-[40px] p-8 max-w-md shadow-2xl animate-slide-up">
            <div class="flex justify-between items-center mb-6 border-b pb-4">
                <h3 class="font-bold text-achi-red italic uppercase tracking-widest">Input Laporan</h3>
                <button onclick="closeModal()" class="text-gray-400"><i class="fas fa-times"></i></button>
            </div>
            <div class="space-y-4">
                <select id="f-kapal" class="w-full p-4 bg-gray-50 border border-gray-100 rounded-2xl text-sm font-bold">
                    <option>KM. Nabawi 09</option><option>KM. Lastika Star</option>
                    <option>KM. Srikandi 01</option><option>Rakit 01</option>
                </select>
                <input id="f-ket" type="text" placeholder="Keterangan Pengeluaran" class="w-full p-4 bg-gray-50 border border-gray-100 rounded-2xl text-sm outline-none">
                <input id="f-jumlah" type="number" placeholder="Nominal Rp" class="w-full p-4 bg-gray-50 border border-gray-100 rounded-2xl text-sm font-bold text-achi-red outline-none">
                <div class="p-4 bg-gray-50 rounded-2xl border-2 border-dashed border-gray-200">
                    <p class="text-[9px] font-bold text-gray-400 mb-2 uppercase">Unggah Bukti Nota (Jika Ada)</p>
                    <input id="f-file" type="file" accept="image/*" class="text-[10px] w-full">
                    <textarea id="f-alasan" placeholder="Alasan jika tanpa nota..." class="w-full p-3 text-xs border border-gray-100 rounded-xl h-20 mt-3 outline-none"></textarea>
                </div>
                <button onclick="kirim()" id="btn-kirim" class="w-full achi-red text-white p-5 rounded-2xl font-bold uppercase shadow-xl active:scale-95 transition tracking-widest">KIRIM LAPORAN</button>
            </div>
        </div>
    </div>

    <script>
        const API = "https://script.google.com/macros/s/AKfycbwiQ4jFiovkcE5vvArQZwqwJiMHDx-jUJMhvfj14S1nP_o_-pBcku_yLd6Xji40mTcL/exec"; 
        let currentUser = JSON.parse(localStorage.getItem('achi_session'));
        let allData = [];

        // Proteksi: Jika sudah login, langsung tampil app
        window.onload = () => { if(currentUser) showApp(currentUser); };

        async function login() {
            const user = document.getElementById('u-name').value.trim();
            const pass = document.getElementById('u-pass').value.trim();
            if(!user || !pass) return alert("Silakan masukkan Username dan Password!");

            const btn = document.getElementById('btn-login');
            btn.innerHTML = '<i class="fas fa-circle-notch fa-spin"></i> MEMPROSES...';
            btn.disabled = true;

            try {
                const r = await fetch(`${API}?action=login&username=${encodeURIComponent(user)}&password=${encodeURIComponent(pass)}`);
                const d = await r.json();
                
                if(d.status === 'success') {
                    localStorage.setItem('achi_session', JSON.stringify(d));
                    currentUser = d;
                    showApp(d);
                } else {
                    alert("Gagal Masuk: Username atau Password salah!");
                    btn.innerHTML = "MASUK KE SISTEM";
                    btn.disabled = false;
                }
            } catch (e) {
                alert("Kesalahan Jaringan: Pastikan internet aktif!");
                btn.innerHTML = "MASUK KE SISTEM";
                btn.disabled = false;
            }
        }

        function showApp(data) {
            document.getElementById('login-page').style.display = 'none';
            document.getElementById('app').classList.remove('hidden');
            document.getElementById('user-display').innerText = data.nama;
            document.getElementById('print-admin-name').innerText = data.nama;
            
            const roleEl = document.getElementById('role-display');
            if(data.level === 1) {
                roleEl.innerText = "Admin Operasional";
            } else if(data.level === 2) {
                roleEl.innerText = "Accounting (OD)";
                document.getElementById('owner-report').classList.remove('hidden');
                document.getElementById('btn-excel').classList.remove('hidden');
            } else {
                roleEl.innerText = "Owner PT. ACHI";
                document.getElementById('owner-report').classList.remove('hidden');
                document.getElementById('btn-excel').classList.remove('hidden');
            }
            loadData();
        }

        async function loadData() {
            try {
                const r = await fetch(`${API}?action=getTransaksi`);
                const rawData = await r.json();
                // Filter level 1: Hanya data milik sendiri
                allData = (currentUser.level === 1) ? rawData.filter(i => i.Admin === currentUser.nama) : rawData;
                renderList(allData);
            } catch(e) { console.error("Gagal muat data"); }
        }

        function renderList(data) {
            const listContainer = document.getElementById('list');
            const tablePrint = document.getElementById('table-print');
            
            listContainer.innerHTML = data.map(i => `
                <div class="bg-white p-5 rounded-3xl shadow-sm border-l-8 ${i.Bukti_Foto === 'Tanpa Bukti' ? 'border-red-600' : 'border-gray-800'}">
                    <div class="flex justify-between text-[10px] text-gray-400 mb-1 font-bold">
                        <span>${i.Kapal}</span><span>${new Date(i.Tanggal).toLocaleDateString('id-ID')}</span>
                    </div>
                    <div class="flex justify-between items-center">
                        <p class="text-sm font-bold uppercase text-gray-700 leading-tight">${i.Keterangan}</p>
                        <p class="text-sm font-black text-red-600">Rp${Number(i.Jumlah).toLocaleString()}</p>
                    </div>
                    <div class="mt-3 pt-2 border-t border-gray-50 flex justify-between items-center">
                        <span class="text-[8px] font-bold text-gray-300 uppercase italic">Oleh: ${i.Admin}</span>
                        ${i.Bukti_Foto !== 'Tanpa Bukti' ? `<a href="${i.Bukti_Foto}" target="_blank" class="text-[9px] font-bold text-blue-500 uppercase italic"><i class="fas fa-image mr-1"></i>Lihat Nota</a>` : ''}
                    </div>
                </div>
            `).join('');

            let tableHTML = `<table><thead><tr><th>Tgl</th><th>Armada</th><th>Keterangan</th><th>Admin</th><th>Nominal</th></tr></thead><tbody>`;
            let total = 0;
            data.forEach(i => {
                total += Number(i.Jumlah);
                tableHTML += `<tr>
                    <td>${new Date(i.Tanggal).toLocaleDateString('id-ID')}</td>
                    <td>${i.Kapal}</td>
                    <td>${i.Keterangan}</td>
                    <td>${i.Admin}</td>
                    <td>Rp${Number(i.Jumlah).toLocaleString()}</td>
                </tr>`;
            });
            tableHTML += `<tr><td colspan="4" style="text-align:right; font-weight:bold">TOTAL KESELURUHAN</td><td style="font-weight:bold; color:red">Rp${total.toLocaleString()}</td></tr></tbody></table>`;
            tablePrint.innerHTML = tableHTML;
        }

        function applyFilter() {
            const start = document.getElementById('filter-start').value;
            const end = document.getElementById('filter-end').value;
            if(!start || !end) return alert("Pilih tanggal mulai dan akhir!");
            
            const filtered = allData.filter(i => {
                const d = new Date(i.Tanggal); d.setHours(0,0,0,0);
                return d >= new Date(start) && d <= new Date(end);
            });
            
            document.getElementById('print-period').innerText = `PERIODE: ${new Date(start).toLocaleDateString('id-ID')} - ${new Date(end).toLocaleDateString('id-ID')}`;
            renderList(filtered);
        }

        async function kirim() {
            const ket = document.getElementById('f-ket').value;
            const jumlah = document.getElementById('f-jumlah').value;
            if(!ket || !jumlah) return alert("Keterangan dan Jumlah wajib diisi!");

            const btn = document.getElementById('btn-kirim');
            btn.innerHTML = '<i class="fas fa-sync fa-spin"></i> MENGIRIM...';
            btn.disabled = true;

            const file = document.getElementById('f-file').files[0];
            let img = null;
            if(file) {
                const reader = new FileReader();
                img = await new Promise(res => {
                    reader.onload = () => res(reader.result.split(',')[1]);
                    reader.readAsDataURL(file);
                });
            }

            const payload = {
                kapal: document.getElementById('f-kapal').value,
                keterangan: ket,
                jumlah: jumlah,
                alasan: document.getElementById('f-alasan').value,
                user: currentUser.nama, image: img, mimeType: file ? file.type : null
            };

            await fetch(API, { method: 'POST', body: JSON.stringify(payload) });
            alert("Data Berhasil Tersimpan!");
            location.reload();
        }

        function logout() { localStorage.removeItem('achi_session'); location.reload(); }
        function openModal() { document.getElementById('modal').style.display = 'flex'; }
        function closeModal() { document.getElementById('modal').style.display = 'none'; }
        
        function exportExcel() {
            const ws = XLSX.utils.json_to_sheet(allData);
            const wb = XLSX.utils.book_new();
            XLSX.utils.book_append_sheet(wb, ws, "Laporan_ACHI");
            XLSX.writeFile(wb, `ACHI_REPORT_${new Date().getTime()}.xlsx`);
        }
    </script>
</body>
</html>
