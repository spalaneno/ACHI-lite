<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ACHI - Premium System</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;800&display=swap" rel="stylesheet">
    <style>
        :root { --achi-red: #ff3131; --bg-black: #050505; }
        body { background-color: var(--bg-black); color: #fff; font-family: 'Plus Jakarta Sans', sans-serif; overflow-x: hidden; }
        .glass-card { background: rgba(255, 255, 255, 0.03); backdrop-filter: blur(15px); border: 1px solid rgba(255, 255, 255, 0.08); border-radius: 28px; }
        .input-premium { background: rgba(255,255,255,0.02); border: 1px solid rgba(255,255,255,0.1); border-radius: 16px; color: white; outline: none; padding: 1.2rem; width: 100%; transition: 0.3s; font-size: 14px; }
        .btn-red { background: linear-gradient(135deg, #ff3131, #8b0000); border-radius: 16px; padding: 1.2rem; font-weight: 800; text-transform: uppercase; letter-spacing: 0.2em; width: 100%; transition: 0.3s; cursor: pointer; border: none; color: white; }
        .nav-box { background: rgba(255,255,255,0.02); border: 1px solid rgba(255,255,255,0.05); border-radius: 24px; padding: 25px 10px; text-align: center; display: flex; flex-direction: column; align-items: center; gap: 12px; transition: 0.4s; cursor: pointer; }
        .hidden { display: none !important; }
        #loader { transition: opacity 0.5s; }
    </style>
</head>
<body>
    <div id="loader" class="fixed inset-0 flex items-center justify-center bg-black z-[999]">
        <div class="flex flex-col items-center">
            <div class="w-12 h-12 border-4 border-t-red-600 border-white/10 rounded-full animate-spin"></div>
            <p class="mt-4 text-[10px] tracking-[0.4em] text-zinc-500 font-bold uppercase italic">ACHI Secure Sync...</p>
        </div>
    </div>

    <div id="app-container">
        <section id="login-page" class="hidden min-h-screen flex items-center justify-center p-8">
            <div class="w-full max-w-sm">
                <div class="text-center mb-12">
                    <h1 class="text-4xl font-black italic text-red-600 tracking-tighter">ACHI</h1>
                </div>
                <div class="glass-card p-10 shadow-2xl">
                    <div class="space-y-4">
                        <input type="text" id="username" placeholder="Username" class="input-premium">
                        <input type="password" id="password" placeholder="Password" class="input-premium">
                        <button onclick="handleLogin()" id="loginBtn" class="btn-red mt-4">MASUK</button>
                    </div>
                </div>
                <button onclick="window.forceLogout()" class="w-full mt-8 text-[10px] text-zinc-600 font-bold uppercase tracking-widest">Clear Cache System</button>
            </div>
        </section>

        <div id="dashboard-content" class="hidden min-h-screen pb-20"></div>
    </div>

    <script>
        // MASUKKAN URL GOOGLE SCRIPT BOSS DI SINI
        const API_URL = "https://script.google.com/macros/s/AKfycbwcfT14QtXqRW80Gc4p4GjbFY5xx0O_lrygHh9qPxRe6LSYgT6tSJald-Z4U2GOeJPB/exec";

        const formatIDR = (v) => "Rp " + new Intl.NumberFormat('id-ID').format(v);

        // FUNGSI LOGOUT GLOBAL (Ditaruh paling atas agar selalu siap)
        window.forceLogout = function() {
            if(confirm("Boss, yakin ingin keluar & bersihkan sesi?")) {
                localStorage.clear();
                sessionStorage.clear();
                // Redirect ke halaman utama dengan parameter unik untuk mematikan cache
                window.location.href = window.location.pathname + '?v=' + Date.now();
            }
        };

        window.onload = function() {
            try {
                const saved = localStorage.getItem('achi_user_session');
                if (saved) {
                    renderRolePage(JSON.parse(saved));
                } else {
                    document.getElementById('login-page').classList.remove('hidden');
                    document.getElementById('loader').style.display = 'none';
                }
            } catch (e) {
                console.error("Load Error:", e);
                window.forceLogout();
            }
        };

        async function handleLogin() {
            const u = document.getElementById('username').value.trim();
            const p = document.getElementById('password').value.trim();
            if(!u || !p) return;
            
            document.getElementById('loader').style.display = 'flex';
            try {
                const res = await fetch(API_URL, {
                    method: 'POST',
                    body: JSON.stringify({action:'login', username:u, password:p})
                });
                const out = await res.json();
                if(out.success) {
                    localStorage.setItem('achi_user_session', JSON.stringify(out));
                    renderRolePage(out);
                    document.getElementById('login-page').classList.add('hidden');
                } else {
                    alert(out.message);
                    document.getElementById('loader').style.display = 'none';
                }
            } catch(e) {
                alert("Gagal koneksi ke server, Boss.");
                document.getElementById('loader').style.display = 'none';
            }
        }

        async function renderRolePage(res) {
            const loader = document.getElementById('loader');
            loader.style.display = 'flex';
            
            let role = (res.user.role || "").toLowerCase();
            let name = (res.user.username || "").toUpperCase();
            let file = 'crew.html';

            if (role === 'owner' || name === 'HENGKY' || name === 'ACHI') file = 'owner.html';
            else if (role === 'kapten') file = 'kapten.html';
            else if (role === 'accounting') file = 'accounting.html';

            try {
                // ANTI-CACHE: File dipanggil dengan ID unik setiap kali
                const resp = await fetch(file + '?v=' + Date.now());
                if(!resp.ok) throw new Error("File dashboard tidak ditemukan");
                
                const html = await resp.text();
                const dash = document.getElementById('dashboard-content');
                dash.innerHTML = html;
                
                // Distribusi Data
                if(window.initRoleData) {
                    window.initRoleData(res);
                } else {
                    // Jika initRoleData belum siap, tunggu sebentar
                    setTimeout(() => { if(window.initRoleData) window.initRoleData(res); }, 500);
                }
                
                dash.classList.remove('hidden');
            } catch(e) {
                console.error("Render Error:", e);
                alert("Dashboard gagal dimuat. Membersihkan sistem...");
                window.forceLogout();
            } finally {
                loader.style.display = 'none';
            }
        }
    </script>
</body>
</html>
