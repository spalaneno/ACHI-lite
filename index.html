<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Laporan Global - CV EJA</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        body { background: #000; color: #fff; font-family: 'Inter', sans-serif; }
        .card-exec { background: #0a0a0a; border: 1px solid #1a1a1a; border-radius: 1.5rem; }
        .input-exec { background: #111; border: 1px solid #222; color: #fff; border-radius: 0.75rem; padding: 12px; width: 100%; font-size: 13px; }
        
        /* CSS KHUSUS PRINT */
        @media print {
            .no-print { display: none !important; }
            body { background: white !important; color: black !important; padding: 0; }
            .card-exec { border: 1px solid #000 !important; background: white !important; border-radius: 0 !important; color: black !important; }
            .text-green-500, .text-red-500 { color: black !important; font-weight: bold !important; }
            .print-only { display: block !important; }
        }
        .print-only { display: none; }
    </style>
</head>
<body class="p-5">

    <div class="flex justify-between items-center mb-6 no-print">
        <button onclick="location.href='dashboard.html'" class="w-10 h-10 flex items-center justify-center card-exec">
            <i class="fas fa-chevron-left text-gray-500"></i>
        </button>
        <h1 class="text-lg font-black italic uppercase tracking-tighter">Rekap Global</h1>
        <button onclick="window.print()" id="btn-print" class="hidden w-10 h-10 flex items-center justify-center card-exec text-blue-500">
            <i class="fas fa-print"></i>
        </button>
    </div>

    <div class="card-exec p-5 mb-6 no-print">
        <div class="grid grid-cols-2 gap-3 mb-4">
            <div>
                <label class="text-[9px] font-bold text-gray-500 uppercase ml-1">Mulai</label>
                <input type="date" id="start-date" class="input-exec mt-1">
            </div>
            <div>
                <label class="text-[9px] font-bold text-gray-500 uppercase ml-1">Sampai</label>
                <input type="date" id="end-date" class="input-exec mt-1">
            </div>
        </div>
        
        <div class="mb-5">
            <label class="text-[9px] font-bold text-gray-500 uppercase ml-1">Tampilkan Data</label>
            <select id="filter-tipe" class="input-exec mt-1 font-bold">
                <option value="SEMUA">SEMUA TRANSAKSI</option>
                <option value="IN">HANYA PEMASUKAN</option>
                <option value="OUT">HANYA PENGELUARAN</option>
            </select>
        </div>

        <button onclick="prosesLaporan()" class="w-full bg-blue-700 hover:bg-blue-600 py-4 rounded-xl font-black uppercase text-xs tracking-widest transition-all">
            <i class="fas fa-sync-alt mr-2"></i> Tampilkan Laporan
        </button>
    </div>

    <div class="print-only text-center mb-8">
        <h1 class="text-xl font-bold uppercase">LAPORAN KEUANGAN CV. EJA</h1>
        <p id="tgl-cetak" class="text-sm"></p>
        <hr class="border-black mt-4">
    </div>

    <div id="summary" class="hidden grid grid-cols-2 gap-3 mb-6">
        <div class="card-exec p-4 border-l-4 border-green-600">
            <p class="text-[8px] font-bold text-gray-500 uppercase">Pemasukan</p>
            <p id="total-in" class="text-sm font-black text-green-500 mt-1">Rp 0</p>
        </div>
        <div class="card-exec p-4 border-l-4 border-red-600">
            <p class="text-[8px] font-bold text-gray-500 uppercase">Pengeluaran</p>
            <p id="total-out" class="text-sm font-black text-red-500 mt-1">Rp 0</p>
        </div>
    </div>

    <div id="list" class="space-y-3">
        <p id="msg" class="text-center text-gray-600 text-[10px] py-10 uppercase font-black tracking-widest">Pilih kriteria laporan</p>
    </div>

<script>
    // MASUKKAN URL API BOSS DI SINI (HASIL DEPLOY BARU)
    const API_URL = "https://script.google.com/macros/s/AKfycbxAzbSmHvslcbl3y_0_lW5fOAYnAxz2vMOx_AYsmqA5ksAiUMjWTiJZdS0V9chA3Grb/exec";

    function formatKeIndo(tgl) {
        if(!tgl) return "";
        const [y, m, d] = tgl.split("-");
        return `${d}/${m}/${y}`;
    }

    async function prosesLaporan() {
        const startRaw = document.getElementById('start-date').value;
        const endRaw = document.getElementById('end-date').value;
        const tipe = document.getElementById('filter-tipe').value;
        const list = document.getElementById('list');
        const sum = document.getElementById('summary');
        const msg = document.getElementById('msg');
        const btnPrint = document.getElementById('btn-print');

        if(!startRaw || !endRaw) return alert("Tentukan tanggal, Boss!");

        msg.innerHTML = `<i class="fas fa-spinner fa-spin text-blue-500"></i>`;
        list.innerHTML = "";
        sum.classList.add('hidden');
        btnPrint.classList.add('hidden');

        try {
            const startIndo = formatKeIndo(startRaw);
            const endIndo = formatKeIndo(endRaw);
            
            const query = `?action=getRekapGlobal&start=${startIndo}&end=${endIndo}&kapal=SEMUA`;
            const response = await fetch(API_URL + query);
            const res = await response.json();

            // Filter Tipe Data secara Local agar cepat
            let filteredData = res.data;
            if(tipe !== "SEMUA") {
                filteredData = res.data.filter(item => item.tipe === tipe);
            }

            if(filteredData.length === 0) {
                msg.innerHTML = "TIDAK ADA DATA DITEMUKAN";
                return;
            }

            msg.innerHTML = "";
            sum.classList.remove('hidden');
            btnPrint.classList.remove('hidden');
            document.getElementById('tgl-cetak').innerText = `Periode: ${startIndo} - ${endIndo}`;
            
            // Hitung Ulang Summary berdasarkan filter
            let tin = 0; let tout = 0;
            filteredData.forEach(i => i.tipe === "IN" ? tin += i.total : tout += i.total);

            document.getElementById('total-in').innerText = `Rp ${tin.toLocaleString('id-ID')}`;
            document.getElementById('total-out').innerText = `Rp ${tout.toLocaleString('id-ID')}`;

            list.innerHTML = filteredData.map(item => `
                <div class="card-exec p-4 flex justify-between items-center border-r-4 ${item.tipe === 'IN' ? 'border-green-600' : 'border-red-600'}">
                    <div>
                        <p class="text-[8px] text-gray-500 font-bold uppercase">${item.tDisplay} • ${item.kapal}</p>
                        <p class="text-[11px] font-black uppercase italic mt-1">${item.item}</p>
                    </div>
                    <p class="text-sm font-black ${item.tipe === 'IN' ? 'text-green-500' : 'text-red-500'}">
                        ${item.tipe === 'IN' ? '+' : '-'} ${item.total.toLocaleString('id-ID')}
                    </p>
                </div>
            `).join('');

        } catch (e) {
            msg.innerHTML = "KONEKSI DATABASE BERMASALAH";
        }
    }
</script>
</body>
</html>
