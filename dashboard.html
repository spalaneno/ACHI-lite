<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ACHI - DASHBOARD</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        body { background-color: #0b0b0b; color: #fff; font-family: 'Inter', sans-serif; }
        .achi-card { background: linear-gradient(145deg, #1a1a1a, #111); border: 1px solid #222; }
        .icon-box { background: linear-gradient(135deg, #b31d1d, #7a1212); }
    </style>
</head>
<body class="p-6">
    <header class="flex justify-between items-center mb-8">
        <div>
            <h1 id="welcome-name" class="text-2xl font-black italic tracking-tighter uppercase">Halo, -</h1>
            <p id="user-role" class="text-[10px] text-red-500 font-bold tracking-widest uppercase"></p>
        </div>
        <button onclick="logout()" class="w-12 h-12 rounded-2xl bg-white/5 border border-white/10 flex items-center justify-center text-red-500">
            <i class="fas fa-power-off"></i>
        </button>
    </header>

    <div id="saldo-box" class="achi-card p-6 rounded-[2.5rem] mb-8 shadow-2xl border-t-2 border-red-600">
        <div class="flex justify-between items-center">
            <div>
                <p class="text-[10px] text-gray-500 font-bold uppercase mb-1">Saldo/Hutang Anda</p>
                <h2 id="u-saldo" class="text-2xl font-black italic tracking-tight">Rp 0</h2>
            </div>
            <i class="fas fa-wallet text-3xl text-white/10"></i>
        </div>
    </div>

    <div id="menu-grid" class="grid grid-cols-2 gap-4">
        </div>

<script>
    const USER = JSON.parse(localStorage.getItem('achi_session'));
    if(!USER) window.location.href = 'index.html';

    document.getElementById('welcome-name').innerText = "Halo, " + USER.nama;
    document.getElementById('user-role').innerText = USER.jabatan + " | " + USER.kapal;
    document.getElementById('u-saldo').innerText = "Rp " + parseInt(USER.hutang || 0).toLocaleString();

    function renderMenu() {
        const grid = document.getElementById('menu-grid');
        let m = [];

        // Menu Level 4 (Kapten/KKM)
        if(USER.level == 4) {
            m.push({n: "Anfrakan", i: "fa-ship", l: "logistik.html"});
            m.push({n: "Lapor BBM", i: "fa-gas-pump", l: "bbm.html"});
        }
        // Menu Level 1 & 2 (Owner & Admin)
        if(USER.level <= 2) {
            m.push({n: "Bongkar Trip", i: "fa-anchor", l: "trip.html"});
            m.push({n: "Verifikasi", i: "fa-check-double", l: "logistik.html"});
            m.push({n: "Data Hutang", i: "fa-users", l: "kru-list.html"});
        }
        // Menu Level 3 (Purchasing)
        if(USER.level == 3 || USER.level <= 2) {
            m.push({n: "Daftar Beli", i: "fa-shopping-cart", l: "purchasing.html"});
        }

        grid.innerHTML = m.map(item => `
            <div onclick="location.href='${item.l}'" class="achi-card p-6 rounded-[2rem] text-center active:scale-95 transition-all shadow-lg">
                <div class="icon-box w-12 h-12 rounded-2xl flex items-center justify-center mx-auto mb-3 shadow-lg shadow-red-900/20">
                    <i class="fas ${item.i} text-white"></i>
                </div>
                <span class="text-[10px] font-black uppercase tracking-wider text-gray-300">${item.n}</span>
            </div>
        `).join('');
    }

    function logout() { localStorage.clear(); window.location.href = 'index.html'; }
    renderMenu();
</script>
</body>
</html>
