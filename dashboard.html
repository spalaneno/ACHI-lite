<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live Report - CV Efendy Jaya Abadi</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        body { background-color: #030303; color: #fff; font-family: 'Inter', sans-serif; }
        .expense-card { background: linear-gradient(135deg, #1a0000 0%, #080808 100%); border: 1px solid #300; }
        .bar-container { background: #111; border-radius: 10px; height: 8px; overflow: hidden; }
        .bar-fill { background: #b31d1d; height: 100%; transition: width 1s ease-in-out; }
    </style>
</head>
<body class="pb-24">

    <div class="p-8 flex flex-col items-center bg-gradient-to-b from-[#1a0000] to-transparent">
        <img src="logo.png" class="h-16 mb-2">
        <p class="text-[7px] font-black text-red-500 tracking-[0.4em] uppercase">Expense Live Report</p>
    </div>

    <div id="view-owner" class="px-6 mb-8 hidden">
        <div class="expense-card p-8 rounded-[2.5rem] shadow-2xl border border-red-900/30">
            <p class="text-[9px] text-gray-500 font-black uppercase mb-1">Total Pengeluaran Bulan Ini</p>
            <h1 id="ex-total" class="text-3xl font-black italic text-white tracking-tighter">Rp 0</h1>
            
            <div class="mt-8 space-y-4">
                <div>
                    <div class="flex justify-between text-[8px] font-black uppercase mb-1">
                        <span>Nabawi 09</span><span id="txt-nabawi">Rp 0</span>
                    </div>
                    <div class="bar-container"><div id="bar-nabawi" class="bar-fill" style="width: 0%"></div></div>
                </div>
                <div>
                    <div class="flex justify-between text-[8px] font-black uppercase mb-1">
                        <span>Lastika Star</span><span id="txt-lastika">Rp 0</span>
                    </div>
                    <div class="bar-container"><div id="bar-lastika" class="bar-fill" style="width: 0%"></div></div>
                </div>
                <div>
                    <div class="flex justify-between text-[8px] font-black uppercase mb-1">
                        <span>Srikandi 01</span><span id="txt-srikandi">Rp 0</span>
                    </div>
                    <div class="bar-container"><div id="bar-srikandi" class="bar-fill" style="width: 0%"></div></div>
                </div>
            </div>
        </div>
    </div>

    <div id="view-od" class="px-6 mb-8 hidden">
        <div class="bg-[#0a0a0a] p-6 rounded-[2rem] border border-gray-900 flex justify-between items-center">
            <div>
                <p class="text-[8px] text-gray-500 font-black uppercase tracking-widest">Status Accounting</p>
                <h3 class="font-black italic text-sm">Validasi Nota Harian</h3>
            </div>
            <div class="w-10 h-10 rounded-full bg-blue-500/10 flex items-center justify-center text-blue-500">
                <i class="fas fa-file-invoice"></i>
            </div>
        </div>
    </div>

    <div class="px-6 grid grid-cols-2 gap-4" id="menu-grid"></div>

<script>
    const USER = JSON.parse(localStorage.getItem('achi_session'));
    const API = "URL_WEB_APP_BOSS_DI_SINI"; 

    if(!USER) window.location.href = "index.html";

    if(USER.level == 1) {
        document.getElementById('view-owner').classList.remove('hidden');
        loadExpenseStats();
    } else {
        document.getElementById('view-od').classList.remove('hidden');
    }

    async function loadExpenseStats() {
        try {
            const r = await fetch(`${API}?action=getLiveExpense`);
            const d = await r.json();
            
            document.getElementById('ex-total').innerText = `Rp ${d.total.toLocaleString('id-ID')}`;
            
            // Hitung Persentase & Update UI
            const setBar = (id, val, total) => {
                const perc = total > 0 ? (val / total * 100) : 0;
                document.getElementById(`bar-${id}`).style.width = perc + '%';
                document.getElementById(`txt-${id}`).innerText = `Rp ${val.toLocaleString('id-ID')}`;
            };

            setBar('nabawi', d.nabawi, d.total);
            setBar('lastika', d.lastika, d.total);
            setBar('srikandi', d.srikandi, d.total);
        } catch(e) { console.log("Report Error"); }
    }

    const menuGrid = document.getElementById('menu-grid');
    const menus = [
        {n: "REKAP BIAYA", i: "fa-receipt", l: "rekap-biaya.html"},
        {n: "BONGKAR TRIP", i: "fa-anchor", l: "trip.html"},
        {n: "INPUT NOTA", i: "fa-edit", l: "logistik.html"},
        {n: "STOK BBM", i: "fa-gas-pump", l: "bbm.html"}
    ];

    menuGrid.innerHTML = menus.map(m => `
        <div onclick="location.href='${m.l}'" class="bg-[#0a0a0a] p-6 rounded-3xl border border-gray-900 text-center">
            <i class="fas ${m.i} text-[#b31d1d] mb-3 text-lg"></i>
            <p class="text-[9px] font-black uppercase text-gray-300">${m.n}</p>
        </div>
    `).join('');

    function logout() { localStorage.clear(); window.location.href="index.html"; }
</script>
</body>
</html>
