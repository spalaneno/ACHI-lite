<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ACHI - DASHBOARD</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
</head>
<body class="bg-gray-50 min-height-screen">
    <div class="bg-[#b31d1d] p-8 rounded-b-[3rem] shadow-xl mb-8">
        <div class="flex justify-between items-center text-white mb-6">
            <h2 class="font-black italic text-xl uppercase tracking-tighter">ACHI Mobile</h2>
            <button onclick="logout()"><i class="fas fa-power-off"></i></button>
        </div>
        <div class="bg-white/10 p-4 rounded-2xl backdrop-blur-sm border border-white/20">
            <p id="u-nama" class="font-black text-white text-lg uppercase italic">-</p>
            <p id="u-role" class="text-[10px] text-white/70 font-bold uppercase">-</p>
        </div>
    </div>

    <div id="menu-grid" class="p-6 grid grid-cols-2 gap-4">
        </div>

<script>
    const USER = JSON.parse(localStorage.getItem('achi_session'));
    if(!USER) window.location.href = "index.html";

    document.getElementById('u-nama').innerText = USER.nama;
    document.getElementById('u-role').innerText = USER.jabatan + " | " + USER.kapal;

    const grid = document.getElementById('menu-grid');
    let menus = [];

    if(USER.level <= 2) {
        menus.push({n: "BONGKAR TRIP", i: "fa-anchor", l: "trip.html"});
        menus.push({n: "HUTANG KRU", i: "fa-users-cog", l: "kru-list.html"});
        menus.push({n: "BELANJA", i: "fa-shopping-cart", l: "purchasing.html"});
    }
    if(USER.level == 4) {
        menus.push({n: "ANFRAKAN", i: "fa-clipboard-list", l: "logistik.html"});
    }

    grid.innerHTML = menus.map(m => `
        <div onclick="location.href='${m.l}'" class="bg-white p-6 rounded-[2rem] shadow-sm border border-gray-100 text-center active:scale-95 transition-all">
            <div class="w-12 h-12 bg-red-50 text-[#b31d1d] rounded-2xl flex items-center justify-center mx-auto mb-3">
                <i class="fas ${m.i} text-xl"></i>
            </div>
            <p class="text-[10px] font-black text-gray-800 uppercase">${m.n}</p>
        </div>
    `).join('');

    function logout() { localStorage.clear(); window.location.href = "index.html"; }
</script>
</body>
</html>
