<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ACHI - PURCHASING</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        .navy-gradient { background: linear-gradient(-45deg, #0a192f, #112240); }
        .card-buy { background: white; border-left: 6px solid #b31d1d; }
    </style>
</head>
<body class="bg-gray-100 pb-20">
    <header class="navy-gradient p-8 text-white rounded-b-[3rem] shadow-xl mb-8">
        <div class="flex justify-between items-center">
            <div>
                <p class="text-[10px] font-black opacity-60 tracking-widest uppercase text-yellow-500">Logistik & Pengadaan</p>
                <h2 id="user-n" class="text-2xl font-black uppercase"></h2>
            </div>
            <button onclick="logout()" class="w-12 h-12 bg-white/10 rounded-2xl flex items-center justify-center"><i class="fas fa-power-off"></i></button>
        </div>
    </header>

    <main class="px-6">
        <div class="flex justify-between items-center mb-6">
            <h3 class="font-black text-gray-800 italic uppercase">Daftar Pembelian <span class="text-red-600">(Approved)</span></h3>
            <button onclick="refreshData()" class="text-navy-900"><i id="sync-icon" class="fas fa-sync-alt"></i></button>
        </div>

        <div id="data-list" class="space-y-4"></div>
    </main>

<script>
    const API = "https://script.google.com/macros/s/AKfycbxknjxmr96CRRXtgHZbj8j8lprJGBPzUZhv1o6KqxKq1wyd4Y95ZdtuIMZ9FQ4T2XFS/exec";
    const USER = JSON.parse(localStorage.getItem('achi_session'));

    if(!USER || USER.level !== 3) window.location.href = "index.html";
    document.getElementById('user-n').innerText = USER.nama;

    async function refreshData() {
        const l = document.getElementById('data-list'), ic = document.getElementById('sync-icon');
        ic.classList.add('fa-spin');
        try {
            const r = await fetch(`${API}?action=getData&level=${USER.level}`);
            const d = await r.json();
            // Tampilan kartu belanja yang lebih informatif
            l.innerHTML = d.transaksi.length === 0 ? '<p class="text-center py-20 text-gray-400 font-bold">TIDAK ADA BARANG SIAP BELI</p>' : 
            d.transaksi.map(i => `
                <div class="card-buy p-6 rounded-3xl shadow-sm mb-4">
                    <div class="flex justify-between mb-2">
                        <span class="text-[9px] font-bold text-gray-400 uppercase tracking-tighter">${i[9]}</span>
                        <span class="text-[9px] font-bold text-gray-400">${i[1]}</span>
                    </div>
                    <h4 class="text-sm font-black text-gray-800 uppercase">${i[4]}</h4>
                    <div class="mt-4 flex justify-between items-end">
                        <div>
                            <p class="text-[10px] text-gray-400 font-bold uppercase">Jumlah:</p>
                            <p class="text-lg font-black text-red-600 leading-none">${i[6]} <span class="text-xs">${i[5]}</span></p>
                        </div>
                        <button onclick="updateStatus('${i[0]}','DALAM PROSES BELI')" class="bg-gray-800 text-white text-[9px] font-black px-4 py-2 rounded-xl uppercase">Proses Beli</button>
                    </div>
                </div>
            `).join('');
        } catch(e) { l.innerHTML = "Gagal Sinkronisasi"; }
        ic.classList.remove('fa-spin');
    }

    async function updateStatus(id, s) {
        if(!confirm("Barang ini akan mulai diproses beli?")) return;
        await fetch(API, { method: 'POST', body: JSON.stringify({ action: 'changeStatus', id: id, s: s }) });
        refreshData();
    }

    function logout() { localStorage.clear(); window.location.href = "index.html"; }
    refreshData();
</script>
</body>
</html>
